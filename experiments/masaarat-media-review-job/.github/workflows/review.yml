name: S1-01 approved assets motion review only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 verify.py
      - name: Verify and unpack the 697 captured native-object frames
        run: python3 unpack_frames.py
      - name: Assemble accepted narration without TTS
        run: |
          ffmpeg -v error -framerate 30 -i frames/frame-%04d.png -i public/audio/accepted-tools-ar-EG.wav -map 0:v:0 -map 1:a:0 -c:v libx264 -crf 17 -preset slow -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart output/review.mp4
          python3 verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-native-motion-review
          path: output/
          retention-days: 14
