<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masaarat Kids — Level 1 Content</title>
<style>
@font-face{font-family:Cairo;src:url(data:font/ttf;base64,__FONT__)}*{box-sizing:border-box}body{margin:0;background:#F7F8F2;color:#253C50;font:16px/1.85 Cairo,Arial,sans-serif}button,select{font:inherit}button{cursor:pointer}header{padding:22px 5%;display:flex;align-items:center;justify-content:space-between;gap:18px;background:#fff;border-bottom:1px solid #D7E2DE}header img{width:150px;height:68px;object-fit:contain}.controls{display:flex;gap:10px;flex-wrap:wrap}select,button{border:1px solid #BFD3CC;border-radius:13px;padding:9px 16px;background:#fff;color:#253C50}button.active,button[aria-pressed=true]{background:#DCEFE3;border-color:#82C39E}main{max-width:1400px;margin:auto;padding:26px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px}nav{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:9px}nav button{text-align:start;background:#FFFFFFb8}.intro,.panel{padding:24px 30px;border-radius:23px;background:#fff;border:1px solid #DCE6E1;margin-bottom:20px}.intro{background:linear-gradient(125deg,#DCEFE3,#F3EDF8,#FFF7E3)}h1{font-size:31px;margin:8px 0}h2{font-size:24px;margin:4px 0 16px}h3{font-size:19px;margin:12px 0 5px}p{margin:9px 0;white-space:pre-line}.muted{color:#627786;font-size:14px}.pill{display:inline-block;font-size:13px;border-radius:20px;padding:3px 13px;background:#fff}.cards{display:grid;gap:16px}.card,.question,.scene{padding:17px 20px;border-radius:17px;background:#F7FAFC;border:1px solid #E0E8EF}.card:nth-child(3n+2){background:#F6F2FA}.card:nth-child(3n){background:#FFF9E9}ul,ol{padding-inline-start:25px}.answer{background:#E6F2E9;padding:12px 17px;border-radius:12px}.question{margin:15px 0}.materials{background:#FFF9EE}.meta{font-size:14px;color:#657B8A;border-inline-start:3px solid #A797C8;padding-inline-start:12px}details{margin:12px 0}summary{cursor:pointer;font-weight:700}details .scene{margin:12px 0}.divider{border:0;border-top:2px dashed #D0DDD6;margin:40px 0}.hero-subtitle{font-size:20px}.empty{color:#667}.objective{margin:7px 0}footer{text-align:center;color:#71828B;font-size:14px;padding:20px}
@media(max-width:800px){header{align-items:flex-start;flex-direction:column}main{display:block;padding:16px}nav{position:static;display:grid;grid-template-columns:1fr 1fr;margin-bottom:20px}nav button{font-size:13px;padding:10px}.panel,.intro{padding:20px}h1{font-size:26px}.controls{width:100%}.controls select{max-width:100%}}
@media print{header,nav,.controls,footer{display:none}main{display:block;padding:0}.panel,.intro{break-inside:avoid;box-shadow:none}details{display:block}details> :not(summary){display:block}.divider{break-before:page}body{background:#fff;font-size:11pt}}
</style></head><body>
<header><img src="data:image/png;base64,__LOGO__" alt="Masaarat"><div class="controls"><select id="locale" aria-label="Language"><option value="ar-EG">المصرية</option><option value="ar-MSA">العربية الفصحى</option><option value="ar-Gulf">الخليجية</option><option value="en">English</option></select><button id="all" aria-pressed="false"></button><button id="print"></button></div></header>
<main><nav id="nav" aria-label="Lessons"></nav><div id="content"></div></main><footer id="footer"></footer>
<script type="application/json" id="data">__DATA__</script>
<script>
const course=JSON.parse(document.getElementById('data').textContent);let locale='ar-EG',selected=0,all=false;
const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
const words={ar:{heading:'مراجعة محتوى مسارات كيدز',age:'المستوى الأول · ١٠–١٢ سنة',note:'المحتوى النصي للدروس جاهز للمراجعة. وسائط الدرس الأول موجودة في تجربة الدرس؛ فيديوهات وصور الدروس التالية لم تُنتج بعد.',objectives:'ماذا يتعلّم الطفل؟',reading:'الشرح المكتوب',materials:'مواد النشاط والأمثلة التعليمية',prompts:'أمثلة الطلبات',initial:'طلب أولي',improved:'طلب محسّن',followup:'متابعة',activity:'جرّب بنفسك',evidence:'ما يقدّمه الطالب',quiz:'الاختبار',answer:'الإجابة والتفسير',mission:'المهمة ومعاييرها',hints:'تلميحات من الدرس',video:'سيناريو الفيديو',visual:'الحركة المقترحة',image:'موجز الصورة المستقلة',educator:'ملاحظات المعلّم',sampleAnswer:'نموذج إجابة',commonMisconception:'فهم شائع يحتاج تصحيحًا',reviewChecks:'مراجعة المهمة',safetyNotes:'ملاحظة للنشاط',all:'عرض الدروس كلها',one:'عرض درس واحد',print:'طباعة / حفظ PDF',foot:'حزمة تحريرية للمراجعة؛ لا تمثّل نشرًا على المنصة أو اعتمادًا تربويًا نهائيًا.'},en:{heading:'Masaarat Kids content review',age:'Level 1 · Ages 10–12',note:'Lesson text is ready for review. Lesson 1 media remains in the pilot. Videos and images for later lessons have not been produced.',objectives:'Learning objectives',reading:'Written lesson',materials:'Activity materials and teaching examples',prompts:'Prompt examples',initial:'Initial request',improved:'Improved request',followup:'Follow-up',activity:'Try it',evidence:'What the learner submits',quiz:'Quiz',answer:'Answer and explanation',mission:'Mission and criteria',hints:'Lesson-grounded hints',video:'Video script',visual:'Proposed visual action',image:'Independent illustration brief',educator:'Educator notes',sampleAnswer:'Sample response',commonMisconception:'Common misconception',reviewChecks:'Review checks',safetyNotes:'Activity note',all:'Show all lessons',one:'Show one lesson',print:'Print / save PDF',foot:'Editorial review package, not a production release or final educational sign-off.'}};
const para=t=>'<p>'+esc(t)+'</p>',list=a=>'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
function section(title,body,cls=''){return '<section class="panel '+cls+'"><h2>'+esc(title)+'</h2>'+body+'</section>'}
function view(item){
const d=item.locales[locale],w=words[locale==='en'?'en':'ar'];let out='<section class="intro"><span class="pill">'+esc(w.age)+'</span><h1>'+item.number+'. '+esc(d.title)+'</h1><p class="hero-subtitle">'+esc(d.subtitle)+'</p><p class="muted">'+esc(w.note)+'</p></section>';
out+=section(w.objectives,list(d.objectives));
out+=section(w.reading,'<div class="cards">'+d.reading.map(x=>'<article class="card"><h3>'+esc(x.title)+'</h3>'+para(x.text)+'</article>').join('')+'</div>');
if(d.materials?.length)out+=section(w.materials,d.materials.map(x=>'<h3>'+esc(x.title)+'</h3>'+para(x.text)).join(''),'materials');
if(d.promptExamples)out+=section(w.prompts,Object.entries(d.promptExamples).map(([k,v])=>'<h3>'+esc(w[k]||k)+'</h3>'+para(v)).join(''));
if(d.activity)out+=section(w.activity,'<h3>'+esc(d.activity.title)+'</h3>'+para(d.activity.instructions)+para(d.activity.starter)+'<p class="meta">'+esc(w.evidence)+': '+esc(d.activity.expectedEvidence)+'</p>');
out+=section(w.quiz,d.quiz.map((q,i)=>'<article class="question"><h3>'+(i+1)+'. '+esc(q.question)+'</h3><ol>'+q.options.map(o=>'<li>'+esc(o)+'</li>').join('')+'</ol><details><summary>'+esc(w.answer)+'</summary><div class="answer">'+para(q.options[q.answer])+para(q.explanation)+'</div></details></article>').join(''));
out+=section(w.mission,'<h3>'+esc(d.mission.title)+'</h3>'+para(d.mission.instructions)+list(d.mission.rubric));
out+=section(w.hints,d.hints.map(h=>'<details><summary>'+esc(h.question)+'</summary>'+para(h.answer)+'</details>').join(''));
out+=section(w.video,'<details class="script"><summary>'+esc(w.video)+'</summary>'+d.scenes.map((s,i)=>'<article class="scene"><h3>'+(i+1)+'. '+esc(s.title)+'</h3>'+para(s.narration)+(s.visualAction?'<p class="meta">'+esc(w.visual)+': '+esc(s.visualAction)+'</p>':'')+'</article>').join('')+'</details>');
const im=d.imageBrief||{};out+=section(w.image,'<h3>'+esc(im.title||'')+'</h3>'+para(im.scenario)+para(im.composition)+(im.labels?list(im.labels):'')+para(im.altText)+(im.constraints?list(im.constraints):''));
if(d.educatorNotes)out+=section(w.educator,'<details><summary>'+esc(w.educator)+'</summary>'+Object.entries(d.educatorNotes).map(([k,v])=>'<h3>'+esc(w[k]||k)+'</h3>'+(Array.isArray(v)?list(v):para(v))).join('')+'</details>');
return out;
}
function render(){const w=words[locale==='en'?'en':'ar'];document.documentElement.dir=locale==='en'?'ltr':'rtl';document.documentElement.lang=locale==='en'?'en':'ar';document.title=w.heading;document.getElementById('all').textContent=all?w.one:w.all;document.getElementById('all').setAttribute('aria-pressed',String(all));document.getElementById('print').textContent=w.print;document.getElementById('footer').textContent=w.foot;document.getElementById('nav').innerHTML=course.map((l,i)=>'<button data-index="'+i+'" class="'+(i===selected?'active':'')+'">'+l.number+'. '+esc(l.locales[locale].title)+'</button>').join('');document.getElementById('content').innerHTML=(all?course:[course[selected]]).map(view).join('<hr class="divider">');}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-index]');if(!b)return;selected=Number(b.dataset.index);all=false;render();window.scrollTo(0,0)});
document.getElementById('locale').addEventListener('change',e=>{locale=e.target.value;render()});document.getElementById('all').addEventListener('click',()=>{all=!all;render()});document.getElementById('print').addEventListener('click',()=>{document.querySelectorAll('details').forEach(d=>d.open=true);window.print()});render();
</script></body></html>
