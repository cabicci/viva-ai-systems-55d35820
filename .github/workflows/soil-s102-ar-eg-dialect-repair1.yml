name: Soil S1-02 Arabic dialect repair1 only
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths: [experiments/course-pipeline/rebuild/s102-ar-eg-dialect-repair1/media-request.json]
permissions:
  contents: read
concurrency:
  group: soil-s102-ar-eg-dialect-repair1-${{ github.ref }}
  cancel-in-progress: false
env:
  PACKAGE: experiments/course-pipeline/rebuild/s102-ar-eg-dialect-repair1
  PYTHONUNBUFFERED: '1'
jobs:
  repair:
    if: github.ref == 'refs/heads/work/soil-course-pipeline-20261013'
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python "$PACKAGE/repair_audio.py" validate
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: experiments/course-pipeline/rebuild/s102-ar-eg-dialect-repair1/output
          key: soil-s102-ar-eg-dialect-repair1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: soil-s102-ar-eg-dialect-repair1-
      - name: One repair call per scoped Arabic cell; no other locale or asset generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: python "$PACKAGE/repair_audio.py" audio
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always()
        with:
          path: experiments/course-pipeline/rebuild/s102-ar-eg-dialect-repair1/output
          key: soil-s102-ar-eg-dialect-repair1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s102-ar-eg-dialect-repair1
          retention-days: 30
          compression-level: 0
          path: experiments/course-pipeline/rebuild/s102-ar-eg-dialect-repair1/output/
