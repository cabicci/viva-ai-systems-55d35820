name: Locale Phase 13B Full Generation

# Phase 13B — 300-cell learner package generation (100 × ar-MSA learner-final, ar-Gulf, en).
# GitHub Actions matrix limit is 256 jobs; generation runs as 30 shard jobs (10 lessons × 3 locales).
# Default: dry-run only — no paid OpenAI calls, no package writes.

on:
  workflow_dispatch:
    inputs:
      source_scope:
        description: "Canonical source scope"
        required: true
        type: choice
        options:
          - ar-MSA
        default: ar-MSA
      target_locales:
        description: "Target locales (all | ar-MSA | ar-Gulf | en | comma-separated subset)"
        required: true
        type: string
        default: all
      lesson_ids:
        description: "Optional comma-separated lesson IDs (limits all selected locales)"
        required: false
        type: string
        default: ""
      retry_cells:
        description: "Retry-only-failed locale/lessonId pairs or JSON retryCells array"
        required: false
        type: string
        default: ""
      dry_run:
        description: "When true, deterministic/mock validation only — no writes"
        required: true
        type: boolean
        default: true
      confirm_write:
        description: "Must be true with dry_run=false to write lesson JSON"
        required: true
        type: boolean
        default: false
      confirm_paid_api:
        description: "Must be true with dry_run=false for ar-Gulf/en OpenAI calls"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: locale-phase13b-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      planned_cells: ${{ steps.plan.outputs.planned_cells }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate workflow inputs
        env:
          SOURCE_SCOPE: ${{ inputs.source_scope }}
          TARGET_LOCALES: ${{ inputs.target_locales }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_WRITE: ${{ inputs.confirm_write }}
          CONFIRM_PAID_API: ${{ inputs.confirm_paid_api }}
        run: |
          set -euo pipefail
          case "$SOURCE_SCOPE" in
            ar-MSA) ;;
            *)
              echo "Unsupported source_scope: $SOURCE_SCOPE"
              exit 1
              ;;
          esac
          if [ "$DRY_RUN" = "false" ] && [ "$CONFIRM_WRITE" != "true" ]; then
            echo "Refusing write run: set confirm_write=true when dry_run=false"
            exit 1
          fi
          if [ "$DRY_RUN" = "false" ] && [ "$CONFIRM_PAID_API" != "true" ]; then
            echo "Note: ar-Gulf/en cells require confirm_paid_api=true when dry_run=false"
          fi

      - name: Build Phase 13B workflow shard matrix
        id: set-matrix
        env:
          SOURCE_SCOPE: ${{ inputs.source_scope }}
          TARGET_LOCALES: ${{ inputs.target_locales }}
          LESSON_IDS: ${{ inputs.lesson_ids }}
          RETRY_CELLS: ${{ inputs.retry_cells }}
        run: |
          set -euo pipefail
          ARGS=(--source_scope "$SOURCE_SCOPE" --target_locales "$TARGET_LOCALES" --matrix_format workflow-shard)
          if [ -n "$LESSON_IDS" ]; then
            ARGS+=(--lesson_ids "$LESSON_IDS")
          fi
          if [ -n "$RETRY_CELLS" ]; then
            ARGS+=(--retry_cells "$RETRY_CELLS")
          fi
          MATRIX=$(bun scripts/locale-lessons/print-phase13b-full-matrix.ts "${ARGS[@]}")
          {
            echo "matrix<<EOF"
            printf '%s\n' "$MATRIX"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Emit full plan summary
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_SCOPE: ${{ inputs.source_scope }}
          TARGET_LOCALES: ${{ inputs.target_locales }}
          LESSON_IDS: ${{ inputs.lesson_ids }}
          RETRY_CELLS: ${{ inputs.retry_cells }}
        run: |
          set -euo pipefail
          PLAN=$(bun -e "
          import { buildPhase13BFullMatrix, localesFromPhase13BTarget, parsePhase13BRetryCellsArg, parsePhase13BTargetLocales, parseLessonIdsArg } from './scripts/locale-lessons/lib/phase13b-full-matrix.ts';

          const target = parsePhase13BTargetLocales(process.env.TARGET_LOCALES ?? 'all');
          const retryCells = process.env.RETRY_CELLS ? parsePhase13BRetryCellsArg(process.env.RETRY_CELLS) : undefined;
          const lessonIdsOverride = process.env.LESSON_IDS ? parseLessonIdsArg(process.env.LESSON_IDS) : undefined;
          const matrix = await buildPhase13BFullMatrix({
            sourceScope: 'ar-MSA',
            targetLocales: localesFromPhase13BTarget(target),
            lessonIdsOverride,
            retryCells,
          });
          console.log(JSON.stringify({ planned: matrix.length }));
          ")
          echo "planned_cells=$(echo "$PLAN" | jq -r '.planned')" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Phase 13B planned cells: $(echo "$PLAN" | jq -r '.planned')"

  generate-shard:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Phase 13B shard batch
        env:
          OPENAI_API_KEY: ${{ secrets.new_openai }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_WRITE: ${{ inputs.confirm_write }}
          CONFIRM_PAID_API: ${{ inputs.confirm_paid_api }}
        run: |
          set -euo pipefail
          ARGS=(
            --source_scope "${{ matrix.source_scope }}"
            --locale "${{ matrix.locale }}"
            --lesson_ids "${{ matrix.lesson_ids }}"
          )
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry_run true)
          else
            ARGS+=(--dry_run false --confirm_write "$CONFIRM_WRITE" --confirm_paid_api "$CONFIRM_PAID_API")
          fi
          bun run scripts/locale-lessons/run-phase13b-locale-batch.ts "${ARGS[@]}"

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-phase13b-shard-${{ matrix.locale }}-${{ matrix.shard_index }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            src/lib/locale-lessons/ar-MSA/reports/phase13b-full-jobs/${{ matrix.locale }}/*.result.json
            src/lib/locale-lessons/ar-MSA/reports/phase13b-generated-packages/${{ matrix.locale }}/*.json

  collect-report:
    needs: [prepare-matrix, generate-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download shard artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: locale-phase13b-shard-*
          merge-multiple: false
          path: phase13b-artifacts

      - name: Collect Phase 13B full report
        env:
          SOURCE_SCOPE: ${{ inputs.source_scope }}
          TARGET_LOCALES: ${{ inputs.target_locales }}
          LESSON_IDS: ${{ inputs.lesson_ids }}
          RETRY_CELLS: ${{ inputs.retry_cells }}
          DRY_RUN: ${{ inputs.dry_run }}
          PLANNED_CELLS: ${{ needs.prepare-matrix.outputs.planned_cells }}
        run: |
          set -euo pipefail
          ARGS=(
            --source_scope "$SOURCE_SCOPE"
            --target_locales "$TARGET_LOCALES"
            --artifacts-dir phase13b-artifacts
          )
          if [ -n "$LESSON_IDS" ]; then
            ARGS+=(--lesson_ids "$LESSON_IDS")
          fi
          if [ -n "$RETRY_CELLS" ]; then
            ARGS+=(--retry_cells "$RETRY_CELLS")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry_run true)
          else
            ARGS+=(--dry_run false)
          fi
          bun run scripts/locale-lessons/collect-phase13b-full-report.ts "${ARGS[@]}"
          REPORT=$(cat src/lib/locale-lessons/ar-MSA/reports/phase13b-full-report.json)
          echo "$REPORT" | jq '{planned, dryRunOk, lessonJsonPresent, generated: (.generated|length), failed: (.failed|length), skipped: (.skipped|length), retryCells}'
          if [ "$DRY_RUN" = "true" ]; then
            PLANNED=$(echo "$REPORT" | jq -r '.planned')
            DRY_OK=$(echo "$REPORT" | jq -r '.dryRunOk')
            FAILED=$(echo "$REPORT" | jq -r '.failed | length')
            SKIPPED=$(echo "$REPORT" | jq -r '.skipped | length')
            if [ "$PLANNED" = "0" ]; then
              echo "Refusing empty Phase 13B dry-run plan"
              exit 1
            fi
            if [ "$DRY_OK" != "$PLANNED" ] || [ "$FAILED" != "0" ] || [ "$SKIPPED" != "0" ]; then
              echo "Dry-run incomplete: planned=$PLANNED dryRunOk=$DRY_OK failed=$FAILED skipped=$SKIPPED"
              exit 1
            fi
          else
            PLANNED=$(echo "$REPORT" | jq -r '.planned')
            GENERATED=$(echo "$REPORT" | jq -r '.generated | length')
            LESSON_JSON=$(echo "$REPORT" | jq -r '.lessonJsonPresent')
            FAILED=$(echo "$REPORT" | jq -r '.failed | length')
            SKIPPED=$(echo "$REPORT" | jq -r '.skipped | length')
            RETRY_COUNT=$(echo "$REPORT" | jq -r '.retryCells | length')
            if [ "$PLANNED" = "0" ]; then
              echo "Refusing empty Phase 13B paid plan"
              exit 1
            fi
            if [ "$GENERATED" != "$PLANNED" ] || [ "$LESSON_JSON" != "$PLANNED" ] || [ "$FAILED" != "0" ] || [ "$SKIPPED" != "0" ] || [ "$RETRY_COUNT" != "0" ]; then
              echo "Paid run incomplete: planned=$PLANNED generated=$GENERATED lessonJsonPresent=$LESSON_JSON failed=$FAILED skipped=$SKIPPED retryCells=$RETRY_COUNT"
              exit 1
            fi
          fi

      - name: Validate localization contract (repo unchanged packages)
        run: bun run scripts/locale-lessons/validate-localization-contract.ts

      - name: Upload Phase 13B report bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-phase13b-full-report-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            src/lib/locale-lessons/ar-MSA/reports/phase13b-full-report.json
            src/lib/locale-lessons/ar-MSA/reports/phase13b-full-jobs/**/*.result.json
            src/lib/locale-lessons/ar-MSA/reports/phase13b-generated-packages/**/*.json
