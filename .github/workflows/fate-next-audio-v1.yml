name: Fate L02-L07 Arabic Pro and English listening proof v1
on:
  push:
    branches: [work/masaarat/0c0df2131ade371ac908def0]
    paths: [experiments/course-pipeline/rebuild/fate-L02-L07-bilingual-v1/audio/request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: fate-L02-L07-audio-v1
  cancel-in-progress: false
env:
  PACKAGE: experiments/course-pipeline/rebuild/fate-L02-L07-bilingual-v1/audio
  EXPECTED_REQUEST_SHA256: fecf97ecbe726706d06515c7f31dff040c7b61cbdf7a6e9c4502889a9dcafa8b
  PYTHONUNBUFFERED: '1'
jobs:
  audio:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: ["EN-proof-Kore-v1", "EN-proof-Charon-v1", "L02-S01-ar-v1", "L02-S02-ar-v1", "L02-S03-ar-v1", "L02-S04-ar-v1", "L02-S05-ar-v1", "L02-S06-ar-v1", "L02-S07-ar-v1", "L02-S08-ar-v1", "L03-S01-ar-v1", "L03-S02-ar-v1", "L03-S03-ar-v1", "L03-S04-ar-v1", "L03-S05-ar-v1", "L03-S06-ar-v1", "L04-S01-ar-v1", "L04-S02-ar-v1", "L04-S03-ar-v1", "L04-S04-ar-v1", "L04-S05-ar-v1", "L04-S06-ar-v1", "L04-S07-ar-v1", "L05-S01-ar-v1", "L05-S02-ar-v1", "L05-S03-ar-v1", "L05-S04-ar-v1", "L05-S05-ar-v1", "L05-S06-ar-v1", "L06-S01-ar-v1", "L06-S02-ar-v1", "L06-S03-ar-v1", "L06-S04-ar-v1", "L06-S05-ar-v1", "L06-S06-ar-v1", "L06-S07-ar-v1", "L07-S01-ar-v1", "L07-S02-ar-v1", "L07-S03-ar-v1", "L07-S04-ar-v1", "L07-S05-ar-v1", "L07-S06-ar-v1", "L07-S07-ar-v1", "L07-S08-ar-v1", "L07-S09-ar-v1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate one complete passage after model availability check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python "$PACKAGE/generate.py" "${{ matrix.part }}"
      - name: Deliver each original immediately before review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-next-audio-${{ matrix.part }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
      - name: Blind and reference actual-audio checks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python "$PACKAGE/review.py" "${{ matrix.part }}"
      - name: Compare new Arabic passage with accepted same-voice reference
        if: success() && !startsWith(matrix.part, 'EN-')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python "$PACKAGE/continuity.py" "${{ matrix.part }}"
      - name: Deliver each actual review immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-next-review-${{ matrix.part }}
          path: |
            ${{ env.PACKAGE }}/output/review/
            ${{ env.PACKAGE }}/output/continuity/
            ${{ env.PACKAGE }}/output/review-summary.json
          retention-days: 30
