name: s302-fifteen-contexts bounded audio diagnostics
'on':
  push:
    branches:
    - work/soil-s302-fifteen-contexts-20261023-r1
    paths:
    - s302-fifteen-contexts/request.json
permissions:
  contents: read
concurrency:
  group: s302-fifteen-contexts-5c5c8653a2548ecfc29743b7217f45e9a3148cf1205cc37c04efe4e6713a665a
  cancel-in-progress: false
env:
  PACKAGE: s302-fifteen-contexts
  REQUEST_SHA: 5c5c8653a2548ecfc29743b7217f45e9a3148cf1205cc37c04efe4e6713a665a
  WORKER_SHA: cb23cd76c8ccf547bcb94cc70ace9ade73192acdbbfee832ea2978d9d5f6a244
  FREEZE_SHA: e95adb5abfd6d1d04595e93ce211a8feaa609cabd9d37498fed49e30005c1e88
  BRANCH_CREATED: ${{ github.event.created }}
  REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
  PYTHONUNBUFFERED: '1'
jobs:
  review:
    if: github.run_attempt == 1 && github.repository_id == '1272666418' && github.repository == 'cabicci/viva-ai-systems-55d35820'
      && github.ref == 'refs/heads/work/soil-s302-fifteen-contexts-20261023-r1' && github.event.created == true && github.event.before
      == '0000000000000000000000000000000000000000' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Verify exact original sixsecond PCM and finitebudget
      id: validate
      run: 'cd "$PACKAGE"

        python worker.py validate

        '
    - name: Preserve exact context before onlyreview
      id: audio
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s302-fifteen-contexts-r1-inputs
        path: ${{ env.PACKAGE }}/inputs/
        if-no-files-found: error
        retention-days: 30
    - name: Record immutable context upload
      id: receipt
      env:
        AID: ${{ steps.audio.outputs.artifact-id }}
        DIGEST: ${{ steps.audio.outputs.artifact-digest }}
      run: 'cd "$PACKAGE"

        python worker.py uploaded --artifact-id "$AID" --artifact-digest "$DIGEST"

        '
    - name: One unhinted review C01
