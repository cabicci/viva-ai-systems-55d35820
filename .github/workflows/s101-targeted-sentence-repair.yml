name: S1-01 three bounded source sentence repairs
on:
  push:
    branches: [work/soil-s101-targeted-sentence-repair-20261022-r1]
    paths: [targeted-sentence-repair/request.json]
permissions:
  contents: read
concurrency:
  group: s101-targeted-source-sentence-478efe48e871c70f4ea5abecf248ab982128d50c6ae0a21c3b409add9a260d50
  cancel-in-progress: false
env:
  PACKAGE: targeted-sentence-repair
  REQUEST_SHA: 478efe48e871c70f4ea5abecf248ab982128d50c6ae0a21c3b409add9a260d50
  WORKER_SHA: abc39a3802cc9bbfe3e93aa5ccd2ba10abc69e4a91ae81c9202ce9f6974c19af
  FREEZE_SHA: 3790380d54a0e2353dd14cd8cb5cc34a156c7c41fb3ca513fe95cbce45e0c285
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
  BRANCH_CREATED: ${{ github.event.created }}
  REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
jobs:
  repair:
    if: github.run_attempt == 1 && github.repository == 'cabicci/viva-ai-systems-55d35820' && github.ref == 'refs/heads/work/soil-s101-targeted-sentence-repair-20261022-r1' && github.event.created == true && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate exact finite request and preserved original PCM
        run: |
          cd "$PACKAGE"
          python worker.py validate
          python worker.py analyze-originals
      - name: Preserve original WAVs and measured candidate quiet-window analysis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-targeted-originals-and-analysis
          path: |
            ${{ env.PACKAGE }}/originals/
            ${{ env.PACKAGE }}/output/original-analysis.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify both exact preferred models without fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py preflight
      - name: Install hash-verified Whisper before any generation
        run: |
          cd "$PACKAGE"
          python -m pip download --no-deps --dest wheels faster-whisper==1.2.1
          python worker.py verify-wheel
          python -m pip install --disable-pip-version-check --report output/pip-install-report.json wheels/faster_whisper-1.2.1-*.whl
      - name: One TTS candidate en-s101-checklist-bounded-sentence-1
        id: tts1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py produce --unit en-s101-checklist-bounded-sentence-1
      - name: Upload completed candidate before diagnostics en-s101-checklist-bounded-sentence-1
        id: upload1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-targeted-en-s101-checklist-bounded-sentence-1-audio
          path: ${{ env.PACKAGE }}/output/en-s101-checklist-bounded-sentence-1/
          if-no-files-found: error
          retention-days: 30
      - name: Record exact upload en-s101-checklist-bounded-sentence-1
        env:
          AUDIO_ARTIFACT_ID: ${{ steps.upload1.outputs.artifact-id }}
          AUDIO_ARTIFACT_DIGEST: ${{ steps.upload1.outputs.artifact-digest }}
        run: |
          cd "$PACKAGE"
          python worker.py uploaded --unit en-s101-checklist-bounded-sentence-1 --artifact-id "$AUDIO_ARTIFACT_ID" --artifact-digest "$AUDIO_ARTIFACT_DIGEST"
      - name: One blind new-original voice comparison en-s101-checklist-bounded-sentence-1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py blind-review --unit en-s101-checklist-bounded-sentence-1
      - name: One actual-audio ASR then source comparison en-s101-checklist-bounded-sentence-1
        run: |
          cd "$PACKAGE"
          python worker.py asr --unit en-s101-checklist-bounded-sentence-1
          python worker.py compare --unit en-s101-checklist-bounded-sentence-1
      - name: Preserve finished or failed diagnostics en-s101-checklist-bounded-sentence-1
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-targeted-en-s101-checklist-bounded-sentence-1-review
          path: ${{ env.PACKAGE }}/output/en-s101-checklist-bounded-sentence-1/
          if-no-files-found: warn
          retention-days: 30
      - name: One TTS candidate de-s101-limits-bounded-sentence-1
        id: tts2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py produce --unit de-s101-limits-bounded-sentence-1
      - name: Upload completed candidate before diagnostics de-s101-limits-bounded-sentence-1
        id: upload2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-targeted-de-s101-limits-bounded-sentence-1-audio
          path: ${{ env.PACKAGE }}/output/de-s101-limits-bounded-sentence-1/
          if-no-files-found: error
          retention-days: 30
      - name: Record exact upload de-s101-limits-bounded-sentence-1
        env:
          AUDIO_ARTIFACT_ID: ${{ steps.upload2.outputs.artifact-id }}
          AUDIO_ARTIFACT_DIGEST: ${{ steps.upload2.outputs.artifact-digest }}
        run: |
          cd "$PACKAGE"
          python worker.py uploaded --unit de-s101-limits-bounded-sentence-1 --artifact-id "$AUDIO_ARTIFACT_ID" --artifact-digest "$AUDIO_ARTIFACT_DIGEST"
      - name: One blind new-original voice comparison de-s101-limits-bounded-sentence-1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py blind-review --unit de-s101-limits-bounded-sentence-1
      - name: One actual-audio ASR then source comparison de-s101-limits-bounded-sentence-1
        run: |
          cd "$PACKAGE"
          python worker.py asr --unit de-s101-limits-bounded-sentence-1
          python worker.py compare --unit de-s101-limits-bounded-sentence-1
      - name: Preserve finished or failed diagnostics de-s101-limits-bounded-sentence-1
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-targeted-de-s101-limits-bounded-sentence-1-review
          path: ${{ env.PACKAGE }}/output/de-s101-limits-bounded-sentence-1/
          if-no-files-found: warn
          retention-days: 30
      - name: One TTS candidate de-s101-limits-bounded-sentence-2
        id: tts3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py produce --unit de-s101-limits-bounded-sentence-2
      - name: Upload completed candidate before diagnostics de-s101-limits-bounded-sentence-2
        id: upload3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-targeted-de-s101-limits-bounded-sentence-2-audio
          path: ${{ env.PACKAGE }}/output/de-s101-limits-bounded-sentence-2/
          if-no-files-found: error
          retention-days: 30
      - name: Record exact upload de-s101-limits-bounded-sentence-2
        env:
          AUDIO_ARTIFACT_ID: ${{ steps.upload3.outputs.artifact-id }}
          AUDIO_ARTIFACT_DIGEST: ${{ steps.upload3.outputs.artifact-digest }}
        run: |
          cd "$PACKAGE"
          python worker.py uploaded --unit de-s101-limits-bounded-sentence-2 --artifact-id "$AUDIO_ARTIFACT_ID" --artifact-digest "$AUDIO_ARTIFACT_DIGEST"
      - name: One blind new-original voice comparison de-s101-limits-bounded-sentence-2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py blind-review --unit de-s101-limits-bounded-sentence-2
      - name: One actual-audio ASR then source comparison de-s101-limits-bounded-sentence-2
        run: |
          cd "$PACKAGE"
          python worker.py asr --unit de-s101-limits-bounded-sentence-2
          python worker.py compare --unit de-s101-limits-bounded-sentence-2
      - name: Preserve finished or failed diagnostics de-s101-limits-bounded-sentence-2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-targeted-de-s101-limits-bounded-sentence-2-review
          path: ${{ env.PACKAGE }}/output/de-s101-limits-bounded-sentence-2/
          if-no-files-found: warn
          retention-days: 30
      - name: Verify terminal finite budget and unapproved integration status
        run: |
          cd "$PACKAGE"
          python worker.py summarize
      - name: Preserve entire bounded attempt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-three-source-sentence-repair-complete
          retention-days: 30
          path: |
            ${{ env.PACKAGE }}/output/
            ${{ env.PACKAGE }}/request.json
            ${{ env.PACKAGE }}/worker.py
            ${{ env.PACKAGE }}/freeze.json
            ${{ env.PACKAGE }}/runtime.json
            ${{ env.PACKAGE }}/owner-authority.json
            ${{ env.PACKAGE }}/source-sentence-proposals.json
