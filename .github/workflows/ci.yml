name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency advisory gate
        run: bun audit

      - name: Setup Python for workflow pin validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify immutable action references
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-action-pins.txt
          python -m unittest discover -s scripts -p test_verify_action_pins.py
          python scripts/verify_action_pins.py

      - name: Backup key text conversion (synthetic keys only)
        run: python -m unittest discover -s scripts/recovery -p 'test_*.py'

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Mission answer restoration and quiz ownership (isolated clients)
        run: >-
          bunx vitest run
          src/lib/__tests__/mission-view-isolation.test.tsx
          src/lib/__tests__/quiz-view-isolation.test.tsx
          src/lib/__tests__/mission-saved-evaluation.test.ts
          src/lib/__tests__/mission-submission-recovery.test.ts
          src/lib/__tests__/quiz-block-trusted-writer.test.tsx
          src/lib/__tests__/locale-package-live-mission.test.tsx
          src/lib/__tests__/locale-package-live-quiz.test.tsx
          src/lib/__tests__/mission-ai-evaluation-authority.test.ts
          src/lib/__tests__/mission-ai-reveal-authority.test.ts
          src/lib/__tests__/mission-evaluation-source.test.ts
          src/lib/__tests__/mission-model-answer.test.ts
          src/lib/__tests__/mission-feedback-grounding.test.ts
          src/lib/__tests__/mission-ai-prompts.test.ts

      - name: Restricted lesson inline formatting (isolated renderer)
        run: bunx vitest run src/components/intro/IntroLessonRenderer.formatting.test.tsx src/components/intro/SystemsViewReadingAid.test.tsx src/components/intro/ToolsVendorReferences.test.tsx

      - name: Analytics and optional start localization (mocked clients, no AI calls)
        run: bunx vitest run src/lib/__tests__/analytics-start-localization.test.tsx

      - name: Reviewed quiz actions and risk-qualified mission contracts
        run: bunx vitest run src/lib/__tests__/reviewed-quiz-actions.test.ts src/lib/__tests__/adapt-package-to-live-quiz.test.ts

      - name: Reviewed module outcome ownership and legacy routes
        run: bunx vitest run src/components/intro/value-hooks.test.ts

      - name: Restored guided missions (isolated clients, no submissions)
        run: bunx vitest run src/lib/__tests__/restored-guided-missions.test.tsx

      - name: Localized educational section identity
        run: bunx vitest run src/lib/__tests__/localized-section-role-alignment.test.ts src/lib/__tests__/localized-numbered-explanations.test.ts src/lib/__tests__/locale-strict-visual-hardening.test.tsx

      - name: Exact editorial source provenance (no image regeneration)
        run: bunx vitest run src/lib/__tests__/audit-source-compatibility.test.ts src/lib/__tests__/automation-payback-source.test.ts src/lib/__tests__/lesson-metric-examples.test.ts src/lib/__tests__/contextual-audit-asset-revision.test.ts src/lib/__tests__/weekly-review-video-title.test.ts

      - name: Payment read states (mocked queries, no orders changed)
        run: bunx vitest run src/lib/__tests__/payments-read-states.test.tsx

      - name: Accessible progress values
        run: bunx vitest run src/components/ui/progress.test.tsx

      - name: Build and storage watcher compatibility
        run: bunx vitest run src/lib/__tests__/dependency-watchers.test.ts

      - name: Login and Free CTA regression (isolated clients, no account writes)
        run: >-
          bunx vitest run
          src/lib/__tests__/central1-auth-integration.test.tsx
          src/lib/__tests__/invitation-auth-forms.test.tsx
          src/lib/__tests__/recovery-return-context.test.tsx
          src/lib/__tests__/admin-locale-return.test.ts
          src/lib/__tests__/ssr-admin-auth.test.ts
          src/lib/__tests__/learner-route-guard.test.ts
          src/lib/kids/auth-intent.test.ts
          src/lib/__tests__/locale-auth.test.ts

      - name: Academic written integration (no generation, payments or email sends)
        run: |
          bunx vitest run src/lib/academic-education src/components/academic-education
          bunx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM --skipLibCheck --allowImportingTsExtensions scripts/billing/account-edge-runtime.d.ts supabase/functions/academic-stripe-checkout/index.ts
          node scripts/academic-integration/check-audit-revision.mjs --check
          node scripts/academic-integration/check-completion-revision.mjs --check
          node scripts/academic-integration/check-academic-audit-chain.mjs --check
          node --test scripts/academic-integration/completion-revision.test.mjs scripts/academic-integration/academic-audit-chain.test.mjs scripts/academic-integration/academic-corrections-66-88.test.mjs
          bun run scripts/academic-integration/import.ts --check-source

      - name: Learning lines and shared navigation (isolated clients)
        run: >-
          bunx vitest run
          src/components/journey
          src/lib/journey
          src/lib/__tests__/dashboard-progress-loading.test.ts
          src/components/site/Navbar.test.tsx
          src/components/site/LinePages.test.tsx
          src/lib/kids/kids-nested-routes.test.tsx
          src/components/site/__tests__/Footer.test.tsx
          src/lib/learning-lines.test.ts
          src/lib/kids/lesson-client.test.ts

      - name: Account Auth email localization (no email sends)
        run: >-
          bunx vitest run
          src/lib/__tests__/signup-email.test.tsx
          src/lib/__tests__/platform-mail-copy.test.tsx
          src/lib/__tests__/platform-auth-routing.test.tsx
          src/lib/__tests__/recovery-email.test.tsx

      - name: Stripe billing behavior (isolated PostgreSQL, no network payments)
        run: bunx vitest run --config vitest.billing.config.ts

      - name: Contact rate limiter (isolated PostgreSQL)
        run: bunx vitest run src/lib/__tests__/contact-rate-limit.integration.test.ts

      - name: Contact Edge Function entrypoints
        run: >-
          bunx tsc --noEmit --strict --target ES2022 --module ESNext
          --moduleResolution bundler --lib ES2022,DOM --skipLibCheck
          --allowImportingTsExtensions scripts/email/contact-edge-runtime.d.ts
          supabase/functions/contact-mail-webhook/index.ts
          supabase/functions/account-welcome-job/index.ts

      - name: Contact acknowledgement mail (isolated DB, no sends)
        run: >-
          bunx vitest run
          src/lib/__tests__/contact-mail.test.ts
          src/lib/__tests__/contact-mail-receipt.test.ts
          src/lib/__tests__/contact-mail-outbox.integration.test.ts
          src/lib/__tests__/contact-mail-immediate.integration.test.ts
          src/lib/__tests__/contact-mail-server.test.ts
          src/lib/__tests__/contact-mail-streams.test.ts
          src/lib/__tests__/contact-form-server.test.ts
          src/lib/__tests__/account-welcome-job.test.ts
          src/lib/__tests__/account-welcome-server.test.ts
          src/lib/__tests__/mail-dispatch-server.test.ts
          src/lib/__tests__/account-welcome-immediate.integration.test.ts
          src/lib/__tests__/auth-context-initial-session.test.tsx

      - name: RAG corpus access policy (isolated PostgreSQL, no indexing)
        run: >-
          bunx vitest run
          src/lib/__tests__/rag-corpus-rls.integration.test.ts
          src/lib/__tests__/rag-migration-security.test.ts

      - name: Account deletion lifecycle and worker (isolated PostgreSQL and mocked providers)
        run: >-
          bunx vitest run
          src/lib/__tests__/account-deletion-lifecycle.integration.test.ts
          src/lib/__tests__/account-financial-retention.integration.test.ts
          src/lib/__tests__/account-financial-retention-worker.test.ts
          src/lib/__tests__/account-lifecycle-edge.test.ts
          src/lib/__tests__/account-lifecycle-scheduled.test.ts
          src/lib/__tests__/account-deletion-worker.test.ts
          src/lib/__tests__/kids-checkout-deletion.test.ts

      - name: Account lifecycle Edge entrypoints
        run: >-
          bunx tsc --noEmit --strict --target ES2022 --module ESNext
          --moduleResolution bundler --lib ES2022,DOM --skipLibCheck
          --allowImportingTsExtensions scripts/billing/account-edge-runtime.d.ts
          supabase/functions/account-deletion-job/index.ts
          supabase/functions/billing-stripe-webhook/index.ts

      - name: Kids country release and parent access (isolated, no child data)
        run: |
          node scripts/kids/test_market_release_migration.mjs
          node scripts/kids/test_consent_migration.mjs
          node scripts/kids/test_retention_migration.mjs
          node scripts/email/test_welcome_migration.mjs
          node scripts/email/test_branded_mail_migration.mjs
          bunx vitest run src/components/kids/KidsParentRequest.test.tsx src/components/kids/KidsConsentControl.test.tsx src/lib/kids/parent-state.test.tsx src/lib/kids/family-policy.test.ts src/components/kids/KidsFamilyPricing.test.tsx
          bunx vitest run src/lib/kids/retention-worker.test.ts src/lib/__tests__/resend-transport.test.ts
          bunx vitest run src/lib/kids/kids-direct-lesson.test.tsx src/lib/kids/kids-nested-routes.test.tsx src/components/site/LinePages.test.tsx src/lib/__tests__/entitlements.test.ts

      - name: Localization contract
        run: bun run scripts/locale-lessons/validate-localization-contract.ts

      - name: Locale regression tests (Phase 12.6)
        run: >-
          bunx vitest run
          src/lib/__tests__/locale-learn-chrome-5a.test.ts
          src/lib/__tests__/locale-intro-chrome-5b.test.ts
          src/lib/__tests__/locale-mission-chrome-5c.test.ts
          src/lib/__tests__/locale-chrome-parity-6.test.ts
          src/lib/__tests__/locale-localization-contract-validators.test.ts
          src/lib/__tests__/auth-context-initial-session.test.tsx
          src/lib/__tests__/launch-account-deletion-coverage.test.ts
          src/lib/__tests__/security-batch-b.test.ts
          src/lib/__tests__/scale-batch-b.test.ts
          src/lib/__tests__/locale-phase13a-pilot-manifest.test.ts
          src/lib/__tests__/locale-phase13a-pilot-collector.test.ts
          src/lib/__tests__/locale-phase13a-pilot-sanitize-output.test.ts

      - name: Technical integration (private assets and isolated billing)
        run: |
          bun run scripts/technical-education/import.ts --prepare
          bunx vitest run src/lib/technical-education src/components/technical-education src/components/furniture-pilot
          bunx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM --skipLibCheck --allowImportingTsExtensions scripts/billing/account-edge-runtime.d.ts supabase/functions/technical-stripe-checkout/index.ts supabase/functions/billing-stripe-portal/index.ts

      - name: Build
        run: bun run build

      - name: Marketing consent and public route metadata
        run: >-
          bunx vitest run
          src/lib/__tests__/marketing-foundation.test.ts
          src/lib/__tests__/marketing-conversions.test.ts
          src/lib/__tests__/contact-conversion.test.tsx
          src/lib/__tests__/contact-field-errors.test.tsx
          src/lib/__tests__/marketing-route-head.test.tsx
          src/lib/__tests__/locale-public-pages.test.ts
          src/lib/__tests__/locale-route-meta.test.ts
