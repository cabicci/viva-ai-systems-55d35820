name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Python for workflow pin validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify immutable action references
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-action-pins.txt
          python -m unittest discover -s scripts -p test_verify_action_pins.py
          python scripts/verify_action_pins.py

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Stripe billing behavior (isolated PostgreSQL, no network payments)
        run: bunx vitest run --config vitest.billing.config.ts

      - name: Contact rate limiter (isolated PostgreSQL)
        run: bunx vitest run src/lib/__tests__/contact-rate-limit.integration.test.ts

      - name: Localization contract
        run: bun run scripts/locale-lessons/validate-localization-contract.ts

      - name: Locale regression tests (Phase 12.6)
        run: >-
          bunx vitest run
          src/lib/__tests__/locale-learn-chrome-5a.test.ts
          src/lib/__tests__/locale-intro-chrome-5b.test.ts
          src/lib/__tests__/locale-mission-chrome-5c.test.ts
          src/lib/__tests__/locale-chrome-parity-6.test.ts
          src/lib/__tests__/locale-localization-contract-validators.test.ts
          src/lib/__tests__/auth-context-initial-session.test.tsx
          src/lib/__tests__/launch-account-deletion-coverage.test.ts
          src/lib/__tests__/security-batch-b.test.ts
          src/lib/__tests__/scale-batch-b.test.ts
          src/lib/__tests__/locale-phase13a-pilot-manifest.test.ts
          src/lib/__tests__/locale-phase13a-pilot-collector.test.ts
          src/lib/__tests__/locale-phase13a-pilot-sanitize-output.test.ts

      - name: Build
        run: bun run build

      - name: Marketing consent and public route metadata
        run: >-
          bunx vitest run
          src/lib/__tests__/marketing-foundation.test.ts
          src/lib/__tests__/marketing-route-head.test.tsx
          src/lib/__tests__/locale-public-pages.test.ts
          src/lib/__tests__/locale-route-meta.test.ts
