name: Video Production Full 300 — Localized Batch

# Full 300-cell localized video production (100 × en, ar-MSA, ar-Gulf).
# Manual dispatch only — Lovable is the authorized dispatcher.
# Generation stops at validated per-cell GitHub artifacts (no Bunny, no mapping commits).

on:
  workflow_dispatch:
    inputs:
      retry_failed_only:
        description: "Run only cells without a valid production result for the pinned source SHA"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: video-full-300-localized-v1
  cancel-in-progress: false

env:
  SOURCE_SHA: 9ece45762d040f3fcc708887e0fee2913d7ba1c1
  RESULTS_BRANCH: video-results
  OFFICIAL_LOGO_PATH: public/brand/masaarat-logo-lockup.png
  OFFICIAL_LOGO_SHA256: 60620006f7f74dcc625ccbd9869a19b45a7683fde04b729694b1c76d1a51d706
  BATCH_ID: video-full-300-localized-v1

jobs:
  plan:
    name: Validate and plan full 300-cell matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}

    steps:
      - name: Check out immutable production source baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify pinned source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify official Masaarat logo
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OFFICIAL_LOGO_PATH"
          test "$(
            sha256sum "$OFFICIAL_LOGO_PATH" | awk '{print $1}'
          )" = "$OFFICIAL_LOGO_SHA256"

      - name: Fetch results branch (read-only retry evidence)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "${RESULTS_BRANCH}:refs/remotes/origin/${RESULTS_BRANCH}" \
            || echo "No ${RESULTS_BRANCH} branch yet — retry will treat all cells as pending."

      - name: Build full 300-cell matrix
        id: plan
        shell: bash
        env:
          RETRY_INPUT: ${{ inputs.retry_failed_only }}
        run: |
          set -euo pipefail

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess
          from pathlib import Path

          source_sha = os.environ["SOURCE_SHA"]
          logo_sha = os.environ["OFFICIAL_LOGO_SHA256"]
          results_ref = "origin/video-results"
          retry_only = os.environ.get("RETRY_INPUT", "false").lower() == "true"

          locales = ("ar-MSA", "ar-Gulf", "en")
          voice_profiles = {
              "ar-MSA": "gemini-ar-msa-formal",
              "ar-Gulf": "gemini-ar-gulf",
              "en": "gemini-en-narrator",
          }

          former_pilot = {
              "ar-MSA::analyst-m3-l2-ai-summarization",
              "ar-Gulf::analyst-m3-l2-ai-summarization",
              "en::analyst-m3-l2-ai-summarization",
              "ar-MSA::intro-m1-l4-ai-can-cannot",
              "ar-Gulf::intro-m1-l4-ai-can-cannot",
              "en::intro-m1-l4-ai-can-cannot",
          }

          approved: list[dict] = []
          corpus_ids: set[str] = set()

          for locale in locales:
              manifest_path = Path(
                  "src/lib/locale-lessons", locale, "manifest.json"
              )
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              lesson_ids = manifest.get("lessonIds") or []
              if len(lesson_ids) != 100:
                  raise SystemExit(
                      f"{locale} manifest has {len(lesson_ids)} lessons, expected 100"
                  )
              for lesson_id in lesson_ids:
                  if locale == "ar-EG":
                      raise SystemExit("ar-EG cells are forbidden")
                  cell_id = f"{locale}::{lesson_id}"
                  composite_key = f"{lesson_id}__{locale}"
                  package_path = (
                      f"src/lib/locale-lessons/{locale}/lessons/{lesson_id}.json"
                  )
                  if not Path(package_path).is_file():
                      raise SystemExit(f"Missing package: {package_path}")
                  approved.append(
                      {
                          "locale": locale,
                          "lessonId": lesson_id,
                          "cellId": cell_id,
                          "compositeKey": composite_key,
                          "packagePath": package_path,
                          "voiceProfileId": voice_profiles[locale],
                      }
                  )
                  corpus_ids.add(lesson_id)

          assert len(approved) == 300
          assert len({cell["cellId"] for cell in approved}) == 300
          assert len({cell["compositeKey"] for cell in approved}) == 300
          assert sum(cell["locale"] == "en" for cell in approved) == 100
          assert sum(cell["locale"] == "ar-MSA" for cell in approved) == 100
          assert sum(cell["locale"] == "ar-Gulf" for cell in approved) == 100
          assert {cell["cellId"] for cell in approved} >= former_pilot
          assert all(
              cell["compositeKey"] == f'{cell["lessonId"]}__{cell["locale"]}'
              for cell in approved
          )
          assert all(cell["locale"] != "ar-EG" for cell in approved)

          def git_exists(path: str) -> bool:
              result = subprocess.run(
                  ["git", "cat-file", "-e", f"{results_ref}:{path}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              return result.returncode == 0

          def git_json(path: str) -> dict:
              raw = subprocess.check_output(
                  ["git", "show", f"{results_ref}:{path}"],
                  text=True,
              )
              return json.loads(raw)

          def has_valid_result(cell: dict) -> bool:
              root = (
                  "video-production/full-300/"
                  f"{source_sha}/{cell['locale']}/{cell['lessonId']}"
              )
              status_path = f"{root}/status.json"
              validation_path = f"{root}/validation.json"

              if not git_exists(status_path) or not git_exists(validation_path):
                  return False

              status = git_json(status_path)
              validation = git_json(validation_path)

              return (
                  status.get("cellId") == cell["cellId"]
                  and status.get("locale") == cell["locale"]
                  and status.get("lessonId") == cell["lessonId"]
                  and status.get("sourceSha") == source_sha
                  and status.get("compositeKey") == cell["compositeKey"]
                  and status.get("outputStatus") in {"validated", "artifact"}
                  and bool(status.get("videoChecksum"))
                  and validation.get("ok") is True
                  and validation.get("logoChecksum") == logo_sha
                  and validation.get("hasAudio") is True
                  and validation.get("hasVideo") is True
                  and validation.get("hasCaptions") is True
                  and float(validation.get("durationSeconds", 0)) > 0
              )

          if retry_only:
              matrix = [cell for cell in approved if not has_valid_result(cell)]
          else:
              matrix = approved

          print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          print(f"count={len(matrix)}")
          PY

  produce:
    name: ${{ matrix.locale }} — ${{ matrix.lessonId }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    env:
      LID: ${{ matrix.lessonId }}
      LOCALE: ${{ matrix.locale }}
      COMPOSITE_KEY: ${{ matrix.compositeKey }}
      CELL_ID: ${{ matrix.cellId }}
      LESSON_PACKAGE_PATH: ${{ matrix.packagePath }}

    steps:
      - name: Check out immutable production source baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify pinned source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify official Masaarat logo (path + SHA256)
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OFFICIAL_LOGO_PATH"
          ACTUAL=$(sha256sum "$OFFICIAL_LOGO_PATH" | awk '{print $1}')
          test "$ACTUAL" = "$OFFICIAL_LOGO_SHA256"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight — resolve localized package (fails before any paid call)
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/preflight_localized_package.py
          test -f "/tmp/${COMPOSITE_KEY}/evidence.json"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install requests google-genai

      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Install remotion deps
        run: cd remotion && bun install --frozen-lockfile

      - name: Functional locale-aware gate — validate-source-only (no paid calls)
        env:
          LESSON_LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          python3 remotion/scripts/build-lesson.py "$LID" \
            --locale "$LOCALE" \
            --package-path "$LESSON_PACKAGE_PATH" \
            --validate-source-only
          python3 - <<'PY'
          import json, os, pathlib, sys
          composite = os.environ["COMPOSITE_KEY"]
          pre = json.loads(pathlib.Path(f"/tmp/{composite}/evidence.json").read_text())
          bld = json.loads(pathlib.Path(f"/tmp/{composite}/build-evidence.json").read_text())
          expected = {
              "lesson_id": pre["lesson_id"],
              "locale": pre["locale"],
              "package_sha256": pre["package_sha256"],
              "content_fingerprint_sha256": pre["content_fingerprint_sha256"],
              "script_prompt_profile": pre["script_prompt_profile"],
              "tts_prompt_profile": pre["tts_prompt_profile"],
              "tts_model": pre["tts_model"],
              "actual_voice_policy": pre["actual_voice_policy"],
              "egyptian_phonetic_rewrite": pre["egyptian_phonetic_rewrite"],
          }
          got = {k: bld[k] for k in expected}
          mismatches = {k: (expected[k], got[k]) for k in expected if expected[k] != got[k]}
          if mismatches:
              print("::error::Locale-aware gate mismatch (preflight vs builder):")
              for k, (e, g) in mismatches.items():
                  print(f"::error::  {k}: preflight={e!r} builder={g!r}")
              sys.exit(30)
          if bld["locale"] in ("ar-MSA", "ar-Gulf", "en") and bld["egyptian_phonetic_rewrite"]:
              print("::error::egyptian_phonetic_rewrite must be False for locale-aware runs")
              sys.exit(31)
          print(f"::notice::locale-aware gate PASSED for {composite}")
          PY

      - name: Fail-closed locale integrity gate — package projection (no paid calls)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "remotion/scripts")
          from lib.integrity_scenes_from_package import integrity_scenes_from_package  # noqa: E402
          from lib.integrity_validator import validate_localized_scene_integrity  # noqa: E402

          lid = os.environ["LID"]
          locale = os.environ["LOCALE"]
          package_path = Path(os.environ["LESSON_PACKAGE_PATH"])
          pkg = json.loads(package_path.read_text(encoding="utf-8"))
          scenes = integrity_scenes_from_package(pkg, expected_locale=locale)
          result = validate_localized_scene_integrity(
              lesson_id=lid,
              source_package_locale=locale,
              scenes=scenes,
              renderer_locale=locale,
          )
          if not result.ok:
              for issue in result.issues:
                  print(f"::error::{issue.ruleId} {issue.fieldPath}: {issue.message}")
              sys.exit(40)
          print(f"::notice::package integrity gate PASSED for {locale}::{lid} ({len(scenes)} scenes)")
          PY

      - name: Verify paid Gemini secret
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"

      - name: Generate localized video (Gemini script → integrity → TTS → Remotion)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TTS_REQUEST_GAP_SECONDS: "8"
          REMOTION_CONCURRENCY: "2"
          LESSON_LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          mkdir -p "public/lessons/intro"
          python3 remotion/scripts/build-lesson.py "$LID" \
            --locale "$LOCALE" \
            --package-path "$LESSON_PACKAGE_PATH" \
            --force-script
          test -f "public/lessons/intro/${COMPOSITE_KEY}.mp4"

      - name: Validate media and write production result evidence
        shell: bash
        env:
          EXPECTED_VOICE_PROFILE: ${{ matrix.voiceProfileId }}
        run: |
          set -euo pipefail
          MP4="public/lessons/intro/${COMPOSITE_KEY}.mp4"
          CAPTIONS="/tmp/${COMPOSITE_KEY}/captions.vtt"
          AUDIO="/tmp/${COMPOSITE_KEY}/audio/master.mp3"
          OUT_DIR="/tmp/${COMPOSITE_KEY}/production-result"
          mkdir -p "$OUT_DIR"

          test -f "$MP4"
          BYTES=$(stat -c%s "$MP4")
          [ "$BYTES" -ge 200000 ] || { echo "::error::Media too small ($BYTES bytes)"; exit 1; }
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$MP4")
          python3 -c "import sys; sys.exit(0 if float('${DUR}' or 0) > 5 else 1)" \
            || { echo "::error::Duration ${DUR}s too short"; exit 1; }
          AUDIO_STREAM=$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 "$MP4" || true)
          [ -n "$AUDIO_STREAM" ] || { echo "::error::No audio stream in $MP4"; exit 1; }

          export MEDIA_DUR="$DUR"

          python3 - <<'PY'
          import json, os, pathlib, hashlib

          out_dir = pathlib.Path(f"/tmp/{os.environ['COMPOSITE_KEY']}/production-result")
          mp4 = pathlib.Path(f"public/lessons/intro/{os.environ['COMPOSITE_KEY']}.mp4")
          captions = pathlib.Path(f"/tmp/{os.environ['COMPOSITE_KEY']}/captions.vtt")
          audio = pathlib.Path(f"/tmp/{os.environ['COMPOSITE_KEY']}/audio/master.mp3")

          video_sha = hashlib.sha256(mp4.read_bytes()).hexdigest()
          captions_sha = hashlib.sha256(captions.read_bytes()).hexdigest() if captions.is_file() else ""
          logo_sha = os.environ["OFFICIAL_LOGO_SHA256"]

          status = {
              "cellId": os.environ["CELL_ID"],
              "locale": os.environ["LOCALE"],
              "lessonId": os.environ["LID"],
              "compositeKey": os.environ["COMPOSITE_KEY"],
              "sourceSha": os.environ["SOURCE_SHA"],
              "voiceProfileId": os.environ["EXPECTED_VOICE_PROFILE"],
              "outputStatus": "validated",
              "videoChecksum": video_sha,
              "captionsChecksum": captions_sha,
              "batchId": os.environ["BATCH_ID"],
          }
          validation = {
              "ok": True,
              "hasAudio": audio.is_file(),
              "hasVideo": True,
              "hasCaptions": captions.is_file(),
              "durationSeconds": float(os.environ.get("MEDIA_DUR", "0") or 0),
              "logoChecksum": logo_sha,
          }
          (out_dir / "status.json").write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (out_dir / "validation.json").write_text(json.dumps(validation, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if captions.is_file():
              (out_dir / "captions.vtt").write_bytes(captions.read_bytes())
          if audio.is_file():
              (out_dir / "audio.mp3").write_bytes(audio.read_bytes())
          (out_dir / "video.mp4").write_bytes(mp4.read_bytes())
          print(json.dumps({"status": status, "validation": validation}, ensure_ascii=False, indent=2))
          PY

      - name: Upload per-cell validated production artifact (artifact-only output)
        uses: actions/upload-artifact@v4
        with:
          name: full-300-${{ env.SOURCE_SHA }}-${{ matrix.locale }}-${{ matrix.lessonId }}
          path: |
            /tmp/${{ matrix.compositeKey }}/production-result/
            /tmp/${{ matrix.compositeKey }}/evidence.json
            /tmp/${{ matrix.compositeKey }}/build-evidence.json
            /tmp/${{ matrix.compositeKey }}/script-preview.md
          if-no-files-found: error
          retention-days: 14
