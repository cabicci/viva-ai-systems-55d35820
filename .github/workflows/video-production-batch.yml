      - name: Download pinned accepted artifact by ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/finalize-one-artifact
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/finalize-one-artifact.zip
          python3 - <<'PY'
          import hashlib, pathlib, os, sys
          sys.path.insert(0, ".github/scripts")
          from video_finalize.artifact_contract import resolve_production_root
          zpath = pathlib.Path("/tmp/finalize-one-artifact.zip")
          digest = "sha256:" + hashlib.sha256(zpath.read_bytes()).hexdigest()
          expected = os.environ["ARTIFACT_DIGEST"]
          if digest != expected:
              raise SystemExit(f"artifact digest mismatch: {digest} != {expected}")
          import zipfile
          with zipfile.ZipFile(zpath) as zf:
              zf.extractall("/tmp/finalize-one-artifact")
          root = resolve_production_root(pathlib.Path("/tmp/finalize-one-artifact"))
          print(f"::notice::artifact digest verified {digest}; bundle at {root}")
