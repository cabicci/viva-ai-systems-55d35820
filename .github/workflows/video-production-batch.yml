        if: steps.receipt_skip.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TTS_REQUEST_GAP_SECONDS: "8"
          REMOTION_CONCURRENCY: "2"
          LESSON_LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          mkdir -p "public/lessons/intro"
          python3 remotion/scripts/build-lesson.py "$LID" \
            --locale "$LOCALE" \
            --package-path "$LESSON_PACKAGE_PATH" \
            --force-script
          test -f "public/lessons/intro/${COMPOSITE_KEY}.mp4"
          test -f "/tmp/${COMPOSITE_KEY}/captions.vtt" \
            || { echo "::error::build-lesson did not emit captions.vtt"; exit 1; }
          python3 -c "import sys; sys.path.insert(0, 'remotion/scripts'); from lib.captions_vtt import validate_webvtt_file; validate_webvtt_file('/tmp/${COMPOSITE_KEY}/captions.vtt')"

      - name: Validate media and write production result evidence
        if: steps.receipt_skip.outputs.skip != 'true'
        shell: bash
        env:
          EXPECTED_VOICE_PROFILE: ${{ matrix.voiceProfileId }}
        run: |
          set -euo pipefail
          MP4="public/lessons/intro/${COMPOSITE_KEY}.mp4"
          CAPTIONS="/tmp/${COMPOSITE_KEY}/captions.vtt"
          AUDIO="/tmp/${COMPOSITE_KEY}/audio/master.mp3"
          OUT_DIR="/tmp/${COMPOSITE_KEY}/production-result"
          mkdir -p "$OUT_DIR"

          test -f "$MP4"
          test -f "$CAPTIONS" || { echo "::error::Missing captions.vtt at $CAPTIONS"; exit 1; }
          test -f "$AUDIO" || { echo "::error::Missing audio master at $AUDIO"; exit 1; }
          BYTES=$(stat -c%s "$MP4")
          [ "$BYTES" -ge 200000 ] || { echo "::error::Media too small ($BYTES bytes)"; exit 1; }
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$MP4")
          python3 -c "import sys; sys.exit(0 if float('${DUR}' or 0) > 5 else 1)" \
            || { echo "::error::Duration ${DUR}s too short"; exit 1; }
          AUDIO_STREAM=$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 "$MP4" || true)
          [ -n "$AUDIO_STREAM" ] || { echo "::error::No audio stream in $MP4"; exit 1; }

          export MEDIA_DUR="$DUR"

          python3 - <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, "remotion/scripts")
          from lib.production_artifact import stage_production_result

          composite = os.environ["COMPOSITE_KEY"]
          status, validation = stage_production_result(
              out_dir=pathlib.Path(f"/tmp/{composite}/production-result"),
              mp4=pathlib.Path(f"public/lessons/intro/{composite}.mp4"),
              captions=pathlib.Path(f"/tmp/{composite}/captions.vtt"),
              audio=pathlib.Path(f"/tmp/{composite}/audio/master.mp3"),
              status_fields={
                  "cellId": os.environ["CELL_ID"],
                  "locale": os.environ["LOCALE"],
                  "lessonId": os.environ["LID"],
                  "compositeKey": composite,
                  "logicalKey": composite,
                  "sourceSha": os.environ["SOURCE_SHA"],
                  "voiceProfileId": os.environ["EXPECTED_VOICE_PROFILE"],
                  "batchId": os.environ["BATCH_ID"],
              },
              duration_seconds=float(os.environ.get("MEDIA_DUR", "0") or 0),
              logo_sha=os.environ["OFFICIAL_LOGO_SHA256"],
              log_paths=[
                  pathlib.Path(f"/tmp/{composite}/render-lesson.log"),
                  pathlib.Path(f"/tmp/{composite}/script-preview.md"),
              ],
          )
          print(json.dumps({"status": status, "validation": validation}, ensure_ascii=False, indent=2))
          PY

      - name: Upload per-cell validated production artifact (artifact-only output)
        if: steps.receipt_skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: full-300-${{ env.SOURCE_SHA }}-${{ matrix.locale }}-${{ matrix.lessonId }}
          path: |
            /tmp/${{ matrix.compositeKey }}/production-result/
            /tmp/${{ matrix.compositeKey }}/evidence.json
            /tmp/${{ matrix.compositeKey }}/build-evidence.json
            /tmp/${{ matrix.compositeKey }}/script-preview.md
          if-no-files-found: error
          retention-days: 14

      - name: Prepare isolated results worktree repo
        if: steps.receipt_skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/results-repo
          git init /tmp/results-repo
          git -C /tmp/results-repo config user.email "video-finalize@github-actions"
          git -C /tmp/results-repo config user.name "video-finalize"
          git -C /tmp/results-repo remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: Resolve uploaded artifact identity for receipt
        if: steps.receipt_skip.outputs.skip != 'true'
        id: artifact_meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="full-300-${SOURCE_SHA}-${LOCALE}-${LID}"
          ID=$(gh api \
            "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq ".artifacts[] | select(.name==\"${NAME}\") | .id" | head -n1)
          test -n "$ID"
          echo "artifact_id=$ID" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, ".github/scripts")
          from video_finalize.artifact_contract import compute_bundle_digest
          root = pathlib.Path(f"/tmp/{os.environ['COMPOSITE_KEY']}/production-result")
          digest = compute_bundle_digest(root)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"artifact_digest={digest}\n")
          PY

      - name: Finalize Bunny upload + isolated receipt commit (no regeneration)
        if: steps.receipt_skip.outputs.skip != 'true'
        shell: bash
        env:
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
          BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
          PRODUCTION_ROOT: /tmp/${{ matrix.compositeKey }}/production-result
          RESULTS_REPO: /tmp/results-repo
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.artifact_meta.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact_meta.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test -n "${BUNNY_STREAM_API_KEY:-}"
          test -n "${BUNNY_STREAM_LIBRARY_ID:-}"
          python3 .github/scripts/finalize_cell_cli.py

      - name: Skipped — durable finalized receipt present
        if: steps.receipt_skip.outputs.skip == 'true'
        run: |
          if [ "${{ steps.receipt_skip.outputs.carried_forward }}" = "true" ]; then
            echo "::notice::accepted-carried-forward-completed-cell ${{ matrix.compositeKey }}"
          else
            echo "::notice::skipped-success ${{ matrix.compositeKey }}"
          fi

  produce_b:
    name: B — ${{ matrix.locale }} — ${{ matrix.lessonId }}
    needs: [plan, unresolved_plan]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (
        (needs.plan.outputs.run_mode == 'full-300' &&
         needs.unresolved_plan.result == 'skipped' &&
         needs.plan.outputs.count_b != '0') ||
        (needs.plan.outputs.run_mode == 'generate-unresolved' &&
         needs.unresolved_plan.result == 'success' &&
         needs.unresolved_plan.outputs.count_b != '0')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.run_mode == 'generate-unresolved' && needs.unresolved_plan.outputs.matrix_b || needs.plan.outputs.matrix_b) }}

    env:
      LID: ${{ matrix.lessonId }}
      LOCALE: ${{ matrix.locale }}
      COMPOSITE_KEY: ${{ matrix.compositeKey }}
      CELL_ID: ${{ matrix.cellId }}
      LESSON_PACKAGE_PATH: ${{ matrix.packagePath }}
      SOURCE_SHA: 69ba815e256d6f46382c9f0fa901bb3fea88c85b
      PRODUCTION_SOURCE_SHA: 69ba815e256d6f46382c9f0fa901bb3fea88c85b

    steps:
      - name: Check out immutable production source baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FULL_300_SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify pinned full-300 production source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$FULL_300_SOURCE_SHA" = "69ba815e256d6f46382c9f0fa901bb3fea88c85b"
          test "$(git rev-parse HEAD)" = "$FULL_300_SOURCE_SHA"

      - name: Verify official Masaarat logo (path + SHA256)
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OFFICIAL_LOGO_PATH"
          ACTUAL=$(sha256sum "$OFFICIAL_LOGO_PATH" | awk '{print $1}')
          test "$ACTUAL" = "$OFFICIAL_LOGO_SHA256"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Skip paid generation when durable finalized receipt matches
        id: receipt_skip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="video-results--${BATCH_ID}--${COMPOSITE_KEY}"
          mkdir -p /tmp/results-check
          git init /tmp/results-check
          if git -C /tmp/results-check fetch --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH" 2>/dev/null; then
            git -C /tmp/results-check checkout FETCH_HEAD
          fi
          RESULTS_REPO=/tmp/results-check python3 .github/scripts/check_finalized_receipt.py

      - name: Preflight — resolve localized package (fails before any paid call)
        if: steps.receipt_skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/preflight_localized_package.py
          test -f "/tmp/${COMPOSITE_KEY}/evidence.json"

      - uses: actions/setup-node@v4
        if: steps.receipt_skip.outputs.skip != 'true'
        with:
          node-version: "20"

      - uses: oven-sh/setup-bun@v2
        if: steps.receipt_skip.outputs.skip != 'true'
        with:
          bun-version: latest

      - name: Install ffmpeg
        if: steps.receipt_skip.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        if: steps.receipt_skip.outputs.skip != 'true'
        run: pip install requests google-genai

      - name: Install root deps
        if: steps.receipt_skip.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Install remotion deps
        if: steps.receipt_skip.outputs.skip != 'true'
        run: cd remotion && bun install --frozen-lockfile

      - name: Functional locale-aware gate — validate-source-only (no paid calls)
        if: steps.receipt_skip.outputs.skip != 'true'
        env:
          LESSON_LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          python3 remotion/scripts/build-lesson.py "$LID" \
            --locale "$LOCALE" \
            --package-path "$LESSON_PACKAGE_PATH" \
            --validate-source-only
          python3 - <<'PY'
          import json, os, pathlib, sys
          composite = os.environ["COMPOSITE_KEY"]
          pre = json.loads(pathlib.Path(f"/tmp/{composite}/evidence.json").read_text())
          bld = json.loads(pathlib.Path(f"/tmp/{composite}/build-evidence.json").read_text())
          expected = {
              "lesson_id": pre["lesson_id"],
              "locale": pre["locale"],
              "package_sha256": pre["package_sha256"],
              "content_fingerprint_sha256": pre["content_fingerprint_sha256"],
              "script_prompt_profile": pre["script_prompt_profile"],
              "tts_prompt_profile": pre["tts_prompt_profile"],
              "tts_model": pre["tts_model"],
              "actual_voice_policy": pre["actual_voice_policy"],
              "egyptian_phonetic_rewrite": pre["egyptian_phonetic_rewrite"],
          }
          got = {k: bld[k] for k in expected}
          mismatches = {k: (expected[k], got[k]) for k in expected if expected[k] != got[k]}
          if mismatches:
              print("::error::Locale-aware gate mismatch (preflight vs builder):")
              for k, (e, g) in mismatches.items():
                  print(f"::error::  {k}: preflight={e!r} builder={g!r}")
              sys.exit(30)
          if bld["locale"] in ("ar-MSA", "ar-Gulf", "en") and bld["egyptian_phonetic_rewrite"]:
              print("::error::egyptian_phonetic_rewrite must be False for locale-aware runs")
              sys.exit(31)
          print(f"::notice::locale-aware gate PASSED for {composite}")
          PY

      - name: Fail-closed locale integrity gate — package projection (no paid calls)
        if: steps.receipt_skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "remotion/scripts")
          from lib.integrity_scenes_from_package import integrity_scenes_from_package  # noqa: E402
          from lib.integrity_validator import validate_localized_scene_integrity  # noqa: E402

          lid = os.environ["LID"]
          locale = os.environ["LOCALE"]
          package_path = Path(os.environ["LESSON_PACKAGE_PATH"])
          pkg = json.loads(package_path.read_text(encoding="utf-8"))
          scenes = integrity_scenes_from_package(pkg, expected_locale=locale)
          result = validate_localized_scene_integrity(
              lesson_id=lid,
              source_package_locale=locale,
              scenes=scenes,
              renderer_locale=locale,
          )
          if not result.ok:
              for issue in result.issues:
                  print(f"::error::{issue.ruleId} {issue.fieldPath}: {issue.message}")
              sys.exit(40)
          print(f"::notice::package integrity gate PASSED for {locale}::{lid} ({len(scenes)} scenes)")
          PY

      - name: Verify paid Gemini secret
        if: steps.receipt_skip.outputs.skip != 'true'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"

      - name: Generate localized video (Gemini script → integrity → TTS → Remotion)
        if: steps.receipt_skip.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TTS_REQUEST_GAP_SECONDS: "8"
          REMOTION_CONCURRENCY: "2"
          LESSON_LOCALE: ${{ matrix.locale }}
        run: |
          set -euo pipefail
          mkdir -p "public/lessons/intro"
          python3 remotion/scripts/build-lesson.py "$LID" \
            --locale "$LOCALE" \
            --package-path "$LESSON_PACKAGE_PATH" \
            --force-script
          test -f "public/lessons/intro/${COMPOSITE_KEY}.mp4"
          test -f "/tmp/${COMPOSITE_KEY}/captions.vtt" \
            || { echo "::error::build-lesson did not emit captions.vtt"; exit 1; }
          python3 -c "import sys; sys.path.insert(0, 'remotion/scripts'); from lib.captions_vtt import validate_webvtt_file; validate_webvtt_file('/tmp/${COMPOSITE_KEY}/captions.vtt')"

      - name: Validate media and write production result evidence
        if: steps.receipt_skip.outputs.skip != 'true'
        shell: bash
        env:
          EXPECTED_VOICE_PROFILE: ${{ matrix.voiceProfileId }}
        run: |
          set -euo pipefail
          MP4="public/lessons/intro/${COMPOSITE_KEY}.mp4"
          CAPTIONS="/tmp/${COMPOSITE_KEY}/captions.vtt"
          AUDIO="/tmp/${COMPOSITE_KEY}/audio/master.mp3"
          OUT_DIR="/tmp/${COMPOSITE_KEY}/production-result"
          mkdir -p "$OUT_DIR"

          test -f "$MP4"
          test -f "$CAPTIONS" || { echo "::error::Missing captions.vtt at $CAPTIONS"; exit 1; }
          test -f "$AUDIO" || { echo "::error::Missing audio master at $AUDIO"; exit 1; }
          BYTES=$(stat -c%s "$MP4")
          [ "$BYTES" -ge 200000 ] || { echo "::error::Media too small ($BYTES bytes)"; exit 1; }
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$MP4")
          python3 -c "import sys; sys.exit(0 if float('${DUR}' or 0) > 5 else 1)" \
            || { echo "::error::Duration ${DUR}s too short"; exit 1; }
          AUDIO_STREAM=$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 "$MP4" || true)
          [ -n "$AUDIO_STREAM" ] || { echo "::error::No audio stream in $MP4"; exit 1; }

          export MEDIA_DUR="$DUR"

          python3 - <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, "remotion/scripts")
          from lib.production_artifact import stage_production_result

          composite = os.environ["COMPOSITE_KEY"]
          status, validation = stage_production_result(
              out_dir=pathlib.Path(f"/tmp/{composite}/production-result"),
              mp4=pathlib.Path(f"public/lessons/intro/{composite}.mp4"),
              captions=pathlib.Path(f"/tmp/{composite}/captions.vtt"),
              audio=pathlib.Path(f"/tmp/{composite}/audio/master.mp3"),
              status_fields={
                  "cellId": os.environ["CELL_ID"],
                  "locale": os.environ["LOCALE"],
                  "lessonId": os.environ["LID"],
                  "compositeKey": composite,
                  "logicalKey": composite,
                  "sourceSha": os.environ["SOURCE_SHA"],
                  "voiceProfileId": os.environ["EXPECTED_VOICE_PROFILE"],
                  "batchId": os.environ["BATCH_ID"],
              },
              duration_seconds=float(os.environ.get("MEDIA_DUR", "0") or 0),
              logo_sha=os.environ["OFFICIAL_LOGO_SHA256"],
              log_paths=[
                  pathlib.Path(f"/tmp/{composite}/render-lesson.log"),
                  pathlib.Path(f"/tmp/{composite}/script-preview.md"),
              ],
          )
          print(json.dumps({"status": status, "validation": validation}, ensure_ascii=False, indent=2))
          PY

      - name: Upload per-cell validated production artifact (artifact-only output)
        if: steps.receipt_skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: full-300-${{ env.SOURCE_SHA }}-${{ matrix.locale }}-${{ matrix.lessonId }}
          path: |
            /tmp/${{ matrix.compositeKey }}/production-result/
            /tmp/${{ matrix.compositeKey }}/evidence.json
            /tmp/${{ matrix.compositeKey }}/build-evidence.json
            /tmp/${{ matrix.compositeKey }}/script-preview.md
          if-no-files-found: error
          retention-days: 14

      - name: Prepare isolated results worktree repo
        if: steps.receipt_skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/results-repo
          git init /tmp/results-repo
          git -C /tmp/results-repo config user.email "video-finalize@github-actions"
          git -C /tmp/results-repo config user.name "video-finalize"
          git -C /tmp/results-repo remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: Resolve uploaded artifact identity for receipt
        if: steps.receipt_skip.outputs.skip != 'true'
        id: artifact_meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="full-300-${SOURCE_SHA}-${LOCALE}-${LID}"
          ID=$(gh api \
            "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq ".artifacts[] | select(.name==\"${NAME}\") | .id" | head -n1)
          test -n "$ID"
          echo "artifact_id=$ID" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, ".github/scripts")
          from video_finalize.artifact_contract import compute_bundle_digest
          root = pathlib.Path(f"/tmp/{os.environ['COMPOSITE_KEY']}/production-result")
          digest = compute_bundle_digest(root)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"artifact_digest={digest}\n")
          PY

      - name: Finalize Bunny upload + isolated receipt commit (no regeneration)
        if: steps.receipt_skip.outputs.skip != 'true'
        shell: bash
        env:
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
          BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
          PRODUCTION_ROOT: /tmp/${{ matrix.compositeKey }}/production-result
          RESULTS_REPO: /tmp/results-repo
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.artifact_meta.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact_meta.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test -n "${BUNNY_STREAM_API_KEY:-}"
          test -n "${BUNNY_STREAM_LIBRARY_ID:-}"
          python3 .github/scripts/finalize_cell_cli.py

      - name: Skipped — durable finalized receipt present
        if: steps.receipt_skip.outputs.skip == 'true'
        run: |
          if [ "${{ steps.receipt_skip.outputs.carried_forward }}" = "true" ]; then
            echo "::notice::accepted-carried-forward-completed-cell ${{ matrix.compositeKey }}"
          else
            echo "::notice::skipped-success ${{ matrix.compositeKey }}"
          fi

  report:
    name: Collect full-300 production report
    needs: [plan, unresolved_plan, preflight_one, generate_one, finalize_one, produce_a, produce_b]
    if: >-
      always() &&
      (
        needs.plan.outputs.run_mode == 'full-300' ||
        needs.plan.outputs.run_mode == 'generate-unresolved'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out immutable production source baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FULL_300_SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify pinned full-300 production source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$FULL_300_SOURCE_SHA" = "69ba815e256d6f46382c9f0fa901bb3fea88c85b"
          test "$(git rev-parse HEAD)" = "$FULL_300_SOURCE_SHA"

      - name: Check out dispatched workflow control scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control-code
          fetch-depth: 0

      - name: Verify dispatched control SHA (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C control-code rev-parse HEAD)" = "${{ github.sha }}"

      - name: Emit combined batch summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Full-300 artifact + finalization batch report"
          echo "source_sha=${{ env.FULL_300_SOURCE_SHA }}"
          echo "total_count=${{ needs.plan.outputs.total_count }}"
          echo "count_a=${{ needs.plan.outputs.count_a }}"
          echo "count_b=${{ needs.plan.outputs.count_b }}"
          echo "produce_a_result=${{ needs.produce_a.result }}"
          echo "produce_b_result=${{ needs.produce_b.result }}"

      - name: Build expected logical key manifest
        if: always()
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          locales = ("ar-MSA", "ar-Gulf", "en")
          keys = []
          for locale in locales:
              manifest = json.loads(Path(f"src/lib/locale-lessons/{locale}/manifest.json").read_text())
              for lesson_id in manifest["lessonIds"]:
                  keys.append(f"{lesson_id}__{locale}")
          assert len(keys) == 300
          print("expected_keys_json=" + json.dumps(keys, separators=(",", ":")))
          PY

      - name: Fetch result branch receipts (read-only)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/result-branches
          PREFIX="video-results--${BATCH_ID}--"
          mapfile -t REFS < <(
            git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              "refs/heads/${PREFIX}*" | awk '{print $2}' | sed "s#refs/heads/##"
          )
          for branch in "${REFS[@]}"; do
            key="${branch#${PREFIX}}"
            dest="/tmp/result-branches/${key}"
            mkdir -p "$dest"
            git init "$dest" >/dev/null 2>&1
            if git -C "$dest" fetch --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$branch" 2>/dev/null; then
              git -C "$dest" checkout FETCH_HEAD >/dev/null 2>&1 || true
            fi
          done

      - name: Collect durable finalization inventory (read-only)
        if: always()
        id: collector
        shell: bash
        env:
          BATCH_ID: ${{ env.BATCH_ID }}
          EXPECTED_LOGICAL_KEYS_JSON: ${{ steps.manifest.outputs.expected_keys_json }}
          FAILED_LOGICAL_KEYS_JSON: "[]"
          RESULTS_FETCH_DIR: /tmp/result-branches
        run: |
          set -euo pipefail
          python3 .github/scripts/collect_finalization_cli.py | tee collector-report.json

      - name: Collect per-cell artifacts (read-only)
        if: needs.plan.outputs.total_count != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: full-300-${{ env.FULL_300_SOURCE_SHA }}-*
          merge-multiple: true
          path: collected-artifacts
        continue-on-error: true

      - name: Report collected artifact inventory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d collected-artifacts ]; then
            find collected-artifacts -type f | sort | tee collected-files.txt
            echo "collected_file_count=$(find collected-artifacts -type f | wc -l)"
          else
            echo "No collected artifacts directory (zero pending or all produce jobs skipped/failed before upload)."
          fi

      - name: Promote validated finalized receipts to canonical registry
        if: always()
        id: mapping_promotion
        shell: bash
        env:
          BATCH_ID: ${{ env.BATCH_ID }}
          EXPECTED_LOGICAL_KEYS_JSON: ${{ steps.manifest.outputs.expected_keys_json }}
          RESULTS_FETCH_DIR: /tmp/result-branches
          MAPPING_REPO: /tmp/mapping-repo
          MAPPING_REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          DISPATCHED_SHA: ${{ github.sha }}
          PUSH_TO_MAIN: "true"
          MAPPING_COMMIT_MESSAGE: "chore(video): promote finalized localized mappings"
        run: |
          set -uo pipefail
          mkdir -p /tmp/mapping-repo
          PROMOTE_EXIT=0
          python3 control-code/.github/scripts/promote_finalized_mappings_cli.py \
            | tee mapping-promotion-report.json || PROMOTE_EXIT=$?
          if [ "$PROMOTE_EXIT" -eq 40 ] || [ "$PROMOTE_EXIT" -eq 41 ]; then
            exit "$PROMOTE_EXIT"
          fi

      - name: Fail when unresolved cells remain after registry promotion
        if: always() && steps.mapping_promotion.outputs.all_resolved != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Unresolved localized video cells remain after registry promotion"
          echo "unresolved_keys=${{ steps.mapping_promotion.outputs.unresolved_keys }}"
          exit 1
