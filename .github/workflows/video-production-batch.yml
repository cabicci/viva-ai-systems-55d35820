name: Validate completed AI video receipt archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-archive:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify preserved receipts without generation or provider access
        run: python3 scripts/maintenance/preserve_production.py verify
