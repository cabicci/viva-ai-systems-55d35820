name: Exact source completion N08
'on':
  push:
    branches:
    - work/soil-source-completion-n08-20261024-r1
    paths:
    - source-completion-n08/request.json
permissions:
  contents: read
concurrency:
  group: source-completion-n08-e90793237a53acfa61df38fab22ca5b3ae85dacf47bb965243aafd4aa454a3a4
  cancel-in-progress: false
env:
  PACKAGE: source-completion-n08
  REQUEST_SHA: e90793237a53acfa61df38fab22ca5b3ae85dacf47bb965243aafd4aa454a3a4
  WORKER_SHA: 0a26a706fafdd0439a4d49a70fe820486b65a72525e7196f77129d70b7553e63
  FREEZE_SHA: acf21737b46d60472e56e8cfa8e58a04ee5dcbb60c571a65ed796c484f05fe71
  BRANCH_CREATED: ${{ github.event.created }}
  REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
jobs:
  narrate_ar:
    if: github.run_attempt == 1 && github.repository_id == '1272666418' && github.repository == 'cabicci/viva-ai-systems-55d35820'
      && github.ref == 'refs/heads/work/soil-source-completion-n08-20261024-r1' && github.event.created == true && github.event.before
      == '0000000000000000000000000000000000000000' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      LOCALE_LANE: it
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Validate exact fourlocale sourcebindings identity cache and budget
      id: validate
      run: 'cd "$PACKAGE"

        python worker.py validate

        '
    - name: Finite exactpreferred model availability2GET nofallback
      id: preflight
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py preflight

        '
    - name: Install hashverified multilingualWhisper before anyTTS
      id: runtime
      run: 'cd "$PACKAGE"

        python -m pip download --no-deps --dest wheels faster-whisper==1.2.1

        python worker.py verify-wheel

        python -m pip install --disable-pip-version-check --report output/pip-install-report.json wheels/faster_whisper-1.2.1-*.whl

        python worker.py prepare-asr-runtime

        '
    - name: One coherent TTS S3-16-it-R01-meter-subpassage-extra1
      id: tts1
      if: always() && steps.validate.outcome == 'success' && steps.preflight.outcome == 'success' && steps.runtime.outcome
        == 'success'
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py produce --unit S3-16-it-R01-meter-subpassage-extra1

        '
    - name: Upload full immutable audio once S3-16-it-R01-meter-subpassage-extra1
      id: upload1
      if: always() && steps.tts1.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: source-completion-n08-r1-S3-16-it-R01-meter-subpassage-extra1-audio
        path: ${{ env.PACKAGE }}/output/S3-16-it-R01-meter-subpassage-extra1/
        retention-days: 30
        if-no-files-found: error
    - name: Record immutable audio upload S3-16-it-R01-meter-subpassage-extra1
      id: receipt1
      if: always() && steps.upload1.outcome == 'success'
      continue-on-error: true
      env:
        AID: ${{ steps.upload1.outputs.artifact-id }}
        DIGEST: ${{ steps.upload1.outputs.artifact-digest }}
      run: 'cd "$PACKAGE"

        python worker.py uploaded --unit S3-16-it-R01-meter-subpassage-extra1 --artifact-id "$AID" --artifact-digest "$DIGEST"

        '
    - name: blind-review S3-16-it-R01-meter-subpassage-extra1
      if: always() && steps.tts1.outcome == 'success' && steps.upload1.outcome == 'success' && steps.receipt1.outcome == 'success'
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py blind-review --unit S3-16-it-R01-meter-subpassage-extra1

        '
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    - name: asr S3-16-it-R01-meter-subpassage-extra1
      if: always() && steps.tts1.outcome == 'success' && steps.upload1.outcome == 'success' && steps.receipt1.outcome == 'success'
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py asr --unit S3-16-it-R01-meter-subpassage-extra1

        '
    - name: compare S3-16-it-R01-meter-subpassage-extra1
      if: always() && steps.tts1.outcome == 'success' && steps.upload1.outcome == 'success' && steps.receipt1.outcome == 'success'
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py compare --unit S3-16-it-R01-meter-subpassage-extra1

        '
    - name: Stage thin diagnostics S3-16-it-R01-meter-subpassage-extra1
      id: stage1
      if: always()
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py stage-diagnostics --unit S3-16-it-R01-meter-subpassage-extra1

        '
    - name: Preserve thin diagnostics S3-16-it-R01-meter-subpassage-extra1
      if: always() && steps.stage1.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: source-completion-n08-r1-S3-16-it-R01-meter-subpassage-extra1-review
        path: ${{ env.PACKAGE }}/diagnostics-output/S3-16-it-R01-meter-subpassage-extra1/
        retention-days: 30
        if-no-files-found: error
    - name: Lane summary preserves partial failures
      if: always()
      run: 'cd "$PACKAGE"

        python worker.py summarize

        '
    - name: Stage thin complete evidence
      id: stagecomplete
      if: always()
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py stage-complete

        '
    - name: Preserve exact lane evidence
      if: always() && steps.stagecomplete.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: source-completion-n08-r1-it-complete-evidence
        retention-days: 30
        if-no-files-found: error
        include-hidden-files: true
        path: '${{ env.PACKAGE }}/complete-output/

          ${{ env.PACKAGE }}/.gitignore

          ${{ env.PACKAGE }}/README.en.txt

          ${{ env.PACKAGE }}/freeze_package.py

          ${{ env.PACKAGE }}/offline_check.py

          ${{ env.PACKAGE }}/owner-authority.json

          ${{ env.PACKAGE }}/cumulative-attempt-ledger.json

          ${{ env.PACKAGE }}/cache-live-audit.json

          ${{ env.PACKAGE }}/expected-criteria.NOT-FOR-MODEL.json

          ${{ env.PACKAGE }}/provenance/worker-derivation.json

          ${{ env.PACKAGE }}/request.json

          ${{ env.PACKAGE }}/runtime.json

          ${{ env.PACKAGE }}/vendor/course/manifest.json

          ${{ env.PACKAGE }}/vendor/pipeline-engine.py

          ${{ env.PACKAGE }}/worker.py

          ${{ env.PACKAGE }}/provenance/narration-it.json

          ${{ env.PACKAGE }}/thin_artifacts.py

          ${{ env.PACKAGE }}/freeze.json

          .github/workflows/source-completion-n08.yml'
    - name: Preserve raw output receipts independently of staging
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: source-completion-n08-it-raw-preserved
        path: ${{ env.PACKAGE }}/output/
        if-no-files-found: warn
        retention-days: 30
