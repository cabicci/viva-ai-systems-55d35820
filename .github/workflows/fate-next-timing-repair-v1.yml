name: Fate actual-audio timing correction batch 1
on:
  push:
    branches: [work/masaarat/0c0df2131ade371ac908def0]
    paths: [experiments/course-pipeline/rebuild/fate-L02-L07-bilingual-v1/timing-repair-1/request.json]
permissions:
  contents: read
  actions: read
env:
  PACKAGE: experiments/course-pipeline/rebuild/fate-L02-L07-bilingual-v1/timing-repair-1
  EXPECTED_REQUEST_SHA256: 19c85e305c48003d7fb4d73d61a867ed4b746df7610d17c04d3afb02688624a0
jobs:
  analyze:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: ["L02-S02-en-v1", "L02-S05-ar-v1", "L02-S05-en-v1", "L02-S06-ar-v1", "L02-S08-ar-v1", "L02-S08-en-v1", "L04-S03-ar-v1", "L04-S07-ar-v1", "L04-S07-en-v1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve actual alerts and derive acoustic scene cues
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python "$PACKAGE/worker.py" request "${{ matrix.part }}"
      - name: Deliver each result immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-next-timing-v2-${{ matrix.part }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
