name: Soil bounded Arabic existing-voice word timing
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths: [experiments/course-pipeline/rebuild/ar-word-timing-20261020/request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: soil-ar-word-timing-20261020-e52bb3dd549ce03a5d398c111ff6dc65b511e95a0c304b878d786b2fbccd739e
  cancel-in-progress: false
jobs:
  word-timing:
    if: github.ref == 'refs/heads/work/soil-course-pipeline-20261013' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PACKAGE: experiments/course-pipeline/rebuild/ar-word-timing-20261020
      REQUEST_SHA: e52bb3dd549ce03a5d398c111ff6dc65b511e95a0c304b878d786b2fbccd739e
      SCRIPT_SHA: 3e7df525dc6040784292197d8fd5c15c230a2898ac18599a8858d196c4bb750f
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check exact new request and ASR-only engine
        run: |
          echo "$REQUEST_SHA  $PACKAGE/request.json" | sha256sum -c -
          echo "$SCRIPT_SHA  $PACKAGE/word_timing.py" | sha256sum -c -
      - name: Download and verify pinned faster-whisper package
        run: |
          python -m pip download --no-deps --dest "$PACKAGE/wheels" faster-whisper==1.2.1
          python "$PACKAGE/word_timing.py" verify-wheel
      - name: Install pinned package and record resolved dependencies
        run: python -m pip install --disable-pip-version-check --report "$PACKAGE/output/pip-install-report.private.json" "$PACKAGE"/wheels/faster_whisper-1.2.1-*.whl
      - name: Estimate words on only the two verified existing excerpts
        env:
          GH_TOKEN: ${{ secrets.Githubtoken }}
        run: python "$PACKAGE/word_timing.py" transcribe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soil-ar-existing-two-voices-word-timing
          retention-days: 30
          path: experiments/course-pipeline/rebuild/ar-word-timing-20261020/output/
