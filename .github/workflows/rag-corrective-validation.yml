name: RAG Corrective Validation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable RAG candidate commit SHA
        required: false
        default: "8e48d655489fcdfad4df8e33b3c93c61bbde3468"
  push:
    branches:
      - "validation/rag-corrective-*"

permissions:
  contents: read

concurrency:
  group: rag-corrective-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha || github.sha }}
      DOCKER_BIN: docker
      ARTIFACT_NAME: rag-corrective-validation-8e48d65
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.candidate_sha || github.sha }}
          fetch-depth: 1

      - name: Verify candidate SHA
        run: |
          echo "Expected candidate: $CANDIDATE_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA" || \
            echo "WARN: HEAD differs from pinned candidate; validating checked-out tree"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run disposable Docker+Supabase validation
        run: bash .github/rag-validation/run-validation.sh

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-corrective-validation-8e48d65
          path: artifacts/rag/corrective-validation/
          retention-days: 14
