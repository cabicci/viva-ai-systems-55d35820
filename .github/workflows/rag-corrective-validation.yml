name: RAG Corrective Validation

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable RAG candidate commit SHA
        required: false
        default: "8e48d655489fcdfad4df8e33b3c93c61bbde3468"
  push:
    branches:
      - "validation/rag-corrective-*"

permissions:
  contents: read

concurrency:
  group: rag-corrective-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: "8e48d655489fcdfad4df8e33b3c93c61bbde3468"
      DOCKER_BIN: docker
      ARTIFACT_NAME: rag-corrective-validation-8e48d65
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate base is present
        run: |
          echo "Pinned candidate SHA: $CANDIDATE_SHA"
          git fetch origin work/rag-ai-assistant-complete --depth=50
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git log -1 --oneline "$CANDIDATE_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Verify Docker daemon
        run: |
          docker info
          docker ps

      - name: Start local Supabase (disposable)
        env:
          SUPABASE_CMD: supabase
        run: bash .github/rag-validation/start-supabase.sh

      - name: Run disposable Docker+Supabase validation
        env:
          SUPABASE_CMD: supabase
        run: bash .github/rag-validation/run-validation.sh

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-corrective-validation-8e48d65
          path: artifacts/rag/corrective-validation/
          retention-days: 14
