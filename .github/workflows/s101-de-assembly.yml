name: S101 German full first-lesson assembly only
on:
  push:
    branches: [work/soil-s101-de-assembly-20261022-r1]
permissions:
  contents: read
concurrency:
  group: s101-de-assembly-20261022-r1
  cancel-in-progress: false
jobs:
  assemble:
    if: >-
      github.repository == 'cabicci/viva-ai-systems-55d35820' &&
      github.repository_id == '1272666418' &&
      github.ref == 'refs/heads/work/soil-s101-de-assembly-20261022-r1' &&
      github.event_name == 'push' && github.event.created == true &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MANIFEST_SHA: 0996a3c60f672fdc22e76735ef5856d819b056d90fb3d887770a14a099ae04e4
      WORKER_SHA: 82dd50a97318e734cdb3b124d5270936e8f73eefd48abe5c6c307003e9fd7d11
      FREEZE_SHA: 72103b2cb7452562b1e6cc3085b7dd3c384c0226b43f14bb9bd2b3516cef9b05
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure complete video codecs before validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Verify all exact existing inputs and source PCM
        run: python -B media/s101-de-assembly/assemble.py validate
      - name: Assemble ten existing clips with exact original PCM
        run: python -B media/s101-de-assembly/assemble.py execute
      - name: Preserve output and finite command journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s101-de-full-first-lesson-r1
          path: media/s101-de-assembly/output
          if-no-files-found: error
          retention-days: 7
