name: Soil lesson Gemini 3D visual assets
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths: [experiments/course-pipeline/visual-request.json]
permissions:
  contents: read
concurrency:
  group: soil-visuals-${{ github.ref }}
  cancel-in-progress: false
jobs:
  visuals:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: experiments/course-pipeline/output/visuals/cache
          key: soil-gemini-visuals-${{ hashFiles('experiments/course-pipeline/course/visuals.json') }}
          restore-keys: soil-gemini-visuals-
      - name: Generate five shared text-free illustrations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          PYTHONUNBUFFERED: '1'
        run: python3 experiments/course-pipeline/generate_visuals.py generate
      - name: Check the upfront visual contract and repair at most once
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          PYTHONUNBUFFERED: '1'
        run: python3 experiments/course-pipeline/visual_quality.py
      - if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: experiments/course-pipeline/output/visuals/cache
          key: soil-gemini-visuals-${{ hashFiles('experiments/course-pipeline/course/visuals.json') }}-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soil-gemini-3d-visuals
          retention-days: 30
          path: |
            experiments/course-pipeline/output/visuals/*.png
            experiments/course-pipeline/output/visuals/receipt.json
            experiments/course-pipeline/output/visuals/cache/*.png
            experiments/course-pipeline/output/visuals/qa/*.json
