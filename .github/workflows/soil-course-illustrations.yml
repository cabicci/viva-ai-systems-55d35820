name: Soil independent lesson illustrations
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths: [experiments/course-pipeline/production/illustration-request.json]
permissions:
  contents: read
concurrency:
  group: soil-lesson-illustrations-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-22.04
    outputs:
      lessons: ${{ steps.scope.outputs.lessons }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: scope
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          root=Path('experiments/course-pipeline/production')
          p=json.loads((root/'illustration-request.json').read_text())
          assert p['action']=='produce-independent-lesson-illustrations'
          assert len(p['lessons'])==30 and len(set(p['lessons']))==30
          assert set(p['lessons'])==set(json.loads((root/'lesson-illustrations.json').read_text()))
          assert p['expectedImages']==90 and p['publish'] is False
          print('lessons='+json.dumps(p['lessons']))
          PY
  illustrations:
    needs: scope
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lesson: ${{ fromJSON(needs.scope.outputs.lessons) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 -m pip install Pillow==11.3.0
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: experiments/course-pipeline/production/packages/${{ matrix.lesson }}/output/lesson-visuals
          key: soil-lesson-art-${{ matrix.lesson }}-${{ hashFiles('experiments/course-pipeline/production/illustration-request.json') }}
          restore-keys: soil-lesson-art-${{ matrix.lesson }}-
      - name: Generate and check separate teaching illustrations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          LESSON: ${{ matrix.lesson }}
          PYTHONUNBUFFERED: '1'
        run: python3 experiments/course-pipeline/production/lesson_art.py --lesson "$LESSON"
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always()
        with:
          path: experiments/course-pipeline/production/packages/${{ matrix.lesson }}/output/lesson-visuals
          key: soil-lesson-art-${{ matrix.lesson }}-${{ hashFiles('experiments/course-pipeline/production/illustration-request.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soil-illustrations-${{ matrix.lesson }}
          retention-days: 30
          path: experiments/course-pipeline/production/packages/${{ matrix.lesson }}/output/lesson-visuals
