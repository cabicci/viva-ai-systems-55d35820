name: S1-01 one held DE limits coherent full-scene repair
on:
  push:
    branches: [work/soil-s101-de-limits-coherent-repair-20261022-r1]
    paths: [de-limits-coherent-repair/request.json]
permissions:
  contents: read
concurrency:
  group: s101-de-coherent-bcd0f451101b5f9e89ec1cc46972c7dc07af580219ca8eefd684bcda84c08a22
  cancel-in-progress: false
env:
  PACKAGE: de-limits-coherent-repair
  REQUEST_SHA: bcd0f451101b5f9e89ec1cc46972c7dc07af580219ca8eefd684bcda84c08a22
  WORKER_SHA: 12a3507f0a64545da994973dabd6a0c2e93278586a9525bbb4dfb4dee7ff501d
  FREEZE_SHA: ae02f1e45df4e09616d0e9543e858a519feb3e602a94d10b68528a0a06b2eed3
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
  BRANCH_CREATED: ${{ github.event.created }}
  REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
jobs:
  repair:
    if: github.run_attempt == 1 && github.repository == 'cabicci/viva-ai-systems-55d35820' && github.ref == 'refs/heads/work/soil-s101-de-limits-coherent-repair-20261022-r1' && github.event.created == true && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate exact finite request and preserved original PCM
        run: |
          cd "$PACKAGE"
          python worker.py validate
      - name: Preserve immutable original same-role reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-de-coherent-originals-and-analysis
          path: |
            ${{ env.PACKAGE }}/originals/
          if-no-files-found: error
          retention-days: 30
      - name: Verify both exact preferred models without fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py preflight
      - name: Install hash-verified Whisper before any generation
        run: |
          cd "$PACKAGE"
          python -m pip download --no-deps --dest wheels faster-whisper==1.2.1
          python worker.py verify-wheel
          python -m pip install --disable-pip-version-check --report output/pip-install-report.json wheels/faster_whisper-1.2.1-*.whl
      - name: One TTS candidate de-s101-limits-coherent-full-scene-r1
        id: tts1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py produce --unit de-s101-limits-coherent-full-scene-r1
      - name: Upload completed candidate before diagnostics de-s101-limits-coherent-full-scene-r1
        id: upload1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-de-coherent-de-s101-limits-coherent-full-scene-r1-audio
          path: ${{ env.PACKAGE }}/output/de-s101-limits-coherent-full-scene-r1/
          if-no-files-found: error
          retention-days: 30
      - name: Record exact upload de-s101-limits-coherent-full-scene-r1
        env:
          AUDIO_ARTIFACT_ID: ${{ steps.upload1.outputs.artifact-id }}
          AUDIO_ARTIFACT_DIGEST: ${{ steps.upload1.outputs.artifact-digest }}
        run: |
          cd "$PACKAGE"
          python worker.py uploaded --unit de-s101-limits-coherent-full-scene-r1 --artifact-id "$AUDIO_ARTIFACT_ID" --artifact-digest "$AUDIO_ARTIFACT_DIGEST"
      - name: One blind new-original voice comparison de-s101-limits-coherent-full-scene-r1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py blind-review --unit de-s101-limits-coherent-full-scene-r1
      - name: One actual-audio ASR then source comparison de-s101-limits-coherent-full-scene-r1
        run: |
          cd "$PACKAGE"
          python worker.py asr --unit de-s101-limits-coherent-full-scene-r1
          python worker.py compare --unit de-s101-limits-coherent-full-scene-r1
      - name: Preserve finished or failed diagnostics de-s101-limits-coherent-full-scene-r1
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-de-coherent-de-s101-limits-coherent-full-scene-r1-review
          path: ${{ env.PACKAGE }}/output/de-s101-limits-coherent-full-scene-r1/
          if-no-files-found: warn
          retention-days: 30
      - name: Verify terminal finite budget and unapproved integration status
        run: |
          cd "$PACKAGE"
          python worker.py summarize
      - name: Preserve entire bounded attempt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-one-de-coherent-repair-complete
          retention-days: 30
          path: |
            ${{ env.PACKAGE }}/output/
            ${{ env.PACKAGE }}/request.json
            ${{ env.PACKAGE }}/worker.py
            ${{ env.PACKAGE }}/freeze.json
            ${{ env.PACKAGE }}/runtime.json
            ${{ env.PACKAGE }}/owner-authority.json
            ${{ env.PACKAGE }}/cumulative-attempt-ledger.json
            ${{ env.PACKAGE }}/cache-live-audit.json
            ${{ env.PACKAGE }}/expected-criteria.NOT-FOR-MODEL.json
