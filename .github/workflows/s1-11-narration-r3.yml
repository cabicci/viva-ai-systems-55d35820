  FREEZE_SHA: bd951c43860ea9e8f0dc09e330ca389b8f371619ef872ed427bbfda1bcc0ff2b
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
jobs:
  narration:
    if: github.repository == 'cabicci/viva-ai-systems-55d35820' && github.ref == 'refs/heads/work/soil-s111-narration-20261022-r3' && github.event_name == 'push' && github.event.created == true && github.event.deleted == false && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate frozen complete teaching projection and exact fresh-push scope
        run: |
          cd "$PACKAGE"
          python worker.py validate
      - name: Exact preferred-model metadata preflight; no fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py preflight
      - name: Install hash-verified Whisper runtime once
        run: |
          cd "$PACKAGE"
          python -m pip download --no-deps --dest wheels faster-whisper==1.2.1
          python worker.py verify-wheel
          python -m pip install --disable-pip-version-check --report output/pip-install-report.json wheels/faster_whisper-1.2.1-*.whl
      - name: One TTS attempt S1-11-en-r3-001
        id: tts001
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py produce --unit S1-11-en-r3-001
      - name: Immediate audio upload before review S1-11-en-r3-001
        id: upload001
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.tts001.outcome == 'success'
        with:
          name: s111-connected-r3-S1-11-en-r3-001-audio
          path: ${{ env.PACKAGE }}/output/S1-11-en-r3-001/
          if-no-files-found: error
          retention-days: 30
      - name: Bind audio transfer receipt S1-11-en-r3-001
        env:
          AUDIO_ARTIFACT_ID: ${{ steps.upload001.outputs.artifact-id }}
          AUDIO_ARTIFACT_DIGEST: ${{ steps.upload001.outputs.artifact-digest }}
        run: |
          cd "$PACKAGE"
          python worker.py uploaded --unit S1-11-en-r3-001 --artifact-id "$AUDIO_ARTIFACT_ID" --artifact-digest "$AUDIO_ARTIFACT_DIGEST"
      - name: Independent actual-audio diagnostics S1-11-en-r3-001
