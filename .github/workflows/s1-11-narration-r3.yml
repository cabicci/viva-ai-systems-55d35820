on:
  push:
    branches:
      - work/soil-s111-narration-20261022-r3
permissions:
  contents: read
concurrency:
  group: s111-connected-r3-643f062a85d2d2a5636a5f904d9e54ec7560f93abf22eb00c5142cea1c46e906
  cancel-in-progress: false
env:
  PACKAGE: experiments/masaarat-media-review-job/s1-11-narration-r3
