    defaults:
      run:
        working-directory: upload-only/${{ matrix.id }}
    env:
      MANIFEST_SHA: ${{ matrix.manifestSHA }}
      WORKER_SHA: eb75d5da9bd2e24c4be966f51dfb16f7f26b0a194ecf523bc0d7747b50b56f64
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact bounded source and transfer original bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ../worker.py worker.py
          echo "$WORKER_SHA  worker.py" | sha256sum --check --strict
          echo "$MANIFEST_SHA  manifest.json" | sha256sum --check --strict
          python3 worker.py validate
          python3 worker.py prepare
      - name: One source-identity GUID create
        env:
          BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
        run: python3 worker.py create
      - name: Preserve created GUID before upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: created-${{ matrix.id }}
          path: upload-only/${{ matrix.id }}/output/*.json
          if-no-files-found: error
          retention-days: 30
      - name: One unchanged original MP4 upload
        if: success()
        env:
          BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
        run: python3 worker.py upload
      - name: One immediate readiness observation, encoding does not occupy upload lane
        if: success()
        env:
          BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
        run: python3 worker.py readiness
      - name: Preserve per-identity upload outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: outcome-${{ matrix.id }}
          path: upload-only/${{ matrix.id }}/output/*.json
          if-no-files-found: error
          retention-days: 30
