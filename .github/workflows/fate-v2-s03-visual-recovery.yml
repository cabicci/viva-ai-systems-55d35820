name: Fate v2 S03 four display-only repairs reuse exact original clocks
on:
  push:
    branches: [work/masaarat/0c0df2131ade371ac908def0]
    paths: [experiments/course-pipeline/rebuild/fate-course-v2/s03-visual-recovery-v1/request.json]
permissions:
  contents: read
  actions: read
env:
  PACKAGE: experiments/course-pipeline/rebuild/fate-course-v2/s03-visual-recovery-v1
  EXPECTED_REQUEST_SHA256: 4395b2974b28e6671e036cfa4e18b012507b0601726649ba13d8e3343d829157
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
  EXPECTED_IMPLEMENTATION_SHA256: 61c2497ebcbe8ca86f9b7e69185d85192b7912c7017d535a441025bb9acc30d1
jobs:
  scene:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: ["S03-03-ar-EG-visual-r1", "S03-05-ar-EG-visual-r1", "S03-03-en-visual-r1", "S03-05-en-visual-r1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact finite request and implementation pins
        run: |
          python - <<'PY'
          import os,json,hashlib,pathlib
          p=pathlib.Path(os.environ['PACKAGE']);s=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert s(p/'request.json')==os.environ['EXPECTED_REQUEST_SHA256']
          assert s(p/'implementation-pins.en.json')==os.environ['EXPECTED_IMPLEMENTATION_SHA256']
          for n,h in json.loads((p/'implementation-pins.en.json').read_text()).items():assert s(p/n)==h
          PY
      - name: Verify audio gate and actual clock, bind explanatory actions
        run: python "$PACKAGE/prepare.py" "${{ matrix.part }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fate-v2-s03-recovery-clock-${{ matrix.part }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
      - name: Install pinned renderer
        working-directory: experiments/course-pipeline/rebuild/fate-course-v2/s03-visual-recovery-v1
        run: npm ci --no-audit --no-fund
      - name: Render meaningful action checkpoints
        run: node "$PACKAGE/render.cjs" stills
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-v2-s03-recovery-stills-${{ matrix.part }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
      - name: Render single scene and decode actual video checkpoints
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          node "$PACKAGE/render.cjs" video
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fate-v2-s03-recovery-video-${{ matrix.part }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
