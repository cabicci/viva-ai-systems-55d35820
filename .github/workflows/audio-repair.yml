name: S1-01 bounded five-unit audio repair highest Gemini
on:
  workflow_dispatch:
  push:
    branches: [work/soil-s101-audio-repair-20261022]
    paths: [experiments/masaarat-media-review-job/audio-repair/request.json]
permissions:
  contents: read
concurrency:
  group: s101-audio-repair-f8a87ac086c8b449a65daefd1421dff6ed19fb6eaf0d92f7d6ce3cd0c0da297a
  cancel-in-progress: false
env:
  PACKAGE: experiments/masaarat-media-review-job/audio-repair
  REQUEST_SHA: f8a87ac086c8b449a65daefd1421dff6ed19fb6eaf0d92f7d6ce3cd0c0da297a
  WORKER_SHA: b7ff0c03ecb5aaf4490a0d542e3c15924489af1c650412d78c3a6494d0a309fc
  FREEZE_SHA: b01a00d2ba4be76c331bb7d4c8e219eadb22239f03f8fbeb22614069fff2b118
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
jobs:
  repair:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/work/soil-s101-audio-repair-20261022'
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact frozen request and code offline
        run: |
          cd "$PACKAGE"
          python worker.py validate
      - name: Bounded preferred-model metadata preflight, no fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py preflight
      - name: Install hash-verified Whisper wheel once
        run: |
          cd "$PACKAGE"
          python -m pip download --no-deps --dest wheels faster-whisper==1.2.1
          python worker.py verify-wheel
          python -m pip install --disable-pip-version-check --report output/pip-install-report.json wheels/faster_whisper-1.2.1-*.whl
      - name: One TTS request S1-01-ar-002
        id: tts002
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py produce --unit S1-01-ar-002
      - name: Upload audio before review S1-01-ar-002
        id: upload002
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.tts002.outcome == 'success'
        with:
          name: s101-repair-S1-01-ar-002-audio
          path: ${{ env.PACKAGE }}/output/S1-01-ar-002/
          if-no-files-found: error
          retention-days: 30
      - name: Record successful audio transfer S1-01-ar-002
        env:
          AUDIO_ARTIFACT_ID: ${{ steps.upload002.outputs.artifact-id }}
          AUDIO_ARTIFACT_DIGEST: ${{ steps.upload002.outputs.artifact-digest }}
        run: |
          cd "$PACKAGE"
          python worker.py uploaded --unit S1-01-ar-002 --artifact-id "$AUDIO_ARTIFACT_ID" --artifact-digest "$AUDIO_ARTIFACT_DIGEST"
      - name: One blind actual-audio Argon review S1-01-ar-002
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py blind-review --unit S1-01-ar-002
      - name: One actual-audio Whisper transcription S1-01-ar-002
        continue-on-error: true
        run: |
          cd "$PACKAGE"
          python worker.py asr --unit S1-01-ar-002
      - name: Preserve independent comparison and stop if diagnostics incomplete S1-01-ar-002
        run: |
          cd "$PACKAGE"
          python worker.py compare --unit S1-01-ar-002
      - name: Upload immediate review evidence S1-01-ar-002
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s101-repair-S1-01-ar-002-review
          path: ${{ env.PACKAGE }}/output/S1-01-ar-002/
