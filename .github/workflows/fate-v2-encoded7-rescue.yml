name: Fate v2 verify seven preserved encoded movies only
on:
  push:
    branches: [work/masaarat/0c0df2131ade371ac908def0]
    paths: [experiments/course-pipeline/rebuild/fate-course-v2/encoded7-rescue-v1/request.json]
permissions:
  contents: read
  actions: read
env:
  PACKAGE: experiments/course-pipeline/rebuild/fate-course-v2/encoded7-rescue-v1
  MEDIA_TOOLS_PACKAGE: experiments/course-pipeline/rebuild/fate-course-v2/ci-media-tools-v1
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
jobs:
  verify:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: ["preflight", "S02-03-en-provision-r1", "S04-04-ar-EG-provision-r1", "S04-04-en-provision-r1", "S05-01-en-provision-r1", "S06-05-en-provision-r1", "S09-02-ar-EG-provision-r1", "S11-04-en-provision-r1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify frozen source request and implementation
        run: |
          python - <<'PY'
          import pathlib,os,json,hashlib
          p=pathlib.Path(os.environ['PACKAGE']);s=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert s(p/'request.json')=='bba4a554ea06d0edadacfe87cb58808a6dae549dcb03a50550f54db6296bdd97'
          assert s(p/'implementation-pins.en.json')=='8d057741d32202f139c922e493a607d07e4d501f15b2d9105f5fc9a9a19a5486'
          for n,h in json.loads((p/'implementation-pins.en.json').read_text()).items():assert s(p/n)==h
          for n,h in json.loads((p/'request.json').read_text())['bootstrapFiles'].items():assert s(pathlib.Path(n))==h
          PY
      - name: Install exact pinned tiny media tool package
        timeout-minutes: 3
        working-directory: experiments/course-pipeline/rebuild/fate-course-v2/ci-media-tools-v1
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify and expose packaged executables, no apt
        timeout-minutes: 1
        run: node "$MEDIA_TOOLS_PACKAGE/bootstrap.cjs" --dependency-root "$MEDIA_TOOLS_PACKAGE"
      - name: Inspect actual encoders and verify preserved movie without rendering
        timeout-minutes: 7
        run: timeout --signal=TERM --kill-after=15s 6m python "$PACKAGE/verify.py" "${{ matrix.part }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fate-v2-encoded7-rescue-${{ matrix.part }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
