name: Locale Fragment Full Generation

# Sibling to locale-fragment-pilot-generation.yml — do NOT modify the pilot workflow.
# Reuses the approved fragment pipeline (Extract → Adapt text only → Inject →
# Sanitize → Write → Re-read from disk → Validate exact final JSON → Collect bundle).
# Full mode = 100 active lessons per locale, 200 artifacts total.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to run"
        required: true
        type: choice
        options:
          - audit-only
          - full-generation
        default: audit-only
      target:
        description: "Target locale"
        required: true
        type: choice
        options:
          - ar-Gulf
          - en
          - all
        default: all
      lesson_ids:
        description: "Optional comma-separated lesson IDs for retry-only-failed runs (overrides full 100 selection)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: locale-fragment-full-generation-${{ github.ref }}-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  audit-ar-msa:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.audit.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run ar-MSA canonical audit
        id: audit
        run: |
          set -euo pipefail
          bun run locale-lessons:audit-ar-msa-canonical
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-msa-canonical-audit-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: src/lib/locale-lessons/ar-MSA/reports/canonical-audit.json

  prepare-matrix:
    needs: audit-ar-msa
    if: ${{ inputs.phase == 'full-generation' && needs.audit-ar-msa.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build full-mode matrix (100 × locales)
        id: set-matrix
        env:
          TARGET: ${{ inputs.target || 'all' }}
          LESSON_IDS: ${{ inputs.lesson_ids || '' }}
        run: |
          set -euo pipefail
          ARGS=(--target "$TARGET")
          if [ -n "$LESSON_IDS" ]; then ARGS+=(--lesson_ids "$LESSON_IDS"); fi
          MATRIX=$(bun run scripts/locale-lessons/print-fragment-full-matrix.ts "${ARGS[@]}")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  generate-lesson:
    needs: prepare-matrix
    if: ${{ inputs.phase == 'full-generation' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate one fragment lesson (full mode)
        env:
          OPENAI_API_KEY: ${{ secrets.new_openai }}
        run: |
          set -euo pipefail
          # Reuses the approved per-lesson fragment generator. Mode flag stays
          # "pilot" at the per-lesson level because the per-lesson generator
          # doesn't distinguish modes; the FULL collector is what makes this
          # a full-mode run.
          bun run locale-lessons:generate-fragment-pilot -- \
            --target "${{ matrix.locale }}" \
            --lesson-id "${{ matrix.lesson_id }}" \
            --mode pilot
      - name: Upload lesson artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: locale-fragment-full-${{ matrix.locale }}-${{ matrix.lesson_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src/lib/locale-lessons/${{ matrix.locale }}/lessons/${{ matrix.lesson_id }}.json
            src/lib/locale-lessons/${{ matrix.locale }}/reports/fragment-pilot-jobs/${{ matrix.lesson_id }}.result.json
      - name: Upload failed job result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: locale-fragment-full-${{ matrix.locale }}-${{ matrix.lesson_id }}-failed
          if-no-files-found: ignore
          retention-days: 14
          path: |
            src/lib/locale-lessons/${{ matrix.locale }}/reports/fragment-pilot-jobs/${{ matrix.lesson_id }}.result.json

  collect-report:
    needs: [prepare-matrix, generate-lesson]
    if: ${{ always() && inputs.phase == 'full-generation' }}
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target || 'all' }}
      LESSON_IDS: ${{ inputs.lesson_ids || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Download lesson artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: locale-fragment-full-*
          merge-multiple: true
          path: fragment-artifacts
      - name: Collect full fragment artifacts (expects 100/locale)
        run: |
          set -euo pipefail
          ARGS=(--target "$TARGET" --artifacts-dir fragment-artifacts --output-dir collected-full-bundle)
          if [ -n "$LESSON_IDS" ]; then ARGS+=(--lesson_ids "$LESSON_IDS"); fi
          bun run locale-lessons:collect-fragment-full -- "${ARGS[@]}"
      - name: Upload collected full bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-fragment-full-collected-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: collected-full-bundle/**
