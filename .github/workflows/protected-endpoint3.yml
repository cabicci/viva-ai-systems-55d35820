name: Protected source-free endpoint3 evidence
'on':
  push:
    branches:
    - work/soil-protected-endpoint3-20261024-r1
    paths:
    - protected-endpoint3/request.json
permissions:
  contents: read
concurrency:
  group: protected-endpoint3-7f43232d340786f3ab969e72655939274762b1a173a99713f8b51976f206c516
  cancel-in-progress: false
env:
  PACKAGE: protected-endpoint3
  REQUEST_SHA: 7f43232d340786f3ab969e72655939274762b1a173a99713f8b51976f206c516
  WORKER_SHA: 3128f1bc8526c3e6ce3fd3e623eb05c3b41fc3060413d2245042924690755dac
  FREEZE_SHA: ba77fcfceb408cda6ef7368d7476e75d31a9e5d815290880edb8b63f83d7c028
  BRANCH_CREATED: ${{ github.event.created }}
  REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
  PYTHONUNBUFFERED: '1'
jobs:
  review:
    if: github.run_attempt == 1 && github.repository_id == '1272666418' && github.repository == 'cabicci/viva-ai-systems-55d35820'
      && github.ref == 'refs/heads/work/soil-protected-endpoint3-20261024-r1' && github.event.created == true && github.event.before
      == '0000000000000000000000000000000000000000' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Verify exact3 protected PCM contexts and finite3review budget
      id: validate
      run: 'cd "$PACKAGE"

        python worker.py validate

        '
    - name: Preserve exact context before onlyreview
      id: audio
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: protected-endpoint3-r1-inputs
        path: ${{ env.PACKAGE }}/inputs/
        if-no-files-found: error
        retention-days: 30
    - name: Record immutable context upload
      id: receipt
      env:
        AID: ${{ steps.audio.outputs.artifact-id }}
        DIGEST: ${{ steps.audio.outputs.artifact-digest }}
      run: 'cd "$PACKAGE"

        python worker.py uploaded --artifact-id "$AID" --artifact-digest "$DIGEST"

        '
    - name: One exact source-free context P001
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip P001

        '
    - name: Preserve exact evidence P001
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: protected-endpoint3-P001-evidence
        path: ${{ env.PACKAGE }}/output/P001/
        if-no-files-found: warn
        retention-days: 30
    - name: One exact source-free context P002
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip P002

        '
    - name: Preserve exact evidence P002
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: protected-endpoint3-P002-evidence
        path: ${{ env.PACKAGE }}/output/P002/
        if-no-files-found: warn
        retention-days: 30
    - name: One exact source-free context P003
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip P003

        '
    - name: Preserve exact evidence P003
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: protected-endpoint3-P003-evidence
        path: ${{ env.PACKAGE }}/output/P003/
        if-no-files-found: warn
        retention-days: 30
    - name: Preserve all exact payload and partial outcomes
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: protected-endpoint3-r2-evidence
        retention-days: 30
        include-hidden-files: true
        if-no-files-found: error
        path: '${{ env.PACKAGE }}/output/

          ${{ env.PACKAGE }}/README.en.txt

          ${{ env.PACKAGE }}/request.json

          ${{ env.PACKAGE }}/runtime.json

          ${{ env.PACKAGE }}/attempt-ledger.json

          ${{ env.PACKAGE }}/owner-authority.json

          ${{ env.PACKAGE }}/prompts/blind.txt

          ${{ env.PACKAGE }}/provenance/model-availability.json

          ${{ env.PACKAGE }}/provenance/context-proof.json

          ${{ env.PACKAGE }}/worker.py

          ${{ env.PACKAGE }}/offline_check.py

          ${{ env.PACKAGE }}/freeze_package.py

          ${{ env.PACKAGE }}/inputs/P001.wav

          ${{ env.PACKAGE }}/inputs/P002.wav

          ${{ env.PACKAGE }}/inputs/P003.wav

          ${{ env.PACKAGE }}/freeze.json

          .github/workflows/protected-endpoint3.yml'
