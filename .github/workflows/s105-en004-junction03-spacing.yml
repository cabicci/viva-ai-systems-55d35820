name: S105 EN004 one changed junction03 spacing context blind actualaudio reviews
'on':
  push:
    branches:
    - work/soil-s105-en004-junction03-spacing-20261022-r2
    paths:
    - s105-en004-junction03-spacing/request.json
permissions:
  contents: read
concurrency:
  group: s105-en004-junction03-spacing-7bf1af665abc09fb58680b96ac18d5950f6ed5aa4e85950ea8a41a056f873c2b
  cancel-in-progress: false
env:
  PACKAGE: s105-en004-junction03-spacing
  REQUEST_SHA: 7bf1af665abc09fb58680b96ac18d5950f6ed5aa4e85950ea8a41a056f873c2b
  WORKER_SHA: 28d050d7ec4c3718702ad85b0d5fe0f253954d2ce908be788044a9d0c41e394d
  FREEZE_SHA: 30e85279f36965c212fce66fe295d50e187b7956b83609782be89e6b10ae46dc
  BRANCH_CREATED: ${{ github.event.created }}
  REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
jobs:
  review:
    if: github.run_attempt == 1 && github.repository_id == '1272666418' && github.repository == 'cabicci/viva-ai-systems-55d35820'
      && github.ref == 'refs/heads/work/soil-s105-en004-junction03-spacing-20261022-r2' && github.event.created == true &&
      github.event.before == '0000000000000000000000000000000000000000' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Verify exact one changed context PCM/source maps and finite budget
      id: validate
      run: 'cd "$PACKAGE"

        python worker.py validate

        '
    - name: Upload exact existing context01 before any review
      id: context1
      if: always() && steps.validate.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s105-en004-spacing-r2-context-01
        retention-days: 30
        if-no-files-found: error
        path: ${{ env.PACKAGE }}/inputs/context-01.wav
    - name: Record exact uploaded context01
      id: receipt1
      if: always() && steps.validate.outcome == 'success' && steps.context1.outcome == 'success'
      continue-on-error: true
      env:
        AID: ${{ steps.context1.outputs.artifact-id }}
        DIGEST: ${{ steps.context1.outputs.artifact-digest }}
      run: 'cd "$PACKAGE"

        python worker.py uploaded --unit S1-05-en004-junction03-spacing-r2 --artifact-id "$AID" --artifact-digest "$DIGEST"

        '
    - name: One blind actualaudio contextreview01
      id: review1
      if: always() && steps.validate.outcome == 'success' && steps.context1.outcome == 'success' && steps.receipt1.outcome
        == 'success'
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --unit S1-05-en004-junction03-spacing-r2

        '
    - name: Preserve raw parsed or failed diagnostic01
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s105-en004-spacing-r2-review-01
        retention-days: 30
        if-no-files-found: warn
        path: ${{ env.PACKAGE }}/output/S1-05-en004-junction03-spacing-r2/
    - name: Terminal summary never masks incomplete diagnostics
      if: always()
      run: 'cd "$PACKAGE"

        python worker.py summarize

        '
    - name: Preserve entire frozen input and finite diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s105-en004-spacing-r2-complete-evidence
        retention-days: 30
        if-no-files-found: error
        path: '${{ env.PACKAGE }}/

          .github/workflows/s105-en004-junction03-spacing.yml

          '
