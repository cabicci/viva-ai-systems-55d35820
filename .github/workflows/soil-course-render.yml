name: Soil course render with reviewed-source Gemini assets
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths: [experiments/course-pipeline/render-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: soil-final-render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        locale: [ar-EG, en, it, de]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Prepare renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install Pillow==11.3.0
          cd remotion
          bun install --frozen-lockfile
      - name: Download the exact generated assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LOCALE: ${{ matrix.locale }}
        run: |
          AUDIO_RUN=$(python3 -c "import json; print(json.load(open('experiments/course-pipeline/render-request.json'))['audioSourceRunId'])")
          VISUAL_RUN=$(python3 -c "import json; print(json.load(open('experiments/course-pipeline/render-request.json'))['visualSourceRunId'])")
          gh run download "$AUDIO_RUN" --name "soil-pilot-$LOCALE" --dir "experiments/course-pipeline/output/$LOCALE"
          gh run download "$VISUAL_RUN" --name soil-gemini-3d-visuals --dir experiments/course-pipeline/output/visuals
      - name: Verify and render without paid provider credentials
        env:
          LOCALE: ${{ matrix.locale }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -m unittest discover -s experiments/course-pipeline/tests -p 'test_*.py'
          python3 experiments/course-pipeline/pipeline.py produce --locale "$LOCALE" --reuse-audio-only --request-file experiments/course-pipeline/render-request.json
      - if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soil-final-${{ matrix.locale }}
          retention-days: 30
          compression-level: 0
          path: |
            experiments/course-pipeline/output/${{ matrix.locale }}/lesson.mp4
            experiments/course-pipeline/output/${{ matrix.locale }}/master.wav
            experiments/course-pipeline/output/${{ matrix.locale }}/captions.vtt
            experiments/course-pipeline/output/${{ matrix.locale }}/transcript.txt
            experiments/course-pipeline/output/${{ matrix.locale }}/props.json
            experiments/course-pipeline/output/${{ matrix.locale }}/receipt.json
