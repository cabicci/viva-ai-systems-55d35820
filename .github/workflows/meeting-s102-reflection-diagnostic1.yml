name: One complete current S102 reflection source-free diagnostic
'on':
  push:
    branches:
    - work/soil-meeting-s102-reflection-diagnostic1-20261024-r1
    paths:
    - meeting-s102-reflection-diagnostic1/request.json
permissions:
  contents: read
concurrency:
  group: meeting-s102-reflection-diagnostic1-9f3248c2b97c5198fee4f552cfbd997874453cd4cbbcc14862a70e630f5fa3ef
  cancel-in-progress: false
env:
  PACKAGE: meeting-s102-reflection-diagnostic1
  REQUEST_SHA: 9f3248c2b97c5198fee4f552cfbd997874453cd4cbbcc14862a70e630f5fa3ef
  WORKER_SHA: 418dec93bd1c190da812a9433aac20bd872bedfbafab33799ea031bc3e4a23ec
  FREEZE_SHA: fc4cc8ed70744378e31df07c350681dca444446fa214fc968a24dc0786884ddb
  BRANCH_CREATED: ${{ github.event.created }}
  REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
  PYTHONUNBUFFERED: '1'
jobs:
  review:
    if: github.run_attempt == 1 && github.repository_id == '1272666418' && github.repository == 'cabicci/viva-ai-systems-55d35820'
      && github.ref == 'refs/heads/work/soil-meeting-s102-reflection-diagnostic1-20261024-r1' && github.event.created == true
      && github.event.before == '0000000000000000000000000000000000000000' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Verify one exact complete current recording and finite one-review budget
      id: validate
      run: 'cd "$PACKAGE"

        python worker.py validate

        '
    - name: Preserve exact context before onlyreview
      id: audio
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: meeting-s102-reflection-diagnostic1-r1-inputs
        path: ${{ env.PACKAGE }}/inputs/
        if-no-files-found: error
        retention-days: 30
    - name: Record immutable context upload
      id: receipt
      env:
        AID: ${{ steps.audio.outputs.artifact-id }}
        DIGEST: ${{ steps.audio.outputs.artifact-digest }}
      run: 'cd "$PACKAGE"

        python worker.py uploaded --artifact-id "$AID" --artifact-digest "$DIGEST"

        '
    - name: One source-free complete current reflection F001
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip F001

        '
    - name: Preserve exact current reflection diagnostic
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: meeting-s102-reflection-diagnostic1-F001-evidence
        path: ${{ env.PACKAGE }}/output/F001/
        if-no-files-found: warn
        retention-days: 30
    - name: Preserve all exact payload and partial outcomes
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: meeting-s102-reflection-diagnostic1-r2-evidence
        retention-days: 30
        include-hidden-files: true
        if-no-files-found: error
        path: '${{ env.PACKAGE }}/output/

          ${{ env.PACKAGE }}/README.en.txt

          ${{ env.PACKAGE }}/request.json

          ${{ env.PACKAGE }}/runtime.json

          ${{ env.PACKAGE }}/attempt-ledger.json

          ${{ env.PACKAGE }}/owner-authority.json

          ${{ env.PACKAGE }}/prompts/blind.txt

          ${{ env.PACKAGE }}/provenance/model-availability.json

          ${{ env.PACKAGE }}/provenance/context-proof.json

          ${{ env.PACKAGE }}/worker.py

          ${{ env.PACKAGE }}/offline_check.py

          ${{ env.PACKAGE }}/freeze_package.py

          ${{ env.PACKAGE }}/inputs/F001.wav

          ${{ env.PACKAGE }}/freeze.json

          .github/workflows/meeting-s102-reflection-diagnostic1.yml'
