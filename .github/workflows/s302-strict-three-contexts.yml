name: s302-strict-three-contexts bounded audio diagnostics
'on':
  push:
    branches:
    - work/soil-s302-strict-three-contexts-20261023-r1
    paths:
    - s302-strict-three-contexts/request.json
permissions:
  contents: read
concurrency:
  group: s302-strict-three-contexts-8a4ac17554c46a921a948874eefc977d8ccafbe3979e91532ab239f4c10c6ec5
  cancel-in-progress: false
env:
  PACKAGE: s302-strict-three-contexts
  REQUEST_SHA: 8a4ac17554c46a921a948874eefc977d8ccafbe3979e91532ab239f4c10c6ec5
  WORKER_SHA: 9e2d7837c57710a91e848c9db07d86a225f8bde84c379358415a7d8bdb69b0ee
  FREEZE_SHA: a8fc64ec972e0b608fc5630380f797fd6c098928e7b15eb56c34dc15ad023979
  BRANCH_CREATED: ${{ github.event.created }}
  REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
  PYTHONUNBUFFERED: '1'
jobs:
  review:
    if: github.run_attempt == 1 && github.repository_id == '1272666418' && github.repository
      == 'cabicci/viva-ai-systems-55d35820' && github.ref == 'refs/heads/work/soil-s302-strict-three-contexts-20261023-r1'
      && github.event.created == true && github.event.before == '0000000000000000000000000000000000000000'
      && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Verify exact original sixsecond PCM and finitebudget
      id: validate
      run: 'cd "$PACKAGE"

        python worker.py validate

        '
    - name: Preserve exact context before onlyreview
      id: audio
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s302-strict-three-contexts-r1-inputs
        path: ${{ env.PACKAGE }}/inputs/
        if-no-files-found: error
        retention-days: 30
    - name: Record immutable context upload
      id: receipt
      env:
        AID: ${{ steps.audio.outputs.artifact-id }}
        DIGEST: ${{ steps.audio.outputs.artifact-digest }}
      run: 'cd "$PACKAGE"

        python worker.py uploaded --artifact-id "$AID" --artifact-digest "$DIGEST"

        '
    - name: One unhinted review C02
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip C02

        '
    - name: One unhinted review C09
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip C09

        '
    - name: One unhinted review C10
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip C10

        '
    - name: Preserve all exact payload and partial outcomes
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s302-strict-three-contexts-r1-evidence
        retention-days: 30
        include-hidden-files: true
        if-no-files-found: error
        path: '${{ env.PACKAGE }}/output/

          ${{ env.PACKAGE }}/README.en.txt

          ${{ env.PACKAGE }}/request.json

          ${{ env.PACKAGE }}/runtime.json

          ${{ env.PACKAGE }}/attempt-ledger.json

          ${{ env.PACKAGE }}/owner-authority.json

          ${{ env.PACKAGE }}/prompts/blind.txt

          ${{ env.PACKAGE }}/provenance/model-availability.json

          ${{ env.PACKAGE }}/provenance/context-proof.json

          ${{ env.PACKAGE }}/worker.py

          ${{ env.PACKAGE }}/offline_check.py

          ${{ env.PACKAGE }}/freeze_package.py

          ${{ env.PACKAGE }}/inputs/C01.wav

          ${{ env.PACKAGE }}/inputs/C02.wav

          ${{ env.PACKAGE }}/inputs/C03.wav

          ${{ env.PACKAGE }}/inputs/C04.wav

          ${{ env.PACKAGE }}/inputs/C05.wav

          ${{ env.PACKAGE }}/inputs/C06.wav

          ${{ env.PACKAGE }}/inputs/C07.wav

          ${{ env.PACKAGE }}/inputs/C08.wav

          ${{ env.PACKAGE }}/inputs/C09.wav

          ${{ env.PACKAGE }}/inputs/C10.wav

          ${{ env.PACKAGE }}/inputs/C11.wav

          ${{ env.PACKAGE }}/inputs/C12.wav

          ${{ env.PACKAGE }}/inputs/C13.wav

          ${{ env.PACKAGE }}/inputs/C14.wav

          ${{ env.PACKAGE }}/inputs/C15.wav

          ${{ env.PACKAGE }}/freeze.json

          .github/workflows/s302-strict-three-contexts.yml'
