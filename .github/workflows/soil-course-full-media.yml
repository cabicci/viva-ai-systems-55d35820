name: Soil full-course four-language media
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths: [experiments/course-pipeline/production/media-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: soil-full-media-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-22.04
    outputs:
      lessons: ${{ steps.scope.outputs.lessons }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: scope
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('experiments/course-pipeline/production/media-request.json'))
          assert p['action']=='produce-full-course-preview'
          assert 0<len(p['lessons'])<=29 and len(set(p['lessons']))==len(p['lessons'])
          assert 'SOIL-U1-L03' not in p['lessons']
          print('lessons='+json.dumps(p['lessons']))
          PY
  media:
    needs: scope
    if: github.ref == 'refs/heads/work/soil-course-pipeline-20261013'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lesson: ${{ fromJSON(needs.scope.outputs.lessons) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Fetch the exact reviewed lesson
        env:
          GH_TOKEN: ${{ github.token }}
          LESSON: ${{ matrix.lesson }}
        run: |
          AUTHOR_RUN=$(python3 -c "import json; print(json.load(open('experiments/course-pipeline/production/media-request.json'))['authorRun'])")
          gh run download "$AUTHOR_RUN" -n "soil-author-$LESSON" -D "experiments/course-pipeline/production/output/$LESSON"
          python3 experiments/course-pipeline/production/build_packages.py
      - name: Prepare renderer and image verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install Pillow==11.3.0
          cd remotion
          bun install --frozen-lockfile
      - name: Restore independent images and narration
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: experiments/course-pipeline/production/packages/${{ matrix.lesson }}/output
          key: soil-full-media-${{ matrix.lesson }}-${{ hashFiles('experiments/course-pipeline/production/media-request.json') }}
          restore-keys: soil-full-media-${{ matrix.lesson }}-
      - name: Bind renderer and reviewed content
        env:
          LESSON: ${{ matrix.lesson }}
        run: python3 experiments/course-pipeline/production/media.py prepare --lesson "$LESSON"
      - name: Produce and verify four-language media
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          LESSON: ${{ matrix.lesson }}
          PYTHONUNBUFFERED: '1'
        run: python3 experiments/course-pipeline/production/media.py produce --lesson "$LESSON"
      - name: Preserve partial work without regeneration
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: experiments/course-pipeline/production/packages/${{ matrix.lesson }}/output
          key: soil-full-media-${{ matrix.lesson }}-${{ hashFiles('experiments/course-pipeline/production/media-request.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Transfer full media and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soil-media-${{ matrix.lesson }}
          retention-days: 30
          compression-level: 0
          path: |
            experiments/course-pipeline/production/packages/${{ matrix.lesson }}/output
            experiments/course-pipeline/production/packages/${{ matrix.lesson }}/course
            experiments/course-pipeline/production/packages/${{ matrix.lesson }}/authoring-receipt.json
