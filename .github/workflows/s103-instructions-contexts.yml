name: S103 four bounded original PCM context diagnostics
'on':
  push:
    branches:
    - work/soil-s103-instructions-contexts-20261023-r1
    paths:
    - s103-instructions-contexts/request.json
permissions:
  contents: read
concurrency:
  group: s103-instructions-contexts-9de32bb4adcc94c2444d085c77536de5ad2465575c9d04ea6e99c76c133ad47e
  cancel-in-progress: false
env:
  PACKAGE: s103-instructions-contexts
  REQUEST_SHA: 9de32bb4adcc94c2444d085c77536de5ad2465575c9d04ea6e99c76c133ad47e
  WORKER_SHA: 91499e15118287217f6ec556c0856975fac4168b29b3eac8b266cec67dcae1c8
  FREEZE_SHA: af50a8d081e1934d3da80cb86b9fb531ce4f706b5f11617c4249c60cc97797fe
  BRANCH_CREATED: ${{ github.event.created }}
  REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
  PYTHONUNBUFFERED: '1'
jobs:
  review:
    if: github.run_attempt == 1 && github.repository_id == '1272666418' && github.repository == 'cabicci/viva-ai-systems-55d35820'
      && github.ref == 'refs/heads/work/soil-s103-instructions-contexts-20261023-r1' && github.event.created == true && github.event.before
      == '0000000000000000000000000000000000000000' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Verify exact original sixsecond PCM and finitebudget
      id: validate
      run: 'cd "$PACKAGE"

        python worker.py validate

        '
    - name: Preserve exact context before onlyreview
      id: audio
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s103-instructions-contexts-r1-inputs
        path: ${{ env.PACKAGE }}/inputs/
        if-no-files-found: error
        retention-days: 30
    - name: Record immutable context upload
      id: receipt
      env:
        AID: ${{ steps.audio.outputs.artifact-id }}
        DIGEST: ${{ steps.audio.outputs.artifact-digest }}
      run: 'cd "$PACKAGE"

        python worker.py uploaded --artifact-id "$AID" --artifact-digest "$DIGEST"

        '
    - name: One unhinted review C01
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip C01

        '
    - name: One unhinted review C02
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip C02

        '
    - name: One unhinted review C03
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip C03

        '
    - name: One unhinted review C04
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip C04

        '
    - name: Preserve all exact payload and partial outcomes
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s103-instructions-contexts-r1-evidence
        retention-days: 30
        include-hidden-files: true
        if-no-files-found: error
        path: '${{ env.PACKAGE }}/output/

          ${{ env.PACKAGE }}/README.en.txt

          ${{ env.PACKAGE }}/request.json

          ${{ env.PACKAGE }}/runtime.json

          ${{ env.PACKAGE }}/attempt-ledger.json

          ${{ env.PACKAGE }}/owner-authority.json

          ${{ env.PACKAGE }}/prompts/blind.txt

          ${{ env.PACKAGE }}/provenance/model-availability.json

          ${{ env.PACKAGE }}/provenance/context-proof.json

          ${{ env.PACKAGE }}/worker.py

          ${{ env.PACKAGE }}/offline_check.py

          ${{ env.PACKAGE }}/freeze_package.py

          ${{ env.PACKAGE }}/inputs/C01.wav

          ${{ env.PACKAGE }}/inputs/C02.wav

          ${{ env.PACKAGE }}/inputs/C03.wav

          ${{ env.PACKAGE }}/inputs/C04.wav

          ${{ env.PACKAGE }}/freeze.json

          .github/workflows/s103-instructions-contexts.yml'
