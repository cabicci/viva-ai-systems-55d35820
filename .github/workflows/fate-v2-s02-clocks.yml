name: Fate v2 S02 actual-audio observational clocks, no provider calls
on:
  push:
    branches: [work/masaarat/0c0df2131ade371ac908def0]
    paths: [experiments/course-pipeline/rebuild/fate-course-v2/s02-clocks-v1/request.json]
permissions:
  contents: read
  actions: read
env:
  PACKAGE: experiments/course-pipeline/rebuild/fate-course-v2/s02-clocks-v1
  EXPECTED_REQUEST_SHA256: 192014250043fbf6b4a1d4633ce2e5712a9e70f56b444d4c470524297c79e22f
  GH_TOKEN: ${{ github.token }}
jobs:
  clock:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        part: ["S02-01-ar-EG", "S02-02-ar-EG", "S02-03-ar-EG", "S02-04-ar-EG", "S02-05-ar-EG", "S02-01-en", "S02-02-en", "S02-03-en", "S02-04-en", "S02-05-en"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install faster-whisper==1.2.1
      - name: Measure actual recording and derive observational clock
        run: python "$PACKAGE/clock.py" "${{ matrix.part }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fate-v2-actual-clock-${{ matrix.part }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
