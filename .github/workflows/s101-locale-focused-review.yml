name: S1-01 six focused existing WAV diagnostics
on:
  push:
    branches: [work/soil-s101-locale-focused-review-20261022-r2]
    paths: [locale-focused-review/request.json]
permissions:
  contents: read
concurrency:
  group: s101-locale-focused-645bbb864eb252d72d6b61ebfba200e1dd4c5ffa73fc085cec3b80720b8a3d9d
  cancel-in-progress: false
env:
  REQUEST_SHA: 645bbb864eb252d72d6b61ebfba200e1dd4c5ffa73fc085cec3b80720b8a3d9d
  WORKER_SHA: 0af5c031ce251f3b8d8ce6b50767194afca45c59a1e4dfa326a7bd4d6a6f48c8
  FREEZE_SHA: a1e73ed40ff9f4e1eb222302e5172e1d7eb85e5217a3b792c89b9b5582acb8f0
  PYTHONUNBUFFERED: '1'
jobs:
  review:
    if: github.event_name == 'push' && github.event.created == true && github.run_attempt == 1 && github.event.repository.private == false && github.repository == 'cabicci/viva-ai-systems-55d35820' && github.ref == 'refs/heads/work/soil-s101-locale-focused-review-20261022-r2'
    runs-on: ubuntu-22.04
    timeout-minutes: 125
    env:
      REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
      BRANCH_CREATED: ${{ github.event.created }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify frozen scope and all six exact WAV byte and PCM hashes
        run: python locale-focused-review/worker.py validate
      - name: Verify preferred model availability once without fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python locale-focused-review/worker.py preflight
      - name: Transfer exact source WAV before blind review en-s101-checklist
        id: source0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-focused-source-en-s101-checklist
          path: locale-focused-review/inputs/en-s101-checklist.wav
          if-no-files-found: error
          retention-days: 30
      - name: Record prior source artifact receipt en-s101-checklist
        run: >-
          python locale-focused-review/worker.py uploaded --unit en-s101-checklist
          --artifact-id "${{ steps.source0.outputs.artifact-id }}"
          --artifact-digest "${{ steps.source0.outputs.artifact-digest }}"
      - name: One terminal blind review en-s101-checklist
        timeout-minutes: 18
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python locale-focused-review/worker.py blind-review --unit en-s101-checklist
      - name: Transfer finished raw response or failure evidence en-s101-checklist
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-focused-result-en-s101-checklist
          path: locale-focused-review/output/en-s101-checklist/
          if-no-files-found: warn
          retention-days: 30
      - name: Transfer exact source WAV before blind review de-s101-limits
        id: source1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s101-focused-source-de-s101-limits
          path: locale-focused-review/inputs/de-s101-limits.wav
          if-no-files-found: error
          retention-days: 30
      - name: Record prior source artifact receipt de-s101-limits
        run: >-
          python locale-focused-review/worker.py uploaded --unit de-s101-limits
