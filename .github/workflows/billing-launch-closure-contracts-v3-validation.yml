# DO NOT MERGE — billing-only validation harness for Launch Closure Contracts V3.
# Validates the exact PR head commit against a disposable Supabase database.
name: "DO NOT MERGE — Billing Launch Closure Contracts V3 Validation"

on:
  workflow_dispatch:
    inputs:
      expected_product_sha:
        description: "Expected product SHA to validate against"
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: billing-v3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == true }}
    runs-on: ubuntu-latest
    env:
      EXPECTED_PRODUCT_SHA: ${{ github.event.inputs.expected_product_sha || github.event.pull_request.head.sha }}
      BILLING_DISPOSABLE_DB: "1"
      DOCKER_BIN: docker
      PGPASSWORD: postgres
    steps:
      - name: Checkout exact PR head (not merge ref)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert HEAD matches expected product SHA
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "EXPECTED=${EXPECTED_PRODUCT_SHA}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.109.1

      # Disposable tree adapts only realtime.messages ownership for local reset.
      # Committed Product migrations under supabase/migrations/ remain immutable.
      - name: Prepare disposable Supabase tree
        run: |
          bun scripts/billing/prepare-disposable-supabase-tree.ts \
            --dest billing-v3-validation/disposable-supabase
          test "$(git hash-object supabase/migrations/20260526105117_25fc4182-0343-4234-a231-0cf38569014a.sql)" \
            = "d185dd59549f611fcb984bcb3459c9d5d6969ef5"

      - name: Start disposable Supabase
        working-directory: billing-v3-validation/disposable-supabase
        run: supabase start

      - name: Export local DB connection for disposable proofs
        run: |
          echo "DISPOSABLE_SUPABASE_ROOT=${GITHUB_WORKSPACE}/billing-v3-validation/disposable-supabase" >> "$GITHUB_ENV"
          echo "PGHOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "PGPORT=54322" >> "$GITHUB_ENV"
          echo "PGUSER=postgres" >> "$GITHUB_ENV"
          echo "PGDATABASE=postgres" >> "$GITHUB_ENV"
          echo "PGPASSWORD=postgres" >> "$GITHUB_ENV"

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Focused ESLint (billing)
        run: bunx eslint src/lib/billing supabase/functions/billing-entitlement/index.ts --max-warnings 0

      # Harness performs independent clean db-reset before Phase A and again before Phase B.
      - name: Run billing validation harness (Phase A suite + Phase B concurrency)
        run: |
          chmod +x .github/scripts/billing_contracts_v3_validation/run.sh
          .github/scripts/billing_contracts_v3_validation/run.sh

      - name: Show sanitized validation result
        if: ${{ always() }}
        run: |
          if [ -f billing-v3-validation/report.md ]; then
            cat billing-v3-validation/report.md
            cat billing-v3-validation/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: billing-v3-validation-report
          path: billing-v3-validation/
          if-no-files-found: warn
