name: Fate L03 actual-audio adjudication and timing v1
on:
  push:
    branches: [work/masaarat/0c0df2131ade371ac908def0]
    paths: [experiments/course-pipeline/rebuild/fate-L02-L07-bilingual-v1/analysis-L03/request.json]
permissions:
  contents: read
  actions: read
env:
  PACKAGE: experiments/course-pipeline/rebuild/fate-L02-L07-bilingual-v1/analysis-L03
  EXPECTED_REQUEST_SHA256: 60120005d26bdc24e1e290c7fa56aec65729e489fea3027e74226df9a7380d20
jobs:
  analyze:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: ["L03-S01-ar-v1", "L03-S02-ar-v1", "L03-S03-ar-v1", "L03-S04-ar-v1", "L03-S05-ar-v1", "L03-S06-ar-v1", "L03-S01-en-v1", "L03-S02-en-v1", "L03-S03-en-v1", "L03-S04-en-v1", "L03-S05-en-v1", "L03-S06-en-v1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve actual alerts and derive acoustic scene cues
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python "$PACKAGE/worker.py" request "${{ matrix.part }}"
      - name: Deliver each result immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-next-align-${{ matrix.part }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
