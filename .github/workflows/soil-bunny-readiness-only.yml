name: Existing Soil S202 Bunny GUID readiness only
'on':
  push:
    branches: ['work/soil-bunny-s202-readiness-20261023-r1']
    paths: ['readiness/readiness.py']
permissions:
  contents: read
concurrency:
  group: soil-bunny-s202-existing-guid-readiness
  cancel-in-progress: false
jobs:
  check:
    if: github.run_attempt == 1 && github.repository_id == '1272666418' && github.event.created == true
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read same GUID only, max8 GET and no remote mutations
        env:
          BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
        run: cd readiness && python3 readiness.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bunny-s202-existing-guid-readiness
          path: readiness/output/*.json
          retention-days: 30
          if-no-files-found: error
