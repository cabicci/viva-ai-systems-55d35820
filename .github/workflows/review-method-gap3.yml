name: Three distinct review-method-gap diagnostics
'on':
  push:
    branches:
    - work/soil-review-method-gap3-20261024-r1
    paths:
    - review-method-gap3/request.json
permissions:
  contents: read
concurrency:
  group: review-method-gap3-73b6c8eb82a2c610a7cbad447e0560f35c6754aa6de49d702962365a6c26d302
  cancel-in-progress: false
env:
  PACKAGE: review-method-gap3
  REQUEST_SHA: 73b6c8eb82a2c610a7cbad447e0560f35c6754aa6de49d702962365a6c26d302
  WORKER_SHA: b42e34b8081780509a0013984ac91a43b57e38fa3a229751379d7296554eb31b
  FREEZE_SHA: 28946343a85e4fbe66f42e6556e666c404c0c3971d586a414c0f6a8d8ebbfd61
  BRANCH_CREATED: ${{ github.event.created }}
  REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
  PYTHONUNBUFFERED: '1'
jobs:
  review:
    if: github.run_attempt == 1 && github.repository_id == '1272666418' && github.repository == 'cabicci/viva-ai-systems-55d35820'
      && github.ref == 'refs/heads/work/soil-review-method-gap3-20261024-r1' && github.event.created == true && github.event.before
      == '0000000000000000000000000000000000000000' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Verify three exact original PCM contexts and finite three-review budget
      id: validate
      run: 'cd "$PACKAGE"

        python worker.py validate

        '
    - name: Preserve exact context before onlyreview
      id: audio
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: review-method-gap3-r1-inputs
        path: ${{ env.PACKAGE }}/inputs/
        if-no-files-found: error
        retention-days: 30
    - name: Record immutable context upload
      id: receipt
      env:
        AID: ${{ steps.audio.outputs.artifact-id }}
        DIGEST: ${{ steps.audio.outputs.artifact-digest }}
      run: 'cd "$PACKAGE"

        python worker.py uploaded --artifact-id "$AID" --artifact-digest "$DIGEST"

        '
    - name: One distinct source-free method-gap check D001
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip D001

        '
    - name: Preserve exact distinct diagnostic D001
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: review-method-gap3-D001-evidence
        path: ${{ env.PACKAGE }}/output/D001/
        if-no-files-found: warn
        retention-days: 30
    - name: One distinct source-free method-gap check D002
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip D002

        '
    - name: Preserve exact distinct diagnostic D002
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: review-method-gap3-D002-evidence
        path: ${{ env.PACKAGE }}/output/D002/
        if-no-files-found: warn
        retention-days: 30
    - name: One distinct source-free method-gap check D003
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip D003

        '
    - name: Preserve exact distinct diagnostic D003
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: review-method-gap3-D003-evidence
        path: ${{ env.PACKAGE }}/output/D003/
        if-no-files-found: warn
        retention-days: 30
    - name: Preserve all exact payload and partial outcomes
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: review-method-gap3-r2-evidence
        retention-days: 30
        include-hidden-files: true
        if-no-files-found: error
        path: '${{ env.PACKAGE }}/output/

          ${{ env.PACKAGE }}/README.en.txt

          ${{ env.PACKAGE }}/request.json

          ${{ env.PACKAGE }}/runtime.json

          ${{ env.PACKAGE }}/attempt-ledger.json

          ${{ env.PACKAGE }}/owner-authority.json

          ${{ env.PACKAGE }}/prompts/blind.txt

          ${{ env.PACKAGE }}/provenance/model-availability.json

          ${{ env.PACKAGE }}/provenance/context-proof.json

          ${{ env.PACKAGE }}/worker.py

          ${{ env.PACKAGE }}/offline_check.py

          ${{ env.PACKAGE }}/freeze_package.py

          ${{ env.PACKAGE }}/inputs/D001.wav

          ${{ env.PACKAGE }}/inputs/D002.wav

          ${{ env.PACKAGE }}/inputs/D003.wav

          ${{ env.PACKAGE }}/freeze.json

          .github/workflows/review-method-gap3.yml'
