name: Soil accepted method full S1-01 Arabic audio
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths: [experiments/course-pipeline/rebuild/ar-accepted-method-fullpilot-20261020/dispatch.private.json]
permissions:
  contents: read
concurrency:
  group: soil-accepted-method-fullpilot-ar-20261020
  cancel-in-progress: false
env:
  PACKAGE: experiments/course-pipeline/rebuild/ar-accepted-method-fullpilot-20261020
  REQUEST_SHA: 6d49e48e0de835ad3aad593b5f6ffe65689fb90165dbfae34bafc2b3501f22b6
  WORKER_SHA: 5bae167c9ac00d47a2d310531f9742daa079d3a3c8f6386c9dc6adae563d72bc
  AUDIT_SHA: 5479a3744079b031aececb8539ec31cae859a450eefead08d450cd2e0175e332
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
jobs:
  audio:
    if: github.ref == 'refs/heads/work/soil-course-pipeline-20261013' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact inventory and disabled-until-root-go gate
        run: python "$PACKAGE/worker.py" validate
      - name: One TTS attempt for each generate unit, preserve independent exceptions
        id: produce
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: python "$PACKAGE/worker.py" produce
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soil-ar-accepted-method-fullpilot-speech
          retention-days: 30
          path: experiments/course-pipeline/rebuild/ar-accepted-method-fullpilot-20261020/output/
      - name: One actual-audio understanding request per generated unit
        if: steps.produce.outcome == 'success'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: python "$PACKAGE/worker.py" audit
      - name: Verify and install pinned ASR package
        if: steps.produce.outcome == 'success'
        run: |
          python -m pip download --no-deps --dest "$PACKAGE/wheels" faster-whisper==1.2.1
          python "$PACKAGE/worker.py" verify-wheel
          python -m pip install --disable-pip-version-check --report "$PACKAGE/output/pip-install-report.private.json" "$PACKAGE"/wheels/faster_whisper-1.2.1-*.whl
      - name: Actual ASR once per generated unit, one loaded model
        if: steps.produce.outcome == 'success'
        run: python "$PACKAGE/worker.py" asr
      - name: Preserve all results and exceptions without claiming acceptance
        if: always()
        run: python "$PACKAGE/worker.py" summarize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soil-ar-accepted-method-fullpilot-evidence
          retention-days: 30
          path: experiments/course-pipeline/rebuild/ar-accepted-method-fullpilot-20261020/output/
