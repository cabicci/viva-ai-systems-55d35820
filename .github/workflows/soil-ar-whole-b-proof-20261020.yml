name: Soil whole B natural Cairo candidate
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths: [experiments/course-pipeline/rebuild/ar-whole-b-proof-20261020/request.json]
permissions:
  contents: read
concurrency:
  group: soil-whole-b-f4b528a7b527beecea791558ebfb38285f389f3ae31d373cd20c49d38d829841
  cancel-in-progress: false
env:
  PACKAGE: experiments/course-pipeline/rebuild/ar-whole-b-proof-20261020
  REQUEST_SHA: f4b528a7b527beecea791558ebfb38285f389f3ae31d373cd20c49d38d829841
  SCRIPT_SHA: 4ab2f97bf28c8bb6efb64ddc17c489b20174a1546f574f110fae6145e00be02c
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
jobs:
  whole-b:
    if: github.ref == 'refs/heads/work/soil-course-pipeline-20261013' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate exact source and code bytes
        run: |
          python "$PACKAGE/whole.py" validate
          echo "b8a47ad216d402997a035bd69c78e912088afb13310379a4f3572b0ce0edc9dc  $PACKAGE/diagnostic/audit.py" | sha256sum -c -
          echo "6e207589a3813a501274b10be57501cef42e6d601173223043043252c4c06d52  $PACKAGE/diagnostic/request.json" | sha256sum -c -
          echo "80ee81bd2ccd2a82954b98feff6bf7dc17d0c796d9b223a22d093e3703ef7c48  $PACKAGE/prepare-diagnostic.py" | sha256sum -c -
      - name: One whole B TTS attempt only
        id: voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: python "$PACKAGE/whole.py" produce
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soil-ar-whole-b-candidate
          retention-days: 30
          path: |
            experiments/course-pipeline/rebuild/ar-whole-b-proof-20261020/output/
            experiments/course-pipeline/rebuild/ar-whole-b-proof-20261020/offline-validation.private.json
            experiments/course-pipeline/rebuild/ar-whole-b-proof-20261020/failure.private.json
      - name: One actual-audio B audit
        if: steps.voice.outcome == 'success'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          python "$PACKAGE/prepare-diagnostic.py"
          export REQUEST_SHA=$(sha256sum "$PACKAGE/diagnostic/request.json" | cut -d ' ' -f1)
          export SCRIPT_SHA=b8a47ad216d402997a035bd69c78e912088afb13310379a4f3572b0ce0edc9dc
          python "$PACKAGE/diagnostic/audit.py" audit
      - name: Install exact pinned ASR package
        if: steps.voice.outcome == 'success'
        run: |
          python -m pip download --no-deps --dest "$PACKAGE/wheels" faster-whisper==1.2.1
          python "$PACKAGE/whole.py" verify-wheel
          python -m pip install --disable-pip-version-check --report "$PACKAGE/asr-output/pip-install-report.private.json" "$PACKAGE"/wheels/faster_whisper-1.2.1-*.whl
      - name: One B ASR pass, estimated timestamps only
        if: steps.voice.outcome == 'success'
        run: python "$PACKAGE/whole.py" asr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soil-ar-whole-b-evidence
          retention-days: 30
          path: |
            experiments/course-pipeline/rebuild/ar-whole-b-proof-20261020/diagnostic/output/
            experiments/course-pipeline/rebuild/ar-whole-b-proof-20261020/diagnostic/request.json
            experiments/course-pipeline/rebuild/ar-whole-b-proof-20261020/asr-output/
            experiments/course-pipeline/rebuild/ar-whole-b-proof-20261020/failure.private.json
