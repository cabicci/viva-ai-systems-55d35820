name: Fate v2 preserve reviewed full-master hosting evidence
on:
  push:
    branches: [work/masaarat/0c0df2131ade371ac908def0]
    paths: [experiments/course-pipeline/rebuild/fate-course-v2/hosting-evidence-v1/request.json]
permissions:
  contents: read
env:
  PACKAGE: experiments/course-pipeline/rebuild/fate-course-v2/hosting-evidence-v1
  EXPECTED_REQUEST_SHA256: fb32ef6ed615b01a5549b566032d8ded57e5fc179d9fb08fb35d5a3087565dfd
jobs:
  archive:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify actual frozen hosting-review copies
        run: |
          python - <<'PY'
          import os,pathlib,json,hashlib
          p=pathlib.Path(os.environ['PACKAGE']);s=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          assert s(p/'request.json')==os.environ['EXPECTED_REQUEST_SHA256']
          m=json.loads((p/'request.json').read_text())
          for n,h in m['files'].items():assert s(p/n)==h
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-v2-hosting-evidence-v1
          path: ${{ env.PACKAGE }}/
          retention-days: 90
