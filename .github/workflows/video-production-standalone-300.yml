      - name: Install root deps
        run: bun install --frozen-lockfile
      - name: Install remotion deps
        run: cd remotion && bun install
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Restore prior receipt (git-level recovery)
        env:
          KEY: ${{ matrix.cell.logical_key }}
        run: |
          set -euo pipefail
          BRANCH="video-results/${BATCH_ID}/${KEY}"
          if git fetch origin "$BRANCH" 2>/dev/null; then
            mkdir -p "remotion/video-pipeline/results/${BATCH_ID}/${KEY}"
            git checkout "origin/${BRANCH}" -- \
              "remotion/video-pipeline/results/${BATCH_ID}/${KEY}/finalization-receipt.json" || true
          fi
      - name: Restore prior durable artifact bundle
        id: bundle_in
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DETERMINISTIC_ARTIFACT_NAME }}
          path: /tmp/bundle-in
      - name: Run cell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
          BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
        run: |
          set -euo pipefail
          BUNDLE_IN=""
          if [ -d /tmp/bundle-in ] && [ -f /tmp/bundle-in/validation.json ]; then
            BUNDLE_IN="--bundle-in-dir /tmp/bundle-in"
          fi
          mkdir -p /tmp/bundle-out
          # shellcheck disable=SC2086
          python3 .github/scripts/video_standalone/run_cell.py \
            --lesson-id  "${{ matrix.cell.lesson_id }}" \
            --locale     "${{ matrix.cell.locale }}" \
            --package-path "${{ matrix.cell.package_path }}" \
            --source-sha "${{ github.sha }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --artifact-id "${{ env.DETERMINISTIC_ARTIFACT_NAME }}" \
            --artifact-digest "sha256:pending" \
            $BUNDLE_IN \
            --bundle-out-dir /tmp/bundle-out \
            --out "/tmp/${{ matrix.cell.logical_key }}-result.json"
      - name: Upload durable six-file bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DETERMINISTIC_ARTIFACT_NAME }}
          path: /tmp/bundle-out/
          if-no-files-found: error
          overwrite: true
      - name: Upload cell logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-a-logs-${{ matrix.cell.logical_key }}
          path: |
            /tmp/${{ matrix.cell.lesson_id }}__${{ matrix.cell.locale }}/
            /tmp/${{ matrix.cell.logical_key }}-result.json
          if-no-files-found: ignore

  matrix_b:
    name: Matrix B (150 cells)
    needs: [plan, canary]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cell: ${{ fromJson(needs.plan.outputs.matrix_b) }}
    concurrency:
      group: standalone-cell-${{ matrix.cell.logical_key }}
      cancel-in-progress: false
    env:
      DETERMINISTIC_ARTIFACT_NAME: standalone-cell__${{ github.sha }}__${{ matrix.cell.locale }}__${{ matrix.cell.lesson_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
