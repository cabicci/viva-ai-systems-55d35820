    env:
      DETERMINISTIC_ARTIFACT_NAME: standalone-cell__${{ github.sha }}__${{ matrix.cell.locale }}__${{ matrix.cell.lesson_id }}
    steps:
      - uses: actions/checkout@v4
        with:
