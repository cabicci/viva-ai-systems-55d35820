name: Video Production Standalone 300

# Standalone, isolated 300-cell localized video production workflow.
# Read-only reuse (never edited):
#   - remotion/scripts/build-lesson.py
#   - .github/scripts/video_finalize/**
# Does NOT touch:
#   - .github/workflows/video-production-batch.yml
#   - .github/workflows/video-production-final-v2.yml
#   - runtime mappings, ar-EG assets, Supabase, Preview/Publish/Production.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROCEED to dispatch'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: video-production-standalone-300
  cancel-in-progress: false

env:
  BATCH_ID: video-full-300-localized-v1
  PLAN_PATH: /tmp/standalone-plan.json

jobs:
  guard:
    name: Guard (main-only + confirm)
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation token
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "PROCEED" ]; then
            echo "::error::confirm input must equal PROCEED"
            exit 1
          fi
      - name: Verify dispatched ref is main
        run: |
          set -euo pipefail
          REF="${{ github.ref }}"
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::this workflow may only be dispatched from main (got $REF)"
            exit 1
          fi

  plan:
    name: Build 300-cell plan
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      canary: ${{ steps.plan.outputs.canary }}
      matrix_a: ${{ steps.plan.outputs.matrix_a }}
      matrix_b: ${{ steps.plan.outputs.matrix_b }}
      totals: ${{ steps.plan.outputs.totals }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: plan
        name: Build plan (300 keys; en=100, ar-MSA=100, ar-Gulf=100, ar-EG=0; canary pinned)
        run: |
          set -euo pipefail
          python3 .github/scripts/video_standalone/plan.py \
            --out "$PLAN_PATH" \
            --emit-github-output
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-plan
          path: ${{ env.PLAN_PATH }}
          if-no-files-found: error

  canary:
    name: Canary (analyst-m3-l2-ai-summarization__en; end-to-end live gate)
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cell: ${{ fromJson(needs.plan.outputs.canary) }}
    concurrency:
      group: standalone-cell-${{ matrix.cell.logical_key }}
      cancel-in-progress: false
    env:
      DETERMINISTIC_ARTIFACT_NAME: standalone-cell__${{ github.sha }}__${{ matrix.cell.locale }}__${{ matrix.cell.lesson_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python deps
        run: pip install requests google-genai
      - name: Install root deps
        run: bun install --frozen-lockfile
      - name: Install remotion deps
        run: cd remotion && bun install
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Restore prior receipt (git-level recovery)
        env:
          KEY: ${{ matrix.cell.logical_key }}
        run: |
          set -euo pipefail
          BRANCH="video-results/${BATCH_ID}/${KEY}"
          if git fetch origin "$BRANCH" 2>/dev/null; then
            mkdir -p "remotion/video-pipeline/results/${BATCH_ID}/${KEY}"
            git checkout "origin/${BRANCH}" -- \
              "remotion/video-pipeline/results/${BATCH_ID}/${KEY}/finalization-receipt.json" || true
          fi
      - name: Restore prior durable artifact bundle (Re-run failed jobs recovery)
        id: bundle_in
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DETERMINISTIC_ARTIFACT_NAME }}
          path: /tmp/bundle-in
      - name: Run canary cell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
          BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
          STANDALONE_ARTIFACT_ID: ${{ env.DETERMINISTIC_ARTIFACT_NAME }}
          STANDALONE_ARTIFACT_DIGEST: sha256:pending
        run: |
          set -euo pipefail
          BUNDLE_IN=""
          if [ -d /tmp/bundle-in ] && [ -f /tmp/bundle-in/validation.json ]; then
            BUNDLE_IN="--bundle-in-dir /tmp/bundle-in"
          fi
          mkdir -p /tmp/bundle-out
          # shellcheck disable=SC2086
          python3 .github/scripts/video_standalone/run_cell.py \
            --lesson-id  "${{ matrix.cell.lesson_id }}" \
            --locale     "${{ matrix.cell.locale }}" \
            --package-path "${{ matrix.cell.package_path }}" \
            --source-sha "${{ github.sha }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --artifact-id "${{ env.DETERMINISTIC_ARTIFACT_NAME }}" \
            --artifact-digest "sha256:pending" \
            $BUNDLE_IN \
            --bundle-out-dir /tmp/bundle-out \
            --out "/tmp/${{ matrix.cell.logical_key }}-result.json"
      - name: Upload durable six-file bundle (deterministic name)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DETERMINISTIC_ARTIFACT_NAME }}
          path: /tmp/bundle-out/
          if-no-files-found: error
          overwrite: true
      - name: Upload cell logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-logs-${{ matrix.cell.logical_key }}
          path: |
            /tmp/${{ matrix.cell.lesson_id }}__${{ matrix.cell.locale }}/
            /tmp/${{ matrix.cell.logical_key }}-result.json
          if-no-files-found: ignore

  matrix_a:
    name: Matrix A (149 cells)
    needs: [plan, canary]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
