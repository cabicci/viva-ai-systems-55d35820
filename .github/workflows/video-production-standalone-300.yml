      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python deps
        run: pip install requests google-genai
      - name: Install root deps
        run: bun install --frozen-lockfile
      - name: Install remotion deps
        run: cd remotion && bun install
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Restore prior receipt (git-level recovery)
        env:
          KEY: ${{ matrix.cell.logical_key }}
        run: |
          set -euo pipefail
          BRANCH="video-results/${BATCH_ID}/${KEY}"
          if git fetch origin "$BRANCH" 2>/dev/null; then
            mkdir -p "remotion/video-pipeline/results/${BATCH_ID}/${KEY}"
            git checkout "origin/${BRANCH}" -- \
              "remotion/video-pipeline/results/${BATCH_ID}/${KEY}/finalization-receipt.json" || true
          fi
      - name: Restore prior durable artifact bundle
        id: bundle_in
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DETERMINISTIC_ARTIFACT_NAME }}
          path: /tmp/bundle-in
      - name: Run cell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
          BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
        run: |
