        with:
          name: ${{ env.DETERMINISTIC_ARTIFACT_NAME }}
          path: /tmp/bundle-out/
          if-no-files-found: error
          overwrite: true
      - name: Upload cell logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-b-logs-${{ matrix.cell.logical_key }}
          path: |
            /tmp/${{ matrix.cell.lesson_id }}__${{ matrix.cell.locale }}/
            /tmp/${{ matrix.cell.logical_key }}-result.json
          if-no-files-found: ignore

  collect:
    name: Collector (always-run; partial-success preserving)
    needs: [plan, canary, matrix_a, matrix_b]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: standalone-plan
          path: /tmp/plan-artifact
      - name: Fetch all result branches
        run: |
          set -euo pipefail
          mkdir -p /tmp/receipt-roots
          git fetch origin '+refs/heads/video-results/*:refs/remotes/origin/video-results/*' || true
          BRANCHES=$(git for-each-ref --format='%(refname:short)' "refs/remotes/origin/video-results/${BATCH_ID}/" || true)
          IDX=0
          for ref in $BRANCHES; do
            IDX=$((IDX+1))
            ROOT="/tmp/receipt-roots/$IDX"
            KEY="${ref##*/}"
            OUT="$ROOT/remotion/video-pipeline/results/${BATCH_ID}/${KEY}/finalization-receipt.json"
            mkdir -p "$(dirname "$OUT")"
            git show "$ref:remotion/video-pipeline/results/${BATCH_ID}/${KEY}/finalization-receipt.json" > "$OUT" 2>/dev/null || rm -f "$OUT"
          done
      - name: Run collector
        run: |
          set -euo pipefail
          ROOTS=()
          if [ -d /tmp/receipt-roots ]; then
            for d in /tmp/receipt-roots/*; do
              [ -d "$d" ] || continue
              ROOTS+=( --receipt-root "$d" )
            done
          fi
          PLAN_BASENAME=$(basename "$PLAN_PATH")
          python3 .github/scripts/video_standalone/collect.py \
            --plan "/tmp/plan-artifact/${PLAN_BASENAME}" \
            --repo-root "$GITHUB_WORKSPACE" \
            "${ROOTS[@]}" \
            --out /tmp/standalone-collector-report.json || true
          cat /tmp/standalone-collector-report.json
      - name: Upload collector report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-collector-report
          path: /tmp/standalone-collector-report.json
          if-no-files-found: error
      - name: Fail if any unresolved (enables native Re-run failed jobs)
        run: |
          set -euo pipefail
          python3 -c "
          import json,sys
          r=json.load(open('/tmp/standalone-collector-report.json'))
          bad=len(r['failed'])+len(r['missing'])+len(r['ambiguous'])
          print('finalized:',len(r['finalized']),'unresolved:',bad)
          sys.exit(0 if bad==0 else 1)
          "
