name: Unified commerce validation
on:
  pull_request:
    paths:
      - "src/lib/commerce/**"
      - "src/components/commerce/**"
      - "src/routes/*commerce*"
      - "supabase/migrations/20261004*commerce*"
      - ".github/workflows/commerce-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commerce:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable
          POSTGRES_DB: commerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.9"
      - run: bun install --frozen-lockfile
      - run: bun run test:run -- src/lib/commerce src/components/commerce/commerce-ui.test.tsx
        env:
          COMMERCE_NATIVE_DATABASE_URL: postgresql://postgres:disposable@127.0.0.1:5432/commerce_test
