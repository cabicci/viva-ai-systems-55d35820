name: S1-01 unit024 r2 deliberate one-unit repair
on:
  workflow_dispatch:
  push:
    branches: [work/soil-s101-unit024-r2-20261022]
    paths: [experiments/masaarat-media-review-job/audio-unit024-r2/request.json]
permissions:
  contents: read
concurrency:
  group: s101-unit024-r2-9a7bcee2abaf26c408bf888495433fa32d40c47ccf84330554501a2fa93891a8
  cancel-in-progress: false
env:
  PACKAGE: experiments/masaarat-media-review-job/audio-unit024-r2
  REQUEST_SHA: 9a7bcee2abaf26c408bf888495433fa32d40c47ccf84330554501a2fa93891a8
  WORKER_SHA: 9e16139654aaaf20fe55d18353920470568d462a2c84d7c3830941ea913e05e5
  FREEZE_SHA: 81e50a19c77e98c6cdae5c52af83c2542b0e9ab68597b504661f5e5c3ea40483
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
jobs:
  repair:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/work/soil-s101-unit024-r2-20261022'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact frozen request and code offline
        run: |
          cd "$PACKAGE"
          python worker.py validate
      - name: Bounded preferred-model metadata preflight, no fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py preflight
      - name: Install hash-verified Whisper wheel once
        run: |
          cd "$PACKAGE"
          python -m pip download --no-deps --dest wheels faster-whisper==1.2.1
          python worker.py verify-wheel
          python -m pip install --disable-pip-version-check --report output/pip-install-report.json wheels/faster_whisper-1.2.1-*.whl
      - name: One TTS request S1-01-ar-024
        id: tts024
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py produce --unit S1-01-ar-024
      - name: Upload audio before review S1-01-ar-024
        id: upload024
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.tts024.outcome == 'success'
        with:
          name: s101-unit024-r2-repair-S1-01-ar-024-audio
          path: ${{ env.PACKAGE }}/output/S1-01-ar-024/
          if-no-files-found: error
          retention-days: 30
      - name: Record successful audio transfer S1-01-ar-024
        env:
          AUDIO_ARTIFACT_ID: ${{ steps.upload024.outputs.artifact-id }}
          AUDIO_ARTIFACT_DIGEST: ${{ steps.upload024.outputs.artifact-digest }}
        run: |
          cd "$PACKAGE"
          python worker.py uploaded --unit S1-01-ar-024 --artifact-id "$AUDIO_ARTIFACT_ID" --artifact-digest "$AUDIO_ARTIFACT_DIGEST"
      - name: One blind actual-audio Argon review S1-01-ar-024
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "$PACKAGE"
          python worker.py blind-review --unit S1-01-ar-024
      - name: One actual-audio Whisper transcription S1-01-ar-024
        continue-on-error: true
        run: |
          cd "$PACKAGE"
          python worker.py asr --unit S1-01-ar-024
      - name: Preserve independent comparison and stop if diagnostics incomplete S1-01-ar-024
        run: |
          cd "$PACKAGE"
          python worker.py compare --unit S1-01-ar-024
      - name: Upload immediate review evidence S1-01-ar-024
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s101-unit024-r2-repair-S1-01-ar-024-review
          path: ${{ env.PACKAGE }}/output/S1-01-ar-024/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve all partial attempts and input provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s101-unit024-r2-complete-evidence
          retention-days: 30
          path: |
            ${{ env.PACKAGE }}/output/
            ${{ env.PACKAGE }}/request.json
            ${{ env.PACKAGE }}/request.original-20261022.json
            ${{ env.PACKAGE }}/request.prior-batch.json
            ${{ env.PACKAGE }}/prior-candidate-diagnosis.json
            ${{ env.PACKAGE }}/runtime.json
            ${{ env.PACKAGE }}/freeze.json
            ${{ env.PACKAGE }}/model-evidence.json
            ${{ env.PACKAGE }}/worker.py
