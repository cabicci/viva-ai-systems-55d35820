name: Masaarat Kids - audio review and complete lesson package
on:
  push:
    branches: [feature/masaarat-kids-pilot]
    paths: [experiments/masaarat-kids/review-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: masaarat-kids-review-package
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'cabicci/viva-ai-systems-55d35820' && github.ref == 'refs/heads/feature/masaarat-kids-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: experiments/masaarat-kids
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prepare and check the lesson
        run: |
          bun install --frozen-lockfile
          bun run assets
          bun run check
          bun test
          bun x tsc --noEmit
      - name: Retrieve the existing verified videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for locale in ar-EG ar-MSA ar-Gulf; do
            gh run download 35867880239 --repo cabicci/viva-ai-systems-55d35820 --name "kids-pilot-$locale-35867880239-1" --dir "$RUNNER_TEMP/kids-package/$locale"
          done
          gh run download 35871971135 --repo cabicci/viva-ai-systems-55d35820 --name kids-pilot-en-35871971135-1 --dir "$RUNNER_TEMP/kids-package/en"
          python scripts/import-artifacts.py "$RUNNER_TEMP/kids-package" --run-id 35867880239 --source-sha f065101dfc4298095b1034a8b7c7993aace13bcf --recovery-run-id 35871971135 --recovery-source-sha 1dcc0c08231e5e8d185542c7a32e6030f7aa085f
      - name: Restore and verify completed independent audio reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35875690306 --repo cabicci/viva-ai-systems-55d35820 --name kids-audio-review-35875690306 --dir evidence
          python scripts/reuse-audio-review.py
      - name: Build the complete offline review package
        run: |
          bun run build
          python scripts/package-review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masaarat-kids-complete-lesson-${{ github.run_id }}
          path: experiments/masaarat-kids/review-package/
          retention-days: 30
          if-no-files-found: error
      - name: Preserve completed audio review reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kids-audio-review-${{ github.run_id }}
          path: experiments/masaarat-kids/evidence/audio-review-*.json
          retention-days: 30
          if-no-files-found: warn
