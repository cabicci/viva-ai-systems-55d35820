name: Masaarat Kids - revision 2 complete lesson package
on:
  push:
    branches: [feature/masaarat-kids-pilot]
    paths: [experiments/masaarat-kids/review-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: masaarat-kids-review-package
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'cabicci/viva-ai-systems-55d35820' && github.ref == 'refs/heads/feature/masaarat-kids-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: experiments/masaarat-kids
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prepare and check the lesson
        run: |
          bun install --frozen-lockfile
          bun run assets
          bun run check
          bun test
          bun x tsc --noEmit
      - name: Retrieve the existing verified videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 35881755433 --repo cabicci/viva-ai-systems-55d35820 --interval 45 --exit-status > "$RUNNER_TEMP/kids-production-watch.log"
          gh run download 35881755433 --repo cabicci/viva-ai-systems-55d35820 --dir "$RUNNER_TEMP/kids-package"
          python scripts/import-artifacts.py "$RUNNER_TEMP/kids-package" --run-id 35881755433 --source-sha 7b82e2646864c51ff6a10ba38182b359e954c8d3
          bun scripts/illustrate.ts
      - name: Build the complete offline review package
        run: |
          bun run build
          python scripts/package-review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masaarat-kids-complete-lesson-${{ github.run_id }}
          path: experiments/masaarat-kids/review-package/
          retention-days: 30
          if-no-files-found: error
