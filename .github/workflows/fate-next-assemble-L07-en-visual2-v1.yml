name: Fate final corrected visual lesson L07-en
on:
  push:
    branches: [work/masaarat/0c0df2131ade371ac908def0]
    paths: [experiments/course-pipeline/rebuild/fate-L02-L07-bilingual-v1/assemble-L07-en-visual2/request.json]
permissions:
  contents: read
  actions: read
env:
  PACKAGE: experiments/course-pipeline/rebuild/fate-L02-L07-bilingual-v1/assemble-L07-en-visual2
  EXPECTED_REQUEST_SHA256: b55a0f49ff5947ed99e83c1e5ff4cdedd51522f83f9a8c15ef9ad0d5f459ae87
jobs:
  assemble:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assemble exact PCM and inspect actual joins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          python "$PACKAGE/worker.py"
      - name: Receive complete lesson or preserved review evidence immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-next-complete-L07-en-visual2
          path: ${{ env.PACKAGE }}/final/
          retention-days: 30
