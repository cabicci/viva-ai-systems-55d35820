name: Automatic assistant indexing

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-automatic-indexing
  cancel-in-progress: false

jobs:
  prepare-approved-content:
    if: >-
      github.repository == 'cabicci/viva-ai-systems-55d35820' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Set up pinned runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.3"
      - name: Reconcile approved card indexes through the platform
        run: bun run scripts/assistant/automatic-worker-client.ts
