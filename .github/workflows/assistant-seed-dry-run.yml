name: Assistant Seed Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run seed script (dry-run only)
        env:
          DRY_RUN: "true"
          REQUIRE_CONFIRM_SEED: "true"
          CONFIRM_SEED_100_LESSONS: "false"
          MAX_EMBEDDING_REQUESTS: "150"
        run: python scripts/seed-knowledge/run.py
