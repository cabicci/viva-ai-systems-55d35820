name: Technical motion v2 production
on:
  push:
    branches: [review/cabinet-ai-style-20261010]
    paths: [.github/workflows/technical-motion-v2.yml]
permissions:
  contents: write
concurrency:
  group: technical-motion-v2-20261011
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Check changed coordination and deletion guards
        run: |
          python3 scripts/technical-v2/test_coordination.py
          python3 scripts/technical-v2/test_replacement.py
      - id: scope
        run: python3 scripts/technical-v2/production.py prepare
  produce:
    needs: authorize
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lesson: ${{ fromJson(needs.authorize.outputs.matrix) }}
    env:
      BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
      BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LID: ${{ matrix.lesson }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install existing rendering dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install numpy==2.2.6
          cd remotion
          bun install --frozen-lockfile
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        id: voice_cache
        with:
          path: technical-v2-audio/${{ matrix.lesson }}
          key: technical-v2-gemini-charon-${{ matrix.lesson }}-20261011
      - name: Produce ar-EG replacement
        id: build0
        continue-on-error: true
        run: python3 scripts/technical-v2/production.py build --lesson "$LID" --locale ar-EG
      - name: Preserve ar-EG original and new video before switching
        id: backup0
        if: steps.build0.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: technical-v2-backup-${{ matrix.lesson }}-ar-EG-${{ github.run_id }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            technical-v2-output/${{ matrix.lesson }}__ar-EG/previous.mp4
            technical-v2-output/${{ matrix.lesson }}__ar-EG/previous.json
            technical-v2-output/${{ matrix.lesson }}__ar-EG/replacement.mp4
            technical-v2-output/${{ matrix.lesson }}__ar-EG/receipt.json
            technical-v2-output/${{ matrix.lesson }}__ar-EG/props.json
      - name: Upload await existing cloud coordinator and remove confirmed old ar-EG video
        id: publish0
        if: steps.backup0.outcome == 'success'
        continue-on-error: true
        env:
          BACKUP_ARTIFACT_ID: ${{ steps.backup0.outputs.artifact-id }}
        run: python3 scripts/technical-v2/production.py publish --lesson "$LID" --locale ar-EG
      - name: Produce ar-MSA replacement
        id: build1
        continue-on-error: true
        run: python3 scripts/technical-v2/production.py build --lesson "$LID" --locale ar-MSA
      - name: Preserve ar-MSA original and new video before switching
        id: backup1
        if: steps.build1.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: technical-v2-backup-${{ matrix.lesson }}-ar-MSA-${{ github.run_id }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            technical-v2-output/${{ matrix.lesson }}__ar-MSA/previous.mp4
            technical-v2-output/${{ matrix.lesson }}__ar-MSA/previous.json
            technical-v2-output/${{ matrix.lesson }}__ar-MSA/replacement.mp4
            technical-v2-output/${{ matrix.lesson }}__ar-MSA/receipt.json
            technical-v2-output/${{ matrix.lesson }}__ar-MSA/props.json
      - name: Upload await existing cloud coordinator and remove confirmed old ar-MSA video
        id: publish1
        if: steps.backup1.outcome == 'success'
        continue-on-error: true
        env:
          BACKUP_ARTIFACT_ID: ${{ steps.backup1.outputs.artifact-id }}
        run: python3 scripts/technical-v2/production.py publish --lesson "$LID" --locale ar-MSA
      - name: Produce ar-Gulf replacement
        id: build2
        continue-on-error: true
        run: python3 scripts/technical-v2/production.py build --lesson "$LID" --locale ar-Gulf
      - name: Preserve ar-Gulf original and new video before switching
        id: backup2
        if: steps.build2.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: technical-v2-backup-${{ matrix.lesson }}-ar-Gulf-${{ github.run_id }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            technical-v2-output/${{ matrix.lesson }}__ar-Gulf/previous.mp4
            technical-v2-output/${{ matrix.lesson }}__ar-Gulf/previous.json
            technical-v2-output/${{ matrix.lesson }}__ar-Gulf/replacement.mp4
            technical-v2-output/${{ matrix.lesson }}__ar-Gulf/receipt.json
            technical-v2-output/${{ matrix.lesson }}__ar-Gulf/props.json
      - name: Upload await existing cloud coordinator and remove confirmed old ar-Gulf video
        id: publish2
        if: steps.backup2.outcome == 'success'
        continue-on-error: true
        env:
          BACKUP_ARTIFACT_ID: ${{ steps.backup2.outputs.artifact-id }}
        run: python3 scripts/technical-v2/production.py publish --lesson "$LID" --locale ar-Gulf
      - name: Produce en replacement
        id: build3
        continue-on-error: true
        run: python3 scripts/technical-v2/production.py build --lesson "$LID" --locale en
      - name: Preserve en original and new video before switching
        id: backup3
        if: steps.build3.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: technical-v2-backup-${{ matrix.lesson }}-en-${{ github.run_id }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            technical-v2-output/${{ matrix.lesson }}__en/previous.mp4
            technical-v2-output/${{ matrix.lesson }}__en/previous.json
            technical-v2-output/${{ matrix.lesson }}__en/replacement.mp4
            technical-v2-output/${{ matrix.lesson }}__en/receipt.json
            technical-v2-output/${{ matrix.lesson }}__en/props.json
      - name: Upload await existing cloud coordinator and remove confirmed old en video
        id: publish3
        if: steps.backup3.outcome == 'success'
        continue-on-error: true
        env:
          BACKUP_ARTIFACT_ID: ${{ steps.backup3.outputs.artifact-id }}
        run: python3 scripts/technical-v2/production.py publish --lesson "$LID" --locale en
      - name: Preserve Egyptian audio cache including unknown-outcome markers
        if: always() && steps.voice_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: technical-v2-audio/${{ matrix.lesson }}
          key: ${{ steps.voice_cache.outputs.cache-primary-key }}
      - name: Keep durable final receipts and narration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: technical-v2-receipts-${{ matrix.lesson }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            technical-v2-output/**/receipt.json
            technical-v2-output/**/previous.json
            technical-v2-output/**/props.json
            technical-v2-audio/
      - name: Report incomplete cells without cancelling other lessons
        if: always()
        env:
          CELL0: ${{ steps.publish0.outcome }}
          CELL1: ${{ steps.publish1.outcome }}
          CELL2: ${{ steps.publish2.outcome }}
          CELL3: ${{ steps.publish3.outcome }}
        run: |
          python3 - <<'PYCODE'
          import os,sys
          incomplete=[i for i in range(4) if os.environ.get(f"CELL{i}")!="success"]
          if incomplete:
            print(f"Unfinished locale indexes: {incomplete}; successful replacements remain linked.")
            sys.exit(1)
          print("Four replacements linked; four originals preserved in durable backup then removed.")
          PYCODE
