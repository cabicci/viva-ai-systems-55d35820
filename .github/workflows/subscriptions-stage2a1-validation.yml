name: Subscriptions Stage 2A1 CI Validation

on:
  push:
    branches:
      - ci/subscriptions-stage2a1-validation

permissions:
  contents: read

concurrency:
  group: subscriptions-stage2a1-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  IMMUTABLE_SHA: 5596118c2c78a0c8bf466773a91ac8dde0704a98
  SUPABASE_CLI: "npx -y supabase@2.109.1"
  ARTIFACT_DIR: ci-artifacts/subscriptions-stage2a1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable validation target
        uses: actions/checkout@v4
        with:
          ref: 5596118c2c78a0c8bf466773a91ac8dde0704a98
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CI tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq postgresql-client

      - name: Run Stage 2A1 validation
        id: validation
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ARTIFACT_DIR"
          RESULTS_FILE="$ARTIFACT_DIR/stage2a1-assertions.json"
          ASSERTIONS=()
          FAIL_COUNT=0

          record_assertion() {
            local num="$1" name="$2" expected="$3" actual="$4" status="$5" evidence="$6"
            ASSERTIONS+=("$(jq -n \
              --argjson number "$num" \
              --arg name "$name" \
              --arg expected "$expected" \
              --arg actual "$actual" \
              --arg status "$status" \
              --arg evidence "$evidence" \
              '{number: $number, name: $name, expected: $expected, actual: $actual, status: $status, evidence: $evidence}')")
            if [[ "$status" != "PASS" ]]; then
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          }

          ASSERTION_NAMES=(
            "Immutable SHA verified"
            "Docker and Supabase CLI available"
            "Local Supabase startup succeeded"
            "Complete migration history succeeded"
            "pgvector available and installed"
            "Seven billing migrations present exactly once in correct order"
            "Exactly 32 billing tables"
            "Exactly 9 billing functions"
            "Exactly 15 billing policies"
            "Exactly 81 billing indexes"
            "Billing PostgREST profile works"
            "Anonymous access denied"
            "Authenticated safe own-row reads work"
            "Cross-user reads denied"
            "Authenticated writes denied"
            "Sensitive tables inaccessible"
            "Required service-role RPCs succeed"
            "SECURITY DEFINER ownership and search_path pass"
            "No unintended PUBLIC/client EXECUTE privileges"
            "Missing and denied lifecycle states fail closed"
            "Only valid paid_active grants paid entitlement"
            "Focused billing tests pass"
            "Vite build passes"
            "No tracked repository file remains modified after cleanup"
            "No remote, provider, deployment, merge, push-to-main, or Production operation occurred"
            "Disposable Supabase cleanup succeeded"
          )

          write_results() {
            local -a final=()
            local num name found status overall="PASS"
            local passed=0 failed=0 not_reached=0

            for num in $(seq 1 26); do
              name="${ASSERTION_NAMES[$((num - 1))]}"
              found=""
              for entry in "${ASSERTIONS[@]}"; do
                if [[ "$(echo "$entry" | jq -r '.number')" == "$num" ]]; then
                  found="$entry"
                  break
                fi
              done
              if [[ -z "$found" ]]; then
                found="$(jq -n \
                  --argjson number "$num" \
                  --arg name "$name" \
                  '{number: $number, name: $name, expected: "", actual: "not executed", status: "NOT REACHED", evidence: "script exit before assertion recorded"}')"
                not_reached=$((not_reached + 1))
              else
                status="$(echo "$found" | jq -r '.status')"
                case "$status" in
                  PASS) passed=$((passed + 1)) ;;
                  FAIL) failed=$((failed + 1)) ;;
                  "NOT REACHED") not_reached=$((not_reached + 1)) ;;
                esac
              fi
              final+=("$found")
            done

            if [[ "$failed" -gt 0 || "$not_reached" -gt 0 ]]; then
              overall="FAIL"
            fi

            jq -n \
              --argjson assertions "$(printf '%s\n' "${final[@]}" | jq -s '.')" \
              --arg overall "$overall" \
              --argjson passed "$passed" \
              --argjson failed "$failed" \
              --argjson not_reached "$not_reached" \
              '{assertions: $assertions, summary: {overall: $overall, passed: $passed, failed: $failed, not_reached: $not_reached, total: 26}}' \
              > "$RESULTS_FILE"
          }

          on_exit() {
            write_results || true
          }
          trap on_exit EXIT

          SUPABASE_STATUS_ENV_FILE="$ARTIFACT_DIR/supabase-status-env.txt"
          LOCAL_PG_URL=""
          LOCAL_PG_URL_SOURCE=""
          SUPABASE_STATUS_ENV_NAMES=""

          load_supabase_status_env() {
            $SUPABASE_CLI status -o env > "$SUPABASE_STATUS_ENV_FILE" 2>&1 || true
            SUPABASE_STATUS_ENV_NAMES="$(
              grep -E '^[A-Z_][A-Z0-9_]*=' "$SUPABASE_STATUS_ENV_FILE" 2>/dev/null \
                | cut -d= -f1 \
                | sort -u \
                | tr '\n' ',' \
                | sed 's/,$//' \
                || true
            )"
            set +u
            while IFS= read -r env_line; do
              [[ "$env_line" =~ ^[A-Z_][A-Z0-9_]*= ]] || continue
              export "$env_line"
            done < "$SUPABASE_STATUS_ENV_FILE"
            set -u
            map_supabase_api_env
          }

          is_http_url() {
            [[ -n "${1:-}" ]] && [[ "$1" == http://* || "$1" == https://* ]]
          }

          normalize_env_value() {
            local value="${1:-}"
            value="${value//$'\r'/}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [[ ${#value} -ge 2 && "$value" == \"*\" ]]; then
              value="${value:1:${#value}-2}"
            elif [[ ${#value} -ge 2 && "$value" == \'*\' ]]; then
              value="${value:1:${#value}-2}"
            fi
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          count_migration_occurrences() {
            local needle="$1" file="$2" count="" status=0
            set +e
            count="$(grep -c -F "$needle" "$file" 2>/dev/null)"
            status=$?
            set -e
            if [[ $status -ne 0 && -z "$count" ]]; then
              count=0
            fi
            count="$(printf '%s' "$count" | tr -d '\r\n\t ')"
            [[ -z "$count" || ! "$count" =~ ^[0-9]+$ ]] && count=0
            printf '%s' "$count"
          }

          map_supabase_api_env() {
            local resolved_url="" rest_base=""
            local norm_api norm_rest norm_supabase
            local norm_anon norm_publish norm_service norm_secret
            norm_api="$(normalize_env_value "${API_URL:-}")"
            norm_rest="$(normalize_env_value "${REST_URL:-}")"
            norm_supabase="$(normalize_env_value "${SUPABASE_URL:-}")"
            if is_http_url "$norm_api"; then
              resolved_url="$norm_api"
            elif is_http_url "$norm_rest"; then
              rest_base="$norm_rest"
              if [[ "$rest_base" == */rest/v1 ]]; then
                rest_base="${rest_base%/rest/v1}"
              fi
              resolved_url="$rest_base"
            elif is_http_url "$norm_supabase"; then
              resolved_url="$norm_supabase"
            fi
            SUPABASE_URL="$resolved_url"
            norm_anon="$(normalize_env_value "${ANON_KEY:-}")"
            norm_publish="$(normalize_env_value "${PUBLISHABLE_KEY:-}")"
            norm_service="$(normalize_env_value "${SERVICE_ROLE_KEY:-}")"
            norm_secret="$(normalize_env_value "${SECRET_KEY:-}")"
            SUPABASE_ANON_KEY="$(normalize_env_value "${SUPABASE_ANON_KEY:-}")"
            [[ -z "$SUPABASE_ANON_KEY" ]] && SUPABASE_ANON_KEY="${norm_anon:-$norm_publish}"
            if [[ -n "$norm_service" ]]; then
              SUPABASE_SERVICE_ROLE_KEY="$norm_service"
            else
              SUPABASE_SERVICE_ROLE_KEY="$norm_secret"
            fi
            if [[ -n "$norm_secret" ]]; then
              SUPABASE_SERVICE_API_KEY="$norm_secret"
            elif [[ -n "$norm_service" ]]; then
              SUPABASE_SERVICE_API_KEY="$norm_service"
            else
              SUPABASE_SERVICE_API_KEY="$SUPABASE_ANON_KEY"
            fi
          }

          require_supabase_api_env() {
            map_supabase_api_env
            local missing=()
            [[ -z "${SUPABASE_URL:-}" ]] && missing+=("SUPABASE_URL")
            [[ -z "${SUPABASE_ANON_KEY:-}" ]] && missing+=("SUPABASE_ANON_KEY")
            [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
            if [[ ${#missing[@]} -gt 0 ]]; then
              {
                echo "FATAL: required Supabase API credentials are not available after CLI env mapping."
                echo "Missing script variables: $(IFS=,; echo "${missing[*]}")"
                echo "Checked source variable presence (names only):"
                for name in SUPABASE_URL API_URL REST_URL SUPABASE_ANON_KEY ANON_KEY SUPABASE_PUBLISHABLE_KEY PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY SERVICE_ROLE_KEY SECRET_KEY; do
                  if [[ -n "${!name:-}" ]]; then
                    echo "${name}=present"
                  else
                    echo "${name}=absent"
                  fi
                done
              } > "$ARTIFACT_DIR/supabase-api-env-error.txt"
              echo "FATAL: required Supabase API credentials unavailable. See supabase-api-env-error.txt (presence only; no secrets)." >&2
              exit 1
            fi
            if [[ ! "$SUPABASE_URL" =~ ^https?:// ]]; then
              {
                echo "FATAL: derived Supabase API URL failed scheme validation."
                echo "SUPABASE_URL variable is present but does not begin with http:// or https://."
              } > "$ARTIFACT_DIR/supabase-api-env-error.txt"
              echo "FATAL: derived Supabase API URL failed scheme validation. See supabase-api-env-error.txt." >&2
              exit 1
            fi
            {
              echo "supabase_url_mapped=yes"
              echo "anon_key_mapped=yes"
              echo "service_role_key_mapped=yes"
              echo "checked_names=SUPABASE_URL,API_URL,REST_URL,SUPABASE_ANON_KEY,ANON_KEY,SUPABASE_PUBLISHABLE_KEY,PUBLISHABLE_KEY,SUPABASE_SERVICE_ROLE_KEY,SERVICE_ROLE_KEY,SECRET_KEY"
            } > "$ARTIFACT_DIR/supabase-api-env-derivation.txt"
          }

          is_postgres_url() {
            [[ -n "${1:-}" ]] && [[ "$1" == postgresql://* || "$1" == postgres://* ]]
          }

          resolve_local_pg_url() {
            local candidate="" var db_port
            load_supabase_status_env

            for var in DB_URL SUPABASE_DB_URL DATABASE_URL POSTGRES_URL PGURL; do
              candidate="${!var:-}"
              if is_postgres_url "$candidate"; then
                LOCAL_PG_URL="$candidate"
                LOCAL_PG_URL_SOURCE="$var"
                return 0
              fi
            done

            candidate="$(
              $SUPABASE_CLI status 2>/dev/null \
                | grep -E 'DB URL:|Database URL:|│ URL │' \
                | head -n1 \
                | sed -E 's/.*((postgres(ql)?):\/\/[^[:space:]│]+).*/\1/' \
                || true
            )"
            if is_postgres_url "$candidate"; then
              LOCAL_PG_URL="$candidate"
              LOCAL_PG_URL_SOURCE="supabase status text"
              return 0
            fi

            db_port="$(grep -E '^port\s*=' supabase/config.toml 2>/dev/null | head -n1 | sed -E 's/.*=\s*([0-9]+).*/\1/' || true)"
            [[ -n "$db_port" ]] || db_port="54322"
            candidate="postgresql://postgres:postgres@127.0.0.1:${db_port}/postgres"
            if is_postgres_url "$candidate"; then
              LOCAL_PG_URL="$candidate"
              LOCAL_PG_URL_SOURCE="config.toml fallback"
              return 0
            fi

            return 1
          }

          require_local_pg_url() {
            LOCAL_PG_URL=""
            LOCAL_PG_URL_SOURCE=""
            if ! resolve_local_pg_url; then
              {
                echo "FATAL: could not derive local PostgreSQL connection URL."
                echo "Checked exported variable names: ${SUPABASE_STATUS_ENV_NAMES:-none captured}"
                echo "Also attempted: supabase status text parse and config.toml local fallback."
                echo "Expected a non-empty value beginning with postgresql:// or postgres://."
              } > "$ARTIFACT_DIR/pg-url-derivation-error.txt"
              echo "FATAL: could not derive local PostgreSQL connection URL. See pg-url-derivation-error.txt (variable names only; no secrets)." >&2
              exit 1
            fi
            if ! is_postgres_url "$LOCAL_PG_URL"; then
              {
                echo "FATAL: derived PostgreSQL URL failed scheme validation."
                echo "Checked exported variable names: ${SUPABASE_STATUS_ENV_NAMES:-none captured}"
                echo "Derivation source label: ${LOCAL_PG_URL_SOURCE:-unknown}"
              } > "$ARTIFACT_DIR/pg-url-derivation-error.txt"
              echo "FATAL: derived PostgreSQL URL failed scheme validation. See pg-url-derivation-error.txt." >&2
              exit 1
            fi
            {
              echo "source=${LOCAL_PG_URL_SOURCE}"
              echo "scheme=$(echo "$LOCAL_PG_URL" | sed -E 's|^(postgres(ql)?)://.*|\1|')"
              echo "host_redacted=$(echo "$LOCAL_PG_URL" | sed -E 's|^(postgres(ql)?://)[^@]+@([^:/]+).*|\2|')"
            } > "$ARTIFACT_DIR/pg-url-derivation.txt"
          }

          # --- Preflight ---
          docker version > "$ARTIFACT_DIR/docker-version.txt" 2>&1 || true
          docker info > "$ARTIFACT_DIR/docker-info.txt" 2>&1 || true
          node --version > "$ARTIFACT_DIR/node-version.txt"
          npm --version > "$ARTIFACT_DIR/npm-version.txt"
          $SUPABASE_CLI --version > "$ARTIFACT_DIR/supabase-cli-version.txt"

          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$HEAD_SHA" == "$IMMUTABLE_SHA" ]]; then
            record_assertion 1 "Immutable SHA verified" "$IMMUTABLE_SHA" "$HEAD_SHA" "PASS" "git rev-parse HEAD"
          else
            record_assertion 1 "Immutable SHA verified" "$IMMUTABLE_SHA" "$HEAD_SHA" "FAIL" "git rev-parse HEAD"
          fi

          if git diff --quiet && git diff --cached --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "clean" > "$ARTIFACT_DIR/repo-status.txt"
          else
            echo "dirty" > "$ARTIFACT_DIR/repo-status.txt"
            git status --porcelain > "$ARTIFACT_DIR/repo-status-detail.txt" || true
          fi

          DOCKER_OK="no"
          if docker version >/dev/null 2>&1 && $SUPABASE_CLI --version >/dev/null 2>&1; then
            DOCKER_OK="yes"
            record_assertion 2 "Docker and Supabase CLI available" "available" "available" "PASS" "docker version; supabase --version"
          else
            record_assertion 2 "Docker and Supabase CLI available" "available" "unavailable" "FAIL" "docker version; supabase --version"
          fi

          # --- Local Supabase startup ---
          START_OK="no"
          if [[ "$DOCKER_OK" == "yes" ]]; then
            if $SUPABASE_CLI start > "$ARTIFACT_DIR/supabase-start.log" 2>&1; then
              $SUPABASE_CLI status > "$ARTIFACT_DIR/supabase-status.txt" 2>&1 || true
              START_OK="yes"
              record_assertion 3 "Local Supabase startup succeeded" "started" "started" "PASS" "supabase start"
            else
              record_assertion 3 "Local Supabase startup succeeded" "started" "failed" "FAIL" "supabase start log"
            fi
          else
            record_assertion 3 "Local Supabase startup succeeded" "started" "skipped" "FAIL" "docker unavailable"
          fi

          # --- Migration reset ---
          MIGRATION_OK="no"
          if [[ "$START_OK" == "yes" ]]; then
            if $SUPABASE_CLI db reset --local --no-seed > "$ARTIFACT_DIR/db-reset-primary.log" 2>&1; then
              MIGRATION_OK="yes"
              record_assertion 4 "Complete migration history succeeded" "exit 0" "exit 0" "PASS" "db reset --local --no-seed"
            else
              record_assertion 4 "Complete migration history succeeded" "exit 0" "non-zero" "FAIL" "db reset log"
            fi
            $SUPABASE_CLI migration list --local > "$ARTIFACT_DIR/migration-list-primary.txt" 2>&1 || true
          else
            record_assertion 4 "Complete migration history succeeded" "exit 0" "skipped" "FAIL" "supabase not started"
          fi

          # --- pgvector ---
          PGVECTOR_OK="no"
          if [[ "$MIGRATION_OK" == "yes" ]]; then
            require_local_pg_url
            psql "$LOCAL_PG_URL" -v ON_ERROR_STOP=1 -At -c "
              SELECT 'available=' || EXISTS(SELECT 1 FROM pg_available_extensions WHERE name='vector');
              SELECT 'installed=' || EXISTS(SELECT 1 FROM pg_extension WHERE extname='vector');
              SELECT 'installed_version=' || COALESCE((SELECT extversion FROM pg_extension WHERE extname='vector'), 'null');
            " > "$ARTIFACT_DIR/pgvector-evidence.txt" 2>&1 || true

            if grep -q "available=t" "$ARTIFACT_DIR/pgvector-evidence.txt" \
              && grep -q "installed=t" "$ARTIFACT_DIR/pgvector-evidence.txt" \
              && grep -q "installed_version=" "$ARTIFACT_DIR/pgvector-evidence.txt" \
              && ! grep -q "installed_version=null" "$ARTIFACT_DIR/pgvector-evidence.txt"; then
              PGVECTOR_OK="yes"
              record_assertion 5 "pgvector available and installed" "installed non-null" "installed" "PASS" "pgvector-evidence.txt"
            else
              record_assertion 5 "pgvector available and installed" "installed non-null" "missing or null" "FAIL" "pgvector-evidence.txt"
            fi
          else
            record_assertion 5 "pgvector available and installed" "installed non-null" "skipped" "FAIL" "migrations not applied"
          fi

          # --- Seven billing migrations ---
          BILLING_MIGS=(
            "20260709190000_billing_schema_phase1.sql"
            "20260709190100_billing_rls_policies.sql"
            "20260709190200_billing_rpc_entitlement.sql"
            "20260709190300_billing_rpc_quota.sql"
            "20260709190400_billing_rpc_subscription.sql"
            "20260709190500_billing_rpc_credits.sql"
            "20260709190600_billing_outbox_job_tables.sql"
          )
          if [[ "$MIGRATION_OK" == "yes" ]]; then
            MIG_ORDER_OK="yes"
            MIG_COUNTS=""
            for mig in "${BILLING_MIGS[@]}"; do
              mig_ts="${mig%%_*}"
              count="$(count_migration_occurrences "$mig_ts" "$ARTIFACT_DIR/migration-list-primary.txt")"
              MIG_COUNTS="${MIG_COUNTS}${mig}:${count};"
              if [[ "$count" -ne 1 ]]; then MIG_ORDER_OK="no"; fi
            done
            grep -E "billing_schema_phase1|billing_rls|billing_rpc|billing_outbox" "$ARTIFACT_DIR/migration-list-primary.txt" \
              > "$ARTIFACT_DIR/billing-migration-order.txt" || true
            if [[ "$MIG_ORDER_OK" == "yes" ]]; then
              record_assertion 6 "Seven billing migrations present exactly once in correct order" "7x once ordered" "7x once ordered" "PASS" "billing-migration-order.txt"
            else
              record_assertion 6 "Seven billing migrations present exactly once in correct order" "7x once ordered" "$MIG_COUNTS" "FAIL" "billing-migration-order.txt"
            fi
          else
            record_assertion 6 "Seven billing migrations present exactly once in correct order" "7x once ordered" "skipped" "FAIL" "migrations not applied"
          fi

          # --- Database object inventory ---
          if [[ "$MIGRATION_OK" == "yes" ]]; then
            psql "$LOCAL_PG_URL" -v ON_ERROR_STOP=1 -At -c "
              SELECT 'tables=' || count(*)::text FROM information_schema.tables WHERE table_schema='billing' AND table_type='BASE TABLE';
              SELECT 'functions=' || count(*)::text FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid WHERE n.nspname='billing' AND p.prokind='f';
              SELECT 'policies=' || count(*)::text FROM pg_policies WHERE schemaname='billing';
              SELECT 'indexes=' || count(*)::text FROM pg_indexes WHERE schemaname='billing';
            " > "$ARTIFACT_DIR/db-object-counts.txt"

            psql "$LOCAL_PG_URL" -At -c "
              SELECT table_name FROM information_schema.tables WHERE table_schema='billing' AND table_type='BASE TABLE' ORDER BY table_name;
            " > "$ARTIFACT_DIR/billing-tables.txt"

            psql "$LOCAL_PG_URL" -At -c "
              SELECT p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')'
              FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
              WHERE n.nspname='billing' AND p.prokind='f' ORDER BY 1;
            " > "$ARTIFACT_DIR/billing-functions.txt"

            TABLE_COUNT="$(grep '^tables=' "$ARTIFACT_DIR/db-object-counts.txt" | cut -d= -f2)"
            FUNC_COUNT="$(grep '^functions=' "$ARTIFACT_DIR/db-object-counts.txt" | cut -d= -f2)"
            POLICY_COUNT="$(grep '^policies=' "$ARTIFACT_DIR/db-object-counts.txt" | cut -d= -f2)"
            INDEX_COUNT="$(grep '^indexes=' "$ARTIFACT_DIR/db-object-counts.txt" | cut -d= -f2)"

            [[ "$TABLE_COUNT" == "32" ]] && record_assertion 7 "Exactly 32 billing tables" "32" "$TABLE_COUNT" "PASS" "db-object-counts.txt" \
              || record_assertion 7 "Exactly 32 billing tables" "32" "$TABLE_COUNT" "FAIL" "billing-tables.txt"
            [[ "$FUNC_COUNT" == "9" ]] && record_assertion 8 "Exactly 9 billing functions" "9" "$FUNC_COUNT" "PASS" "billing-functions.txt" \
              || record_assertion 8 "Exactly 9 billing functions" "9" "$FUNC_COUNT" "FAIL" "billing-functions.txt"
            [[ "$POLICY_COUNT" == "15" ]] && record_assertion 9 "Exactly 15 billing policies" "15" "$POLICY_COUNT" "PASS" "db-object-counts.txt" \
              || record_assertion 9 "Exactly 15 billing policies" "15" "$POLICY_COUNT" "FAIL" "db-object-counts.txt"
            [[ "$INDEX_COUNT" == "81" ]] && record_assertion 10 "Exactly 81 billing indexes" "81" "$INDEX_COUNT" "PASS" "db-object-counts.txt" \
              || record_assertion 10 "Exactly 81 billing indexes" "81" "$INDEX_COUNT" "FAIL" "db-object-counts.txt"
          else
            for n in 7 8 9 10; do
              case $n in
                7) record_assertion 7 "Exactly 32 billing tables" "32" "skipped" "FAIL" "migrations not applied" ;;
                8) record_assertion 8 "Exactly 9 billing functions" "9" "skipped" "FAIL" "migrations not applied" ;;
                9) record_assertion 9 "Exactly 15 billing policies" "15" "skipped" "FAIL" "migrations not applied" ;;
                10) record_assertion 10 "Exactly 81 billing indexes" "81" "skipped" "FAIL" "migrations not applied" ;;
              esac
            done
          fi

          # --- PostgREST billing schema profile ---
          CONFIG_BACKUP="supabase/config.toml.ci-backup"
          cp supabase/config.toml "$CONFIG_BACKUP"
          if grep -q 'schemas = \["public", "graphql_public"\]' supabase/config.toml; then
            sed -i 's/schemas = \["public", "graphql_public"\]/schemas = ["public", "graphql_public", "billing"]/' supabase/config.toml
          elif grep -q '^schemas =' supabase/config.toml; then
            sed -i 's/^schemas = .*/schemas = ["public", "graphql_public", "billing"]/' supabase/config.toml
          else
            printf '\n[api]\nenabled = true\nschemas = ["public", "graphql_public", "billing"]\n' >> supabase/config.toml
          fi
          grep -E '^\[api\]|^schemas' supabase/config.toml > "$ARTIFACT_DIR/config-toml-billing-schemas.txt" || true

          BILLING_PROFILE_OK="no"
          if [[ "$MIGRATION_OK" == "yes" ]]; then
            $SUPABASE_CLI stop --no-backup > "$ARTIFACT_DIR/supabase-stop-for-profile.log" 2>&1 || true
            $SUPABASE_CLI start > "$ARTIFACT_DIR/supabase-restart-for-profile.log" 2>&1 || true
            $SUPABASE_CLI db reset --local --no-seed > "$ARTIFACT_DIR/db-reset-billing-profile.log" 2>&1 || true
            load_supabase_status_env
            require_local_pg_url
            require_supabase_api_env

            {
              echo "max_wait_seconds=120"
              echo "poll_interval_seconds=5"
            } > "$ARTIFACT_DIR/postgrest-readiness.txt"
            PROFILE_CODE=""
            READINESS_ATTEMPTS=0
            READINESS_ELAPSED=0
            READINESS_STATUS_SEQ=""
            READINESS_RESULT="timeout"
            while [[ "$READINESS_ELAPSED" -lt 120 ]]; do
              READINESS_ATTEMPTS=$((READINESS_ATTEMPTS + 1))
              set +e
              PROFILE_CODE="$(curl -s -o /dev/null -w '%{http_code}' \
                -X POST "${SUPABASE_URL}/rest/v1/rpc/get_entitlement_snapshot" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "apikey: ${SUPABASE_SERVICE_API_KEY}" \
                -H "Accept-Profile: billing" \
                -H "Content-Profile: billing" \
                -H "Content-Type: application/json" \
                -d '{"p_user_id":"00000000-0000-0000-0000-000000000001"}' 2>/dev/null)"
              CURL_STATUS=$?
              set -e
              READINESS_HTTP_STATUS="$PROFILE_CODE"
              if [[ $CURL_STATUS -ne 0 || -z "$READINESS_HTTP_STATUS" || "$READINESS_HTTP_STATUS" == "000" ]]; then
                READINESS_HTTP_STATUS="connection_failure"
              fi
              echo "attempt=${READINESS_ATTEMPTS} elapsed_seconds=${READINESS_ELAPSED} http_status=${READINESS_HTTP_STATUS}" >> "$ARTIFACT_DIR/postgrest-readiness.txt"
              if [[ -n "$READINESS_STATUS_SEQ" ]]; then
                READINESS_STATUS_SEQ="${READINESS_STATUS_SEQ},${READINESS_HTTP_STATUS}"
              else
                READINESS_STATUS_SEQ="${READINESS_HTTP_STATUS}"
              fi
              if [[ "$READINESS_HTTP_STATUS" != "503" && "$READINESS_HTTP_STATUS" != "connection_failure" ]]; then
                PROFILE_CODE="$READINESS_HTTP_STATUS"
                READINESS_RESULT="ready"
                break
              fi
              PROFILE_CODE="$READINESS_HTTP_STATUS"
              if [[ $((READINESS_ELAPSED + 5)) -ge 120 ]]; then
                break
              fi
              sleep 5
              READINESS_ELAPSED=$((READINESS_ELAPSED + 5))
            done
            {
              echo "attempts=${READINESS_ATTEMPTS}"
              echo "elapsed_seconds=${READINESS_ELAPSED}"
              echo "status_sequence=${READINESS_STATUS_SEQ}"
              echo "final_http_status=${PROFILE_CODE}"
              echo "readiness_result=${READINESS_RESULT}"
            } >> "$ARTIFACT_DIR/postgrest-readiness.txt"
            echo "billing_profile_http=${PROFILE_CODE}" > "$ARTIFACT_DIR/postgrest-billing-profile.txt"
            if [[ "$PROFILE_CODE" =~ ^2 ]]; then
              BILLING_PROFILE_OK="yes"
              record_assertion 11 "Billing PostgREST profile works" "2xx" "$PROFILE_CODE" "PASS" "postgrest-billing-profile.txt"
            else
              record_assertion 11 "Billing PostgREST profile works" "2xx" "$PROFILE_CODE" "FAIL" "postgrest-billing-profile.txt"
            fi
          else
            record_assertion 11 "Billing PostgREST profile works" "2xx" "skipped" "FAIL" "migrations not applied"
          fi

          # --- Security evidence SQL ---
          if [[ "$MIGRATION_OK" == "yes" ]]; then
            require_local_pg_url
            psql "$LOCAL_PG_URL" -At -c "
              SELECT 'rls_enabled_missing=' || count(*)::text
              FROM pg_class c JOIN pg_namespace n ON c.relnamespace=n.oid
              WHERE n.nspname='billing' AND c.relkind='r' AND NOT c.relrowsecurity;
              SELECT 'force_rls_enabled=' || count(*)::text
              FROM pg_class c JOIN pg_namespace n ON c.relnamespace=n.oid
              WHERE n.nspname='billing' AND c.relkind='r' AND c.relforcerowsecurity;
              SELECT 'anon_table_privs=' || count(*)::text
              FROM information_schema.table_privileges
              WHERE table_schema='billing' AND grantee='anon';
              SELECT 'auth_write_privs=' || count(*)::text
              FROM information_schema.table_privileges
              WHERE table_schema='billing' AND grantee='authenticated'
                AND privilege_type IN ('INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER');
              SELECT 'broad_using_true=' || count(*)::text FROM pg_policies
              WHERE schemaname='billing' AND qual='true';
              SELECT 'broad_with_check_true=' || count(*)::text FROM pg_policies
              WHERE schemaname='billing' AND with_check='true';
            " > "$ARTIFACT_DIR/rls-grants-evidence.txt"

            psql "$LOCAL_PG_URL" -At -c "
              SELECT policyname, cmd, roles::text, qual, with_check
              FROM pg_policies WHERE schemaname='billing' ORDER BY policyname;
            " > "$ARTIFACT_DIR/billing-policies-detail.txt"

            psql "$LOCAL_PG_URL" -At -c "
              SELECT p.proname, p.prosecdef, pg_get_userbyid(p.proowner) AS owner, array_to_string(p.proconfig, ',')
              FROM pg_proc p JOIN pg_namespace n ON p.pronamespace=n.oid
              WHERE n.nspname='billing' AND p.prokind='f' ORDER BY p.proname;
            " > "$ARTIFACT_DIR/billing-functions-security.txt"

            psql "$LOCAL_PG_URL" -At -c "
              SELECT routine_name, grantee, privilege_type
              FROM information_schema.routine_privileges
