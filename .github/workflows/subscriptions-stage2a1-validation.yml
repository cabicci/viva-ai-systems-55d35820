          ) ON CONFLICT (user_id) DO UPDATE SET access_state='free_pending_verification';

          -- Lifecycle states on synthetic users (no-subscription / no-snapshot use random UUIDs)
          INSERT INTO billing.subscriptions (id, user_id, plan_version_id, access_state, billing_state, cancel_at_period_end, current_period_start, current_period_end, paid_activation_at, entitlement_active_at, scheduled_activation_at, market_code, currency_code, billing_interval, idempotency_key)
          VALUES
            ('dddddddd-dddd-dddd-dddd-ddddddddddd1', 'd0000000-0000-0000-0000-000000000001', '33333333-3333-3333-3333-333333333301', 'paid_scheduled', 'scheduled', false, now(), now() + interval '30 days', now() + interval '7 days', now() + interval '7 days', now() + interval '7 days', 'INTL', 'USD', 'month', 'fixture-paid-scheduled'),
            ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeeee1', 'e0000000-0000-0000-0000-000000000001', '33333333-3333-3333-3333-333333333301', 'past_due', 'past_due', false, now() - interval '30 days', now() - interval '1 day', now() - interval '30 days', now() - interval '30 days', NULL, 'INTL', 'USD', 'month', 'fixture-past-due'),
            ('ffffffff-ffff-ffff-ffff-fffffffffff1', 'f0000000-0000-0000-0000-000000000001', '33333333-3333-3333-3333-333333333301', 'expired', 'expired', false, now() - interval '60 days', now() - interval '30 days', now() - interval '60 days', now() - interval '60 days', NULL, 'INTL', 'USD', 'month', 'fixture-expired'),
            ('11111111-1111-1111-1111-111111111201', '10000000-0000-0000-0000-000000000001', '33333333-3333-3333-3333-333333333301', 'refunded', 'refunded', false, now() - interval '30 days', now() - interval '1 day', now() - interval '30 days', now() - interval '30 days', NULL, 'INTL', 'USD', 'month', 'fixture-refunded'),
            ('22222222-2222-2222-2222-222222222301', '20000000-0000-0000-0000-000000000001', '33333333-3333-3333-3333-333333333301', 'suspended', 'suspended', false, now() - interval '30 days', now() + interval '1 day', now() - interval '30 days', now() - interval '30 days', NULL, 'INTL', 'USD', 'month', 'fixture-suspended')
          ON CONFLICT (user_id) DO NOTHING;
          SQL

            # Assertion 12: Anonymous access denied
            ANON_CODE="$(curl -s -o /dev/null -w '%{http_code}' \
              -X GET "${SUPABASE_URL}/rest/v1/subscriptions?select=id&limit=1" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Accept-Profile: billing" \
              -H "Content-Profile: billing")"
            echo "anon_subscriptions_http=${ANON_CODE}" > "$ARTIFACT_DIR/anon-access.txt"
            [[ "$ANON_CODE" =~ ^(401|403)$ ]] \
              && record_assertion 12 "Anonymous access denied" "401/403" "$ANON_CODE" "PASS" "anon-access.txt" \
              || record_assertion 12 "Anonymous access denied" "401/403" "$ANON_CODE" "FAIL" "anon-access.txt"

            # Assertion 13: own-row reads
            OWN_ROWS="$(curl -s \
              -X GET "${SUPABASE_URL}/rest/v1/subscriptions?select=id&user_id=eq.${USER_A_ID}" \
              -H "Authorization: Bearer ${JWT_A}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Accept-Profile: billing" \
              -H "Content-Profile: billing" | jq 'length')"
            echo "user_a_own_rows=${OWN_ROWS}" > "$ARTIFACT_DIR/own-row-reads.txt"
            [[ "$OWN_ROWS" -ge 1 ]] \
              && record_assertion 13 "Authenticated safe own-row reads work" ">=1 own row" "$OWN_ROWS" "PASS" "own-row-reads.txt" \
              || record_assertion 13 "Authenticated safe own-row reads work" ">=1 own row" "$OWN_ROWS" "FAIL" "own-row-reads.txt"

            # Assertion 14: cross-user reads denied
            CROSS_ROWS="$(curl -s \
              -X GET "${SUPABASE_URL}/rest/v1/subscriptions?select=id&user_id=eq.${USER_B_ID}" \
              -H "Authorization: Bearer ${JWT_A}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Accept-Profile: billing" \
              -H "Content-Profile: billing" | jq 'length')"
            echo "user_a_reads_b_rows=${CROSS_ROWS}" >> "$ARTIFACT_DIR/own-row-reads.txt"
            [[ "$CROSS_ROWS" == "0" ]] \
