            }

            USER_A_ID="$(create_user "stage2a-user-a@example.test" "+15555550101" "$PASS_A" true true | jq -r '.id')"
            USER_B_ID="$(create_user "stage2a-user-b@example.test" "+15555550102" "$PASS_B" true true | jq -r '.id')"
            USER_UNVERIFIED_ID="$(create_user "stage2a-unverified@example.test" "+15555550103" "$PASS_UNVERIFIED" false false | jq -r '.id')"
            echo "fixture_users_created=3" > "$ARTIFACT_DIR/fixture-users.txt"

            JWT_A="$(sign_in "stage2a-user-a@example.test" "$PASS_A")"
            JWT_B="$(sign_in "stage2a-user-b@example.test" "$PASS_B")"
            JWT_UNVERIFIED="$(sign_in "stage2a-unverified@example.test" "$PASS_UNVERIFIED")"

            # Catalog + plan fixtures
            psql "$LOCAL_PG_URL" -v ON_ERROR_STOP=1 <<SQL > "$ARTIFACT_DIR/fixture-sql.log" 2>&1
          INSERT INTO billing.plan_catalog (id, plan_key, display_name, plan_family, is_active)
