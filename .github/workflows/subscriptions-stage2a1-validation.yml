            " > "$ARTIFACT_DIR/billing-routine-privileges.txt"
          fi

          # --- Test fixtures: users via GoTrue admin API ---
          PASS_A="" PASS_B="" PASS_UNVERIFIED="" USER_A_ID="" USER_B_ID="" USER_UNVERIFIED_ID=""
          JWT_A="" JWT_B="" JWT_UNVERIFIED=""
          if [[ "$BILLING_PROFILE_OK" == "yes" ]]; then
