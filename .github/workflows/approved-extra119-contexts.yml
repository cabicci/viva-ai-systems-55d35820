name: Approved119 finite extra source-free audio checks
'on':
  push:
    branches:
    - work/soil-approved-extra119-contexts-20261024-r1
    paths:
    - approved-extra119-contexts/request.json
permissions:
  contents: read
concurrency:
  group: approved-extra119-contexts-e53e6d5a6980d2f9113d82f52d4bd9416d8e614b1a9361d60e57e4c662369bf9
  cancel-in-progress: false
env:
  PACKAGE: approved-extra119-contexts
  REQUEST_SHA: e53e6d5a6980d2f9113d82f52d4bd9416d8e614b1a9361d60e57e4c662369bf9
  WORKER_SHA: 02b2edcf9173fcf3139d61636f789f6636d27255536eec77e4a331fbf90a531c
  FREEZE_SHA: f1d39744892a7121e0ade745d5b04d5933b7e06e4d0c2aaff8060f5f8aeb4650
  BRANCH_CREATED: ${{ github.event.created }}
  REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
  PYTHONUNBUFFERED: '1'
jobs:
  review:
    if: github.run_attempt == 1 && github.repository_id == '1272666418' && github.repository == 'cabicci/viva-ai-systems-55d35820'
      && github.ref == 'refs/heads/work/soil-approved-extra119-contexts-20261024-r1' && github.event.created == true && github.event.before
      == '0000000000000000000000000000000000000000' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Verify exact original sixsecond PCM and finitebudget
      id: validate
      run: 'cd "$PACKAGE"

        python worker.py validate

        '
    - name: Preserve exact context before onlyreview
      id: audio
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: approved-extra119-contexts-r1-inputs
        path: ${{ env.PACKAGE }}/inputs/
        if-no-files-found: error
        retention-days: 30
    - name: Record immutable context upload
      id: receipt
      env:
        AID: ${{ steps.audio.outputs.artifact-id }}
        DIGEST: ${{ steps.audio.outputs.artifact-digest }}
      run: 'cd "$PACKAGE"

        python worker.py uploaded --artifact-id "$AID" --artifact-digest "$DIGEST"

        '
    - name: One source-free extra review C072
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --clip C072

        '
    - name: Preserve exact diagnostic C072
