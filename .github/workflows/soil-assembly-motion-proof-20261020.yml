name: Soil owner requested true 3D assembly proof
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths: [experiments/course-pipeline/rebuild/assembly-motion-proof-20261020/request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: soil-assembly-proof-${{ github.sha }}
  cancel-in-progress: false
env:
  PACKAGE: experiments/course-pipeline/rebuild/assembly-motion-proof-20261020
jobs:
  plan:
    if: github.ref == 'refs/heads/work/soil-course-pipeline-20261013' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: plan
        run: |
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          p=Path(os.environ['PACKAGE'])
          d=json.loads((p/'request.json').read_text())
          assert d['scope']=='one14secondAssemblyProof'
          assert hashlib.sha256((p/'scene.py').read_bytes()).hexdigest()==d['sceneSHA256']
          assert d['mode'] in ['preview','animation']
          m=[{'name':'preview','args':'--stills'}] if d['mode']=='preview' else [
            {'name':f'part{i}','args':f'--start {i*70+1} --end {(i+1)*70}'} for i in range(6)]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('matrix='+json.dumps({'include':m})+'\n')
            f.write('mode='+d['mode']+'\n')
          PY
  render:
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned Blender Python runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxrender1 libxi6 libxfixes3 libxxf86vm1 libxkbcommon0 xvfb libgl1-mesa-dri
          python -m pip install bpy==4.5.3
      - name: Render actual meshes and procedural materials
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a python "$PACKAGE/scene.py" ${{ matrix.args }} --output "output/${{ matrix.name }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assembly-${{ matrix.name }}
          retention-days: 30
          path: output/
  compose:
    needs: [plan, render]
    if: needs.plan.outputs.mode == 'animation'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: assembly-part*
          path: downloaded
      - name: Verify frame coverage and assemble review video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python - <<'PY'
          from pathlib import Path
          import shutil,json,hashlib
          src=Path('downloaded');out=Path('final');out.mkdir()
          frames=Path('frames');frames.mkdir()
          receipts=[]
          for i in range(1,421):
            matches=list(src.rglob(f'frame-{i:04d}.png'))
            assert len(matches)==1,(i,len(matches))
            p=matches[0];shutil.copyfile(p,frames/p.name)
            receipts.append({'frame':i,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (out/'frame-receipts.json').write_text(json.dumps(receipts,indent=2))
          blends=list(src.rglob('assembly-proof.blend'))
          assert len(blends)==1
          shutil.copyfile(blends[0],out/'assembly-proof.blend')
          shutil.copyfile(frames/'frame-0001.png',out/'poster.png')
          for i in [61,121,166,226,286,346,420]:
            shutil.copyfile(frames/f'frame-{i:04d}.png',out/f'frame-{i:04d}.png')
          PY
          ffmpeg -v error -framerate 30 -start_number 1 -i frames/frame-%04d.png -frames:v 420 -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p -movflags +faststart final/assembly-proof.mp4
          ffprobe -v error -show_format -show_streams -of json final/assembly-proof.mp4 > final/ffprobe.json
          ffmpeg -v error -i final/assembly-proof.mp4 -f null -
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('final/ffprobe.json').read_text())
          v=next(s for s in d['streams'] if s['codec_type']=='video')
          assert v['width']==1920 and v['height']==1080
          assert v['nb_frames']=='420' and v['r_frame_rate']=='30/1'
          assert abs(float(d['format']['duration'])-14)<.02
          Path('final/verification.json').write_text(json.dumps({'completeFrames':420,'fps':30,'duration':14,'resolution':[1920,1080],'fullDecodePassed':True,'audio':'silent visual proof','ownerAccepted':False},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assembly-final-review
          retention-days: 30
          path: final/
