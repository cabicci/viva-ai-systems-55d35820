    - name: Preserve entire frozen input and finite diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s105-en004-joined-r1-complete-evidence
        retention-days: 30
