    - name: Preserve raw parsed or failed diagnostic02
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s105-en004-joined-r1-review-02
        retention-days: 30
        if-no-files-found: warn
        path: ${{ env.PACKAGE }}/output/S1-05-en004-junction-r1-02/
    - name: One blind actualaudio contextreview03
      id: review3
      if: always() && steps.validate.outcome == 'success' && steps.context3.outcome == 'success' && steps.receipt3.outcome
        == 'success'
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review --unit S1-05-en004-junction-r1-03

        '
    - name: Preserve raw parsed or failed diagnostic03
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s105-en004-joined-r1-review-03
