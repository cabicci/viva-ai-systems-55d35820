name: Clean reviewed merged branches

on:
  # One authorized batch-2 run from this exact reviewed main.
  # The fixed before-SHA prevents later edits from repeating this trigger.
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-reviewed-branches.yml]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cleanup-reviewed-branches.yml
      - scripts/maintenance/cleanup_merged_branches.py
      - scripts/maintenance/test_cleanup_merged_branches.py
      - docs/maintenance/branch-cleanup-2026-10-10-batch2.json
  workflow_dispatch:
    inputs:
      mode:
        description: Preview the reviewed branches or delete eligible branches
        required: true
        default: preview
        type: choice
        options:
          - preview
          - delete
      confirmation:
        description: For delete mode, type DELETE MERGED BRANCHES
        required: false
        type: string

permissions: {}

concurrency:
  group: reviewed-branch-cleanup
  cancel-in-progress: false

jobs:
  safety-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test branch leases, exact scope and squash-merge proofs offline
        run: python3 -m unittest discover -s scripts/maintenance -p 'test_cleanup_merged_branches.py' -v
  cleanup:
    if: >-
      github.repository == 'cabicci/viva-ai-systems-55d35820' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.event.before == 'e989902e4e70025d0d6c96b36b38d71ccc5e527e' &&
        startsWith(github.event.head_commit.message, 'chore: execute reviewed branch cleanup batch 2')))
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CLEANUP_MODE: ${{ github.event_name == 'push' && 'delete' || inputs.mode }}
      CONFIRMATION: ${{ github.event_name == 'push' && 'DELETE MERGED BRANCHES' || inputs.confirmation }}
    permissions:
      contents: write
      pull-requests: read
      actions: read
      deployments: read
    steps:
      - name: Validate requested mode
        run: |
          case "$CLEANUP_MODE" in preview|delete) ;; *) exit 1 ;; esac
          if [ "$CLEANUP_MODE" = delete ] && [ "$CONFIRMATION" != 'DELETE MERGED BRANCHES' ]; then
            echo 'Delete mode requires the exact confirmation phrase.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test safety guards offline
        run: python3 -m unittest discover -s scripts/maintenance -p 'test_cleanup_merged_branches.py' -v
      - name: Prepare exact recovery manifest and live preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintenance/cleanup_merged_branches.py plan --batch reviewed-112
      - name: Save preflight before any deletion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: branch-cleanup-preflight-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            docs/maintenance/branch-cleanup-2026-10-10-batch2.json
            branch-cleanup-output/plan.json
      - name: Delete with an atomic expected-SHA lease
        if: env.CLEANUP_MODE == 'delete'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintenance/cleanup_merged_branches.py apply --batch reviewed-112
      - name: Save final results, including partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: branch-cleanup-result-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: branch-cleanup-output/
