# Lesson-driven 400-visual production pipeline
#
# workflow_dispatch ONLY — never push/PR triggers.
# Does NOT auto-commit mappings, Gallery, main, or publish.
#
# DISPATCH ROUTING (fail-closed):
#   Masaarat Control Room → Lovable → this workflow_dispatch
#   Cursor / CLI / unauth API MUST fail dispatch-authority.
# See docs/lesson-visuals/v1/DISPATCH_AUTHORIZATION.md
#
# Production configuration (vars/secrets) must be present before matrix expansion.
# When LESSON_VISUALS_EXECUTION_MODE=production, the pipeline uses real HTTP provider transport.
# dry-run uses the offline mock provider transport (no network / no paid calls).
# Modes: pilot (authoritative 12-cell matrix) | full (400 cells) | failed-only (retry non-ACCEPTED).

name: lesson-driven-400-visual-pipeline

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable git SHA (must equal authoritative base + checked-out HEAD)
        required: true
        type: string
      control_room_authorization_id:
        description: Control Room authorization id (CR-…)
        required: true
        type: string
      approved_manifest_sha256:
        description: sha256 hex of AUTHORIZED_MANIFEST.json file bytes at source_sha
        required: true
        type: string
      approved_pilot_manifest_sha256:
        description: Required for mode=pilot — sha256 hex of AUTHORIZED_PILOT_12.json file bytes. Leave empty for full/failed-only.
        required: false
        type: string
        default: ""
      dispatch_actor:
        description: Must be an allowlisted Lovable actor (never cursor/cli)
        required: true
        type: string
      mode:
        description: pilot = authoritative 12-cell matrix; full = all 400 cells; failed-only = retry non-ACCEPTED receipts against the same matrix
        required: true
        type: choice
        options:
          - pilot
          - full
          - failed-only
        default: full
      max_parallel:
        description: Max parallel matrix jobs (bounded 1–50)
        required: true
        type: number
        default: 20
      prior_receipt_bundle_artifact:
        description: Required for failed-only — GitHub Actions artifact name containing authorized *.receipt.json files (immutable prior-run evidence). Leave empty for pilot/full mode.
        required: false
        type: string
        default: ""
      prior_receipt_bundle_run_id:
        description: Required for failed-only — source workflow run id that uploaded prior_receipt_bundle_artifact
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: lesson-driven-400-visual-${{ github.event.inputs.source_sha }}-${{ github.event.inputs.mode }}
  cancel-in-progress: false

jobs:
  dispatch-authority:
    name: Lovable-only dispatch authority (fail-closed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable source_sha
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}

      - name: Fail-closed Control Room + Lovable authorization
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.inputs.source_sha }}
          CONTROL_ROOM_AUTHORIZATION_ID: ${{ github.event.inputs.control_room_authorization_id }}
          APPROVED_MANIFEST_SHA256: ${{ github.event.inputs.approved_manifest_sha256 }}
          DISPATCH_ACTOR: ${{ github.event.inputs.dispatch_actor }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          LOVABLE_DISPATCH_ACTORS: ${{ vars.LOVABLE_DISPATCH_ACTORS || secrets.LOVABLE_DISPATCH_ACTORS }}
        run: |
          set -euo pipefail
          ALLOW_RAW="${LOVABLE_DISPATCH_ACTORS:-}"
          if [[ -z "${ALLOW_RAW// }" ]]; then
            echo "LOVABLE_DISPATCH_ACTORS allowlist is empty — fail closed"
            echo "Cursor/CLI/unauth API cannot dispatch. Only Lovable after Control Room auth."
            exit 1
          fi
          mapfile -t ALLOW < <(echo "$ALLOW_RAW" | tr '[,;]' ' ' | tr '[:upper:]' '[:lower:]' | xargs -n1)
          in_allow() {
            local needle
            needle="$(echo "$1" | tr '[:upper:]' '[:lower:]')"
            for a in "${ALLOW[@]}"; do
              [[ "$a" == "$needle" ]] && return 0
            done
            return 1
          }
          for banned in cursor cli cursor-agent github-ui unauthenticated api; do
            if [[ "$(echo "$DISPATCH_ACTOR" | tr '[:upper:]' '[:lower:]')" == "$banned" ]]; then
              echo "dispatch_actor='$DISPATCH_ACTOR' is banned"
              exit 1
            fi
            if [[ "$(echo "$GITHUB_ACTOR_NAME" | tr '[:upper:]' '[:lower:]')" == "$banned" ]]; then
              echo "github.actor='$GITHUB_ACTOR_NAME' is banned"
              exit 1
            fi
          done
          if ! in_allow "$DISPATCH_ACTOR"; then
            echo "dispatch_actor='$DISPATCH_ACTOR' not in LOVABLE_DISPATCH_ACTORS allowlist"
            exit 1
          fi
          if ! in_allow "$GITHUB_ACTOR_NAME"; then
            echo "github.actor='$GITHUB_ACTOR_NAME' not in LOVABLE_DISPATCH_ACTORS allowlist"
            exit 1
          fi
          if [[ -z "${CONTROL_ROOM_AUTHORIZATION_ID:-}" ]]; then
            echo "control_room_authorization_id missing"
            exit 1
          fi
          if [[ ! "$CONTROL_ROOM_AUTHORIZATION_ID" =~ ^CR-[A-Za-z0-9][A-Za-z0-9._-]{2,127}$ ]]; then
            echo "control_room_authorization_id must match CR-… format"
            exit 1
          fi
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_HEAD" != "$SOURCE_SHA" ]]; then
            echo "HEAD $ACTUAL_HEAD != source_sha $SOURCE_SHA"
            exit 1
          fi
          MANIFEST="docs/lesson-visuals/v1/AUTHORIZED_MANIFEST.json"
          test -f "$MANIFEST"
          ACTUAL_MANIFEST_SHA="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          EXPECTED_MANIFEST_SHA="$(echo "$APPROVED_MANIFEST_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [[ "$ACTUAL_MANIFEST_SHA" != "$EXPECTED_MANIFEST_SHA" ]]; then
            echo "AUTHORIZED_MANIFEST.json sha256 mismatch"
            echo "actual=$ACTUAL_MANIFEST_SHA approved=$EXPECTED_MANIFEST_SHA"
            exit 1
          fi
          echo "dispatch-authority PASSED (Lovable + Control Room)"

  preflight:
    name: Global production preflight (before matrix)
    needs: [dispatch-authority]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      run_id: ${{ steps.matrix.outputs.run_id }}
      manifest_sha256: ${{ steps.preflight.outputs.manifest_sha256 }}
      all_cell_ids_json: ${{ steps.preflight.outputs.all_cell_ids_json }}
      need_prior: ${{ steps.prior.outputs.need_prior }}
      prior_artifact_name: ${{ steps.prior.outputs.artifact_name }}
      prior_run_id: ${{ steps.prior.outputs.run_id }}
    steps:
      - name: Checkout immutable source_sha
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Bound max_parallel
        shell: bash
        run: |
          set -euo pipefail
          MP="${{ github.event.inputs.max_parallel }}"
          if ! [[ "$MP" =~ ^[0-9]+$ ]] || (( MP < 1 || MP > 50 )); then
            echo "max_parallel out of bounds [1,50]: $MP"
            exit 1
          fi

      - name: Resolve prior receipt bundle (failed-only)
        id: prior
        shell: bash
        env:
          MODE: ${{ github.event.inputs.mode }}
          PRIOR_ARTIFACT: ${{ github.event.inputs.prior_receipt_bundle_artifact }}
          PRIOR_RUN_ID: ${{ github.event.inputs.prior_receipt_bundle_run_id }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "failed-only" ]]; then
            if [[ -z "${PRIOR_ARTIFACT// }" || -z "${PRIOR_RUN_ID// }" ]]; then
              echo "failed-only requires prior_receipt_bundle_artifact and prior_receipt_bundle_run_id"
              exit 1
            fi
            if ! [[ "$PRIOR_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "prior_receipt_bundle_run_id must be numeric"
              exit 1
            fi
            echo "need_prior=true" >> "$GITHUB_OUTPUT"
            echo "artifact_name=$PRIOR_ARTIFACT" >> "$GITHUB_OUTPUT"
            echo "run_id=$PRIOR_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "need_prior=false" >> "$GITHUB_OUTPUT"
            echo "artifact_name=" >> "$GITHUB_OUTPUT"
            echo "run_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download authorized prior receipt bundle
        if: steps.prior.outputs.need_prior == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prior.outputs.artifact_name }}
          path: prior-receipt-bundle
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.prior.outputs.run_id }}

      - name: Run typed global preflight
        id: preflight
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.inputs.source_sha }}
          ACTUAL_SOURCE_SHA: ${{ github.event.inputs.source_sha }}
          CONTROL_ROOM_AUTHORIZATION_ID: ${{ github.event.inputs.control_room_authorization_id }}
          APPROVED_MANIFEST_SHA256: ${{ github.event.inputs.approved_manifest_sha256 }}
          APPROVED_PILOT_MANIFEST_SHA256: ${{ github.event.inputs.approved_pilot_manifest_sha256 }}
          DISPATCH_ACTOR: ${{ github.event.inputs.dispatch_actor }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          MODE: ${{ github.event.inputs.mode }}
          MAX_PARALLEL: ${{ github.event.inputs.max_parallel }}
          RUN_ID: lv-${{ github.event.inputs.source_sha }}-${{ github.run_id }}
          PRIOR_RECEIPT_BUNDLE_PATH: ${{ steps.prior.outputs.need_prior == 'true' && 'prior-receipt-bundle' || '' }}
          LOVABLE_DISPATCH_ACTORS: ${{ vars.LOVABLE_DISPATCH_ACTORS || secrets.LOVABLE_DISPATCH_ACTORS }}
          LESSON_VISUALS_EXECUTION_MODE: ${{ vars.LESSON_VISUALS_EXECUTION_MODE }}
          LESSON_VISUALS_PROVIDER_NAME: ${{ vars.LESSON_VISUALS_PROVIDER_NAME }}
          LESSON_VISUALS_PROVIDER_MODEL: ${{ vars.LESSON_VISUALS_PROVIDER_MODEL }}
          LESSON_VISUALS_PROVIDER_API_KEY: ${{ secrets.LESSON_VISUALS_PROVIDER_API_KEY }}
          LESSON_VISUALS_PROVIDER_ACCOUNT_ID: ${{ vars.LESSON_VISUALS_PROVIDER_ACCOUNT_ID }}
          LESSON_VISUALS_PROVIDER_PROJECT_ID: ${{ vars.LESSON_VISUALS_PROVIDER_PROJECT_ID }}
          LESSON_VISUALS_PROVIDER_ENDPOINT: ${{ vars.LESSON_VISUALS_PROVIDER_ENDPOINT }}
          LESSON_VISUALS_PROVIDER_TIMEOUT_MS: ${{ vars.LESSON_VISUALS_PROVIDER_TIMEOUT_MS }}
          LESSON_VISUALS_AI_AUTH_ID: ${{ secrets.LESSON_VISUALS_AI_AUTH_ID }}
          LESSON_VISUALS_STORAGE_CREDENTIAL: ${{ secrets.LESSON_VISUALS_STORAGE_CREDENTIAL }}
          LESSON_VISUALS_RUN_COST_CEILING_USD_MICROS: ${{ vars.LESSON_VISUALS_RUN_COST_CEILING_USD_MICROS }}
          LESSON_VISUALS_CELL_COST_CEILING_USD_MICROS: ${{ vars.LESSON_VISUALS_CELL_COST_CEILING_USD_MICROS }}
          LESSON_VISUALS_MAX_OUTPUT_BYTES: ${{ vars.LESSON_VISUALS_MAX_OUTPUT_BYTES }}
          LESSON_VISUALS_ALLOWED_MIME_TYPES: ${{ vars.LESSON_VISUALS_ALLOWED_MIME_TYPES }}
          LESSON_VISUALS_REQUIRED_WIDTH: ${{ vars.LESSON_VISUALS_REQUIRED_WIDTH }}
          LESSON_VISUALS_REQUIRED_HEIGHT: ${{ vars.LESSON_VISUALS_REQUIRED_HEIGHT }}
          LESSON_VISUALS_PROVIDER_ATTEMPT_QUOTA: ${{ vars.LESSON_VISUALS_PROVIDER_ATTEMPT_QUOTA }}
          LESSON_VISUALS_MAX_RETRIES: ${{ vars.LESSON_VISUALS_MAX_RETRIES }}
          LESSON_VISUALS_OUTPUT_STORAGE_TARGET: ${{ vars.LESSON_VISUALS_OUTPUT_STORAGE_TARGET }}
        run: |
          set -euo pipefail
          MANIFEST="docs/lesson-visuals/v1/AUTHORIZED_MANIFEST.json"
          ACTUAL_MANIFEST_SHA="$(sha256sum "$MANIFEST" | awk '{print $1}')"
          export ACTUAL_MANIFEST_SHA256="$ACTUAL_MANIFEST_SHA"
          bun run src/lib/lesson-visuals/v1/scripts/run_production_preflight.ts
          echo "manifest_sha256=$ACTUAL_MANIFEST_SHA" >> "$GITHUB_OUTPUT"
          test -f artifacts/qa/runtime-quota-context.json
          python3 - <<'PY'
          import json, pathlib, os
          m = json.loads(pathlib.Path("docs/lesson-visuals/v1/AUTHORIZED_MANIFEST.json").read_text(encoding="utf-8"))
          ids = [c["cellId"] for c in m["cells"]]
          pathlib.Path("all-cell-ids.json").write_text(json.dumps(ids), encoding="utf-8")
          print(f"all_cells={len(ids)}")
          PY
          echo "all_cell_ids_json<<EOF" >> "$GITHUB_OUTPUT"
          cat all-cell-ids.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload immutable runtime quota context
        uses: actions/upload-artifact@v4
        with:
          name: runtime-quota-context-${{ github.event.inputs.source_sha }}-${{ github.run_id }}
          path: artifacts/qa/runtime-quota-context.json
          if-no-files-found: error
          retention-days: 14

      - name: Build immutable 400-cell matrix
        id: matrix
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.inputs.source_sha }}
          MODE: ${{ github.event.inputs.mode }}
          APPROVED_PILOT_MANIFEST_SHA256: ${{ github.event.inputs.approved_pilot_manifest_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib

          mode = os.environ["MODE"]
          source_sha = os.environ["SOURCE_SHA"]
          full_path = pathlib.Path("docs/lesson-visuals/v1/AUTHORIZED_MANIFEST.json")
          full_bytes = full_path.read_bytes()
          full_sha = hashlib.sha256(full_bytes).hexdigest()
          m = json.loads(full_bytes.decode("utf-8"))
          assert m["manifestVersion"] == "lesson-visuals-authorized/v1"
          assert m["sourceSha"] == source_sha
          assert len(m["lessonIds"]) == 100
          assert len(m["cells"]) == 400
          assert m["locales"] == ["ar-EG", "ar-MSA", "ar-Gulf", "en"]

          if mode == "pilot":
              pilot_path = pathlib.Path("docs/lesson-visuals/v1/AUTHORIZED_PILOT_12.json")
              pilot_bytes = pilot_path.read_bytes()
              pilot_digest = hashlib.sha256(pilot_bytes).hexdigest()
              expected_pilot = (os.environ.get("APPROVED_PILOT_MANIFEST_SHA256") or "").strip().lower()
              if not expected_pilot:
                  raise SystemExit("APPROVED_PILOT_MANIFEST_SHA256 required for mode=pilot")
              if pilot_digest != expected_pilot:
                  raise SystemExit(
                      f"AUTHORIZED_PILOT_12.json sha256 mismatch actual={pilot_digest} approved={expected_pilot}"
                  )
              p = json.loads(pilot_bytes.decode("utf-8"))
              assert p["pilotCount"] == 12
              assert len(p["cells"]) == 12
              assert p["fullManifestSha256"] == full_sha
              assert p["sourceSha"] == source_sha
              cells = p["cells"]
              if len(cells) == 400:
                  raise SystemExit("pilot mode must not expand to 400 cells")
              if len(cells) != 12:
                  raise SystemExit(f"pilot matrix must be exactly 12 cells, got {len(cells)}")
          else:
              cells = m["cells"]
              assert len(cells) == 400

          out = [{"cellId": c["cellId"], "lessonId": c["lessonId"], "locale": c["locale"], "method": c["method"]} for c in cells]
          if mode == "pilot" and len(out) != 12:
              raise SystemExit(f"pilot mode refused expanded matrix size={len(out)}")
          if mode == "pilot" and len(out) == 400:
              raise SystemExit("pilot mode must not expand to 400 cells")
          pathlib.Path("matrix.json").write_text(json.dumps(out), encoding="utf-8")
          print(f"matrix_cells={len(out)}")
          PY
          {
            echo "matrix<<EOF"
            cat matrix.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "run_id=lv-${{ github.event.inputs.source_sha }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

  cells:
    name: Cell ${{ matrix.cell.cellId }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(github.event.inputs.max_parallel) }}
      matrix:
        cell: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Checkout immutable source_sha
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Download runtime quota context
        uses: actions/download-artifact@v4
        with:
          name: runtime-quota-context-${{ github.event.inputs.source_sha }}-${{ github.run_id }}
          path: artifacts/qa

      - name: Download authorized prior receipt bundle
        if: needs.preflight.outputs.need_prior == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.prior_artifact_name }}
          path: prior-receipt-bundle
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.prior_run_id }}

      - name: Run production cell adapter contract
        id: cellrun
        shell: bash
        env:
          CELL_ID: ${{ matrix.cell.cellId }}
          LESSON_ID: ${{ matrix.cell.lessonId }}
          LOCALE: ${{ matrix.cell.locale }}
          METHOD: ${{ matrix.cell.method }}
          SOURCE_SHA: ${{ github.event.inputs.source_sha }}
          APPROVED_MANIFEST_SHA256: ${{ github.event.inputs.approved_manifest_sha256 }}
          APPROVED_PILOT_MANIFEST_SHA256: ${{ github.event.inputs.approved_pilot_manifest_sha256 }}
          CONTROL_ROOM_AUTHORIZATION_ID: ${{ github.event.inputs.control_room_authorization_id }}
          MODE: ${{ github.event.inputs.mode }}
          RUN_ID: ${{ needs.preflight.outputs.run_id }}
          ATTEMPT_NUMBER: "1"
          QUOTA_CONTEXT_PATH: artifacts/qa/runtime-quota-context.json
          PRIOR_RECEIPT_BUNDLE_PATH: ${{ needs.preflight.outputs.need_prior == 'true' && 'prior-receipt-bundle' || '' }}
          ALL_CELL_IDS_JSON: ${{ needs.preflight.outputs.all_cell_ids_json }}
          LOVABLE_DISPATCH_ACTORS: ${{ vars.LOVABLE_DISPATCH_ACTORS || secrets.LOVABLE_DISPATCH_ACTORS }}
          LESSON_VISUALS_EXECUTION_MODE: ${{ vars.LESSON_VISUALS_EXECUTION_MODE }}
          LESSON_VISUALS_PROVIDER_NAME: ${{ vars.LESSON_VISUALS_PROVIDER_NAME }}
          LESSON_VISUALS_PROVIDER_MODEL: ${{ vars.LESSON_VISUALS_PROVIDER_MODEL }}
          LESSON_VISUALS_PROVIDER_API_KEY: ${{ secrets.LESSON_VISUALS_PROVIDER_API_KEY }}
          LESSON_VISUALS_PROVIDER_ACCOUNT_ID: ${{ vars.LESSON_VISUALS_PROVIDER_ACCOUNT_ID }}
          LESSON_VISUALS_PROVIDER_PROJECT_ID: ${{ vars.LESSON_VISUALS_PROVIDER_PROJECT_ID }}
          LESSON_VISUALS_PROVIDER_ENDPOINT: ${{ vars.LESSON_VISUALS_PROVIDER_ENDPOINT }}
          LESSON_VISUALS_PROVIDER_TIMEOUT_MS: ${{ vars.LESSON_VISUALS_PROVIDER_TIMEOUT_MS }}
          LESSON_VISUALS_AI_AUTH_ID: ${{ secrets.LESSON_VISUALS_AI_AUTH_ID }}
          LESSON_VISUALS_STORAGE_CREDENTIAL: ${{ secrets.LESSON_VISUALS_STORAGE_CREDENTIAL }}
          LESSON_VISUALS_RUN_COST_CEILING_USD_MICROS: ${{ vars.LESSON_VISUALS_RUN_COST_CEILING_USD_MICROS }}
          LESSON_VISUALS_CELL_COST_CEILING_USD_MICROS: ${{ vars.LESSON_VISUALS_CELL_COST_CEILING_USD_MICROS }}
          LESSON_VISUALS_MAX_OUTPUT_BYTES: ${{ vars.LESSON_VISUALS_MAX_OUTPUT_BYTES }}
          LESSON_VISUALS_ALLOWED_MIME_TYPES: ${{ vars.LESSON_VISUALS_ALLOWED_MIME_TYPES }}
          LESSON_VISUALS_REQUIRED_WIDTH: ${{ vars.LESSON_VISUALS_REQUIRED_WIDTH }}
          LESSON_VISUALS_REQUIRED_HEIGHT: ${{ vars.LESSON_VISUALS_REQUIRED_HEIGHT }}
          LESSON_VISUALS_PROVIDER_ATTEMPT_QUOTA: ${{ vars.LESSON_VISUALS_PROVIDER_ATTEMPT_QUOTA }}
          LESSON_VISUALS_MAX_RETRIES: ${{ vars.LESSON_VISUALS_MAX_RETRIES }}
          LESSON_VISUALS_OUTPUT_STORAGE_TARGET: ${{ vars.LESSON_VISUALS_OUTPUT_STORAGE_TARGET }}
        run: |
          set -euo pipefail
          test -f artifacts/qa/runtime-quota-context.json
          set +e
          OUT="$(bun run src/lib/lesson-visuals/v1/scripts/run_production_cell.ts)"
          CODE=$?
          set -e
          echo "$OUT"
          STATUS="$(echo "$OUT" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$CODE"

      - name: Verify required cell artifacts
        if: always()
        shell: bash
        env:
          CELL_ID: ${{ matrix.cell.cellId }}
          CELL_STATUS: ${{ steps.cellrun.outputs.status }}
        run: |
          set -euo pipefail
          bun run src/lib/lesson-visuals/v1/scripts/verify_cell_artifacts.ts

      - name: Upload cell artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.cell.cellId }}
          path: |
            artifacts/cells/${{ matrix.cell.cellId }}/
            artifacts/receipts/${{ matrix.cell.cellId }}.receipt.json
            artifacts/mappings/${{ matrix.cell.cellId }}.mapping.json
            artifacts/rights/${{ matrix.cell.cellId }}.rights.json
            artifacts/validations/${{ matrix.cell.cellId }}.validation.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Aggregate validation + integrity
    needs: [preflight, cells]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable source_sha
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Download all cell artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: cell-*
          merge-multiple: false

      - name: Download runtime quota context
        uses: actions/download-artifact@v4
        with:
          name: runtime-quota-context-${{ github.event.inputs.source_sha }}-${{ github.run_id }}
          path: artifacts/qa

      - name: Build aggregate validation (fail-closed)
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.inputs.source_sha }}
          APPROVED_MANIFEST_SHA256: ${{ github.event.inputs.approved_manifest_sha256 }}
          APPROVED_PILOT_MANIFEST_SHA256: ${{ github.event.inputs.approved_pilot_manifest_sha256 }}
          MODE: ${{ github.event.inputs.mode }}
          RUN_ID: ${{ needs.preflight.outputs.run_id }}
          QUOTA_CONTEXT_PATH: artifacts/qa/runtime-quota-context.json
          LESSON_VISUALS_EXECUTION_MODE: ${{ vars.LESSON_VISUALS_EXECUTION_MODE }}
          LESSON_VISUALS_RUN_COST_CEILING_USD_MICROS: ${{ vars.LESSON_VISUALS_RUN_COST_CEILING_USD_MICROS }}
          LESSON_VISUALS_PROVIDER_ATTEMPT_QUOTA: ${{ vars.LESSON_VISUALS_PROVIDER_ATTEMPT_QUOTA }}
        run: |
          set -euo pipefail
          test -d collected
          test -f artifacts/qa/runtime-quota-context.json
          bun run src/lib/lesson-visuals/v1/scripts/run_production_aggregate.ts
          test -f artifacts/qa/aggregate-validation.json
          test -f artifacts/qa/aggregate-validation.json.sha256
          test -f artifacts/qa/run-summary.json
          test -f artifacts/qa/runtime-quota-context.json

      - name: Upload QA aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-visuals-qa-${{ github.event.inputs.source_sha }}
          path: |
            artifacts/qa/
