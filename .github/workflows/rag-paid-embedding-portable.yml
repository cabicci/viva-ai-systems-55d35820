name: RAG Paid Portable Embedding (Branch Only)

on:
  workflow_dispatch:
    inputs:
      confirm_paid_embedding:
        description: "Type APPROVE_PAID_RAG_PORTABLE_EMBEDDING to authorize one paid run"
        required: true
        type: string
      candidate_sha:
        description: Immutable RAG candidate SHA
        required: true
        default: "8e48d655489fcdfad4df8e33b3c93c61bbde3468"
  push:
    branches:
      - work/rag-portable-batch-import

permissions:
  contents: read

concurrency:
  group: rag-paid-portable-embedding
  cancel-in-progress: false

jobs:
  paid-portable-embedding:
    if: >
      (github.event_name == 'workflow_dispatch' &&
       inputs.confirm_paid_embedding == 'APPROVE_PAID_RAG_PORTABLE_EMBEDDING' &&
       inputs.candidate_sha == '8e48d655489fcdfad4df8e33b3c93c61bbde3468') ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, 'APPROVE_PAID_RAG_PORTABLE_EMBEDDING'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: "8e48d655489fcdfad4df8e33b3c93c61bbde3468"
      DOCKER_BIN: docker
      MAX_APPROVED_COST_USD: "1"
    steps:
      - name: Checkout portable-batch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable candidate present
        run: |
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" HEAD

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Verify Docker daemon
        run: docker info

      - name: Start disposable Supabase/Postgres
        env:
          SUPABASE_CMD: supabase
        run: bash .github/rag-paid-embedding/start-supabase.sh

      - name: Run preflight + paid embedding + portable export
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEW_OPENAI: ${{ secrets.new_openai }}
          SUPABASE_CMD: supabase
        run: bash .github/rag-paid-embedding/run-paid-embedding.sh

      - name: Confirm portable artifact contract
        if: always()
        run: |
          test -f artifacts/rag/portable-export/artifact-manifest.json
          bun -e "
          import { verifyPortableArtifact } from './src/lib/rag/portable-artifact.ts';
          const r = verifyPortableArtifact('artifacts/rag/portable-export');
          if (!r.ok || r.recordCount !== 2692) { console.error(r); process.exit(1); }
          console.log('portable artifact ok', r.recordCount);
          "

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Upload portable embedding artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-portable-embedding-8e48d65
          path: |
            artifacts/rag/portable-export/
            artifacts/rag/paid-embedding/summary.json
            artifacts/rag/paid-embedding/preflight.json
            artifacts/rag/paid-embedding/execution.log
          retention-days: 30
