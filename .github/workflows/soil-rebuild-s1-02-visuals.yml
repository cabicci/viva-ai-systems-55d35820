name: Soil rebuild S1-02 bounded draft visuals
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths: [experiments/course-pipeline/rebuild/s102-visuals/request.json]
  workflow_dispatch:
    inputs:
      request_sha256:
        description: Exact SHA-256 of the reviewed S1-02 request.json
        type: string
        required: true
permissions:
  actions: read
  contents: read
concurrency:
  group: soil-rebuild-s102-visuals-${{ github.ref }}
  cancel-in-progress: false
jobs:
  images:
    if: github.ref == 'refs/heads/work/soil-course-pipeline-20261013'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      PACKAGE: experiments/course-pipeline/rebuild/s102-visuals
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify the exact bounded S1-02 visual request
        env:
          REQUEST_SHA: ${{ inputs.request_sha256 }}
        run: |
          if [ -n "$REQUEST_SHA" ]; then
            python "$PACKAGE/produce.py" validate --request-sha "$REQUEST_SHA"
          else
            python "$PACKAGE/produce.py" validate
          fi
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: experiments/course-pipeline/rebuild/s102-visuals/output
          key: soil-rebuild-s102-images-${{ hashFiles('experiments/course-pipeline/rebuild/s102-visuals/request.json') }}-${{ github.run_id }}
          restore-keys: |
            soil-rebuild-s102-images-${{ hashFiles('experiments/course-pipeline/rebuild/s102-visuals/request.json') }}-
            soil-rebuild-s102-images-fa9dd442a48bcc5c3caa132e8752643fdab5905a311da69f395128d4fe355146-
      - name: Restore checked outputs from the exact prior run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$PACKAGE/output"
          gh run download 38827990678 --repo cabicci/viva-ai-systems-55d35820 \
            --name s102-draft-image-outputs --dir "$PACKAGE/output"
      - name: Run the bounded S1-02 visual request
        env:
          REQUEST_SHA: ${{ inputs.request_sha256 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          if [ -n "$REQUEST_SHA" ]; then
            python "$PACKAGE/produce.py" produce --request-sha "$REQUEST_SHA"
          else
            python "$PACKAGE/produce.py" produce
          fi
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always()
        with:
          path: experiments/course-pipeline/rebuild/s102-visuals/output
          key: soil-rebuild-s102-images-${{ hashFiles('experiments/course-pipeline/rebuild/s102-visuals/request.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s102-draft-image-outputs
          retention-days: 30
          path: experiments/course-pipeline/rebuild/s102-visuals/output/
