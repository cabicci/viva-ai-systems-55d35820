name: S106 two precise English sentence repairs
'on':
  push:
    branches:
    - work/soil-s106-en-two-sentence-repair-20261023-r1
    paths:
    - s106-en-two-repair/request.json
permissions:
  contents: read
concurrency:
  group: s106-en-two-repair-r1-aedffa4f5086e9564c2d99627b54fe3e99c018e47d81cb036d90e4d3b862ae82
  cancel-in-progress: false
env:
  PACKAGE: s106-en-two-repair
  REQUEST_SHA: aedffa4f5086e9564c2d99627b54fe3e99c018e47d81cb036d90e4d3b862ae82
  WORKER_SHA: c9dc844696293532a2aba88446ee9f3e2a78a1105f72886ebfd38bf49cdb6d08
  FREEZE_SHA: 387e5acdba202316cc21b865d8a605979b450304f3a1fdd5a7f7ae5bd6e10a80
  BRANCH_CREATED: ${{ github.event.created }}
  REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
jobs:
  narrate_en:
    if: github.run_attempt == 1 && github.repository_id == '1272666418' && github.repository
      == 'cabicci/viva-ai-systems-55d35820' && github.ref == 'refs/heads/work/soil-s106-en-two-sentence-repair-20261023-r1'
      && github.event.created == true && github.event.before == '0000000000000000000000000000000000000000'
      && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      LOCALE_LANE: en
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Validate exact fourlocale sourcebindings identity cache and budget
      id: validate
      run: 'cd "$PACKAGE"

        python worker.py validate

        '
    - name: Finite exactpreferred model availability2GET nofallback
      id: preflight
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py preflight

        '
    - name: Install hashverified multilingualWhisper before anyTTS
      id: runtime
      run: 'cd "$PACKAGE"

        python -m pip download --no-deps --dest wheels faster-whisper==1.2.1

        python worker.py verify-wheel

        python -m pip install --disable-pip-version-check --report output/pip-install-report.json
        wheels/faster_whisper-1.2.1-*.whl

        python worker.py prepare-asr-runtime

        '
    - name: One coherent TTS S1-06-en-P01-sentence-repair-r1
      id: tts_01
      if: always() && steps.validate.outcome == 'success' && steps.preflight.outcome
        == 'success' && steps.runtime.outcome == 'success'
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py produce --unit S1-06-en-P01-sentence-repair-r1

        '
    - name: Upload full immutable audio once S1-06-en-P01-sentence-repair-r1
      id: upload_01
      if: always() && steps.tts_01.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s106-en-two-repair-r1-S1-06-en-P01-sentence-repair-r1-audio
        path: ${{ env.PACKAGE }}/output/S1-06-en-P01-sentence-repair-r1/
        retention-days: 30
        if-no-files-found: error
    - name: Record immutable audio upload S1-06-en-P01-sentence-repair-r1
      id: receipt_01
      if: always() && steps.upload_01.outcome == 'success'
      continue-on-error: true
      env:
        AID: ${{ steps.upload_01.outputs.artifact-id }}
        DIGEST: ${{ steps.upload_01.outputs.artifact-digest }}
      run: 'cd "$PACKAGE"

        python worker.py uploaded --unit S1-06-en-P01-sentence-repair-r1 --artifact-id
        "$AID" --artifact-digest "$DIGEST"

        '
    - name: One coherent TTS S1-06-en-P03-sentence-repair-r1
      id: tts_02
      if: always() && steps.validate.outcome == 'success' && steps.preflight.outcome
        == 'success' && steps.runtime.outcome == 'success'
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py produce --unit S1-06-en-P03-sentence-repair-r1

        '
    - name: Upload full immutable audio once S1-06-en-P03-sentence-repair-r1
      id: upload_02
      if: always() && steps.tts_02.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
