        path: ${{ env.PACKAGE }}/output/S1-06-en-P03-sentence-repair-r1/
        retention-days: 30
        if-no-files-found: error
    - name: Record immutable audio upload S1-06-en-P03-sentence-repair-r1
      id: receipt_02
      if: always() && steps.upload_02.outcome == 'success'
      continue-on-error: true
      env:
        AID: ${{ steps.upload_02.outputs.artifact-id }}
        DIGEST: ${{ steps.upload_02.outputs.artifact-digest }}
      run: 'cd "$PACKAGE"

        python worker.py uploaded --unit S1-06-en-P03-sentence-repair-r1 --artifact-id
        "$AID" --artifact-digest "$DIGEST"

        '
    - name: blind-review S1-06-en-P01-sentence-repair-r1
      if: always() && steps.tts_01.outcome == 'success' && steps.upload_01.outcome
        == 'success' && steps.receipt_01.outcome == 'success'
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py blind-review --unit S1-06-en-P01-sentence-repair-r1

        '
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    - name: asr S1-06-en-P01-sentence-repair-r1
      if: always() && steps.tts_01.outcome == 'success' && steps.upload_01.outcome
        == 'success' && steps.receipt_01.outcome == 'success'
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py asr --unit S1-06-en-P01-sentence-repair-r1

        '
    - name: compare S1-06-en-P01-sentence-repair-r1
      if: always() && steps.tts_01.outcome == 'success' && steps.upload_01.outcome
        == 'success' && steps.receipt_01.outcome == 'success'
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py compare --unit S1-06-en-P01-sentence-repair-r1

        '
    - name: Stage thin diagnostics S1-06-en-P01-sentence-repair-r1
      id: stage_01
      if: always()
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py stage-diagnostics --unit S1-06-en-P01-sentence-repair-r1

        '
    - name: Preserve thin diagnostics S1-06-en-P01-sentence-repair-r1
      if: always() && steps.stage_01.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s106-en-two-repair-r1-S1-06-en-P01-sentence-repair-r1-review
        path: ${{ env.PACKAGE }}/diagnostics-output/S1-06-en-P01-sentence-repair-r1/
        retention-days: 30
        if-no-files-found: error
    - name: blind-review S1-06-en-P03-sentence-repair-r1
      if: always() && steps.tts_02.outcome == 'success' && steps.upload_02.outcome
        == 'success' && steps.receipt_02.outcome == 'success'
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py blind-review --unit S1-06-en-P03-sentence-repair-r1

        '
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    - name: asr S1-06-en-P03-sentence-repair-r1
      if: always() && steps.tts_02.outcome == 'success' && steps.upload_02.outcome
        == 'success' && steps.receipt_02.outcome == 'success'
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py asr --unit S1-06-en-P03-sentence-repair-r1

        '
    - name: compare S1-06-en-P03-sentence-repair-r1
      if: always() && steps.tts_02.outcome == 'success' && steps.upload_02.outcome
        == 'success' && steps.receipt_02.outcome == 'success'
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py compare --unit S1-06-en-P03-sentence-repair-r1

        '
    - name: Stage thin diagnostics S1-06-en-P03-sentence-repair-r1
      id: stage_02
      if: always()
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py stage-diagnostics --unit S1-06-en-P03-sentence-repair-r1

        '
    - name: Preserve thin diagnostics S1-06-en-P03-sentence-repair-r1
      if: always() && steps.stage_02.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s106-en-two-repair-r1-S1-06-en-P03-sentence-repair-r1-review
        path: ${{ env.PACKAGE }}/diagnostics-output/S1-06-en-P03-sentence-repair-r1/
        retention-days: 30
        if-no-files-found: error
    - name: Lane summary preserves partial failures
      if: always()
      run: 'cd "$PACKAGE"

        python worker.py summarize

        '
    - name: Stage thin complete evidence
      id: stagecomplete
      if: always()
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py stage-complete

        '
    - name: Preserve exact lane evidence
      if: always() && steps.stagecomplete.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s106-en-two-repair-r1-en-complete-evidence
        retention-days: 30
        if-no-files-found: error
        include-hidden-files: true
        path: '${{ env.PACKAGE }}/complete-output/

          ${{ env.PACKAGE }}/.gitignore

          ${{ env.PACKAGE }}/README.en.txt

          ${{ env.PACKAGE }}/freeze_package.py

          ${{ env.PACKAGE }}/offline_check.py

          ${{ env.PACKAGE }}/owner-authority.json

          ${{ env.PACKAGE }}/cumulative-attempt-ledger.json

          ${{ env.PACKAGE }}/cache-live-audit.json

          ${{ env.PACKAGE }}/expected-criteria.NOT-FOR-MODEL.json

          ${{ env.PACKAGE }}/provenance/worker-derivation.json

          ${{ env.PACKAGE }}/request.json

