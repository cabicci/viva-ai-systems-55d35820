        if-no-files-found: error
        retention-days: 30
      id: originals
    - name: Verify both exact preferred models without fallback
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py preflight

        '
      id: preflight
    - name: Install hash-verified Whisper before any generation
      run: 'cd "$PACKAGE"

        python -m pip download --no-deps --dest wheels faster-whisper==1.2.1

        python worker.py verify-wheel

        python -m pip install --disable-pip-version-check --report output/pip-install-report.json wheels/faster_whisper-1.2.1-*.whl

        python worker.py prepare-asr-runtime

        '
      id: runtime
    - name: One TTS candidate S2-15-ar-EG-repair-r1-001
      id: tts1
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py produce --unit S2-15-ar-EG-repair-r1-001

        '
      if: always() && steps.validate.outcome == 'success' && steps.originals.outcome == 'success' && steps.preflight.outcome
        == 'success' && steps.runtime.outcome == 'success'
      continue-on-error: true
    - name: Upload completed candidate before diagnostics S2-15-ar-EG-repair-r1-001
