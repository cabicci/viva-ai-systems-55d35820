      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s215-correction-r1-originals-and-analysis
        path: '${{ env.PACKAGE }}/originals/

          ${{ env.PACKAGE }}/output/original-analysis.json

