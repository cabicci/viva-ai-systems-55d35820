    - name: Record exact upload S2-15-ar-EG-repair-r1-001
      env:
        AUDIO_ARTIFACT_ID: ${{ steps.upload1.outputs.artifact-id }}
        AUDIO_ARTIFACT_DIGEST: ${{ steps.upload1.outputs.artifact-digest }}
      run: 'cd "$PACKAGE"

        python worker.py uploaded --unit S2-15-ar-EG-repair-r1-001 --artifact-id "$AUDIO_ARTIFACT_ID" --artifact-digest "$AUDIO_ARTIFACT_DIGEST"

