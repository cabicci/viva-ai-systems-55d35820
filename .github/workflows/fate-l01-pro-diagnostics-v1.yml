name: Fate L01 Pro targeted actual-audio adjudication
on:
  push:
    branches: [work/fate-l01-full-pilot-20261020]
    paths: [experiments/course-pipeline/rebuild/fate-l01-full-pilot-20261020/pro-diagnostics-v1/request.json]
permissions:
  contents: read
  actions: read
env:
  PACKAGE: experiments/course-pipeline/rebuild/fate-l01-full-pilot-20261020/pro-diagnostics-v1
  EXPECTED_REQUEST_SHA256: 6677a924e003e04b1e47bae3f9b1fb2123451bef798a6c632b65236e81fb0675
jobs:
  inspect:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: [S02, S06, S08, join1, join4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve specific disputed audio observation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python "$PACKAGE/adjudicate.py" "${{ matrix.part }}"
      - name: Deliver each review immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-l01-pro-diagnostic-v1-${{ matrix.part }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
