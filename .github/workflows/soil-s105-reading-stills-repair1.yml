name: Soil S1-05 two targeted reading repairs1
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths:
      - .github/workflows/soil-s105-reading-stills-repair1.yml
      - experiments/course-pipeline/rebuild/s105-reading-stills-repair1/request.json
  workflow_dispatch:
    inputs:
      request_sha256:
        description: Exact bounded one-sprite request SHA-256
        type: string
        required: true
permissions:
  actions: read
  contents: read
concurrency:
  group: soil-s105-reading-stills-repair1
  cancel-in-progress: false
jobs:
  proof:
    if: github.ref == 'refs/heads/work/soil-course-pipeline-20261013' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PACKAGE: experiments/course-pipeline/rebuild/s105-reading-stills-repair1
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Validate bounded request
        env:
          REQUEST_SHA: ${{ inputs.request_sha256 || 'c441c8e91a7c41c1598ef584b24eb074d64f6fda3dea0757451eea223fe54b9c' }}
        run: python "$PACKAGE/produce.py" validate --request-sha "$REQUEST_SHA"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: experiments/course-pipeline/rebuild/s105-reading-stills-repair1/output
          key: s105-stills-repair1-c441c8e91a7c41c1598ef584b24eb074d64f6fda3dea0757451eea223fe54b9c
      - name: Retrieve accepted image reference without committing artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38884076949 --repo cabicci/viva-ai-systems-55d35820 --name s105-reading-stills-initial --dir _motion_reference
      - name: Repair only two failed stills and inspect their contracts
        env:
          REQUEST_SHA: ${{ inputs.request_sha256 || 'c441c8e91a7c41c1598ef584b24eb074d64f6fda3dea0757451eea223fe54b9c' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: python "$PACKAGE/produce.py" produce --request-sha "$REQUEST_SHA" --reference-dir _motion_reference
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always()
        with:
          path: experiments/course-pipeline/rebuild/s105-reading-stills-repair1/output
          key: s105-stills-repair1-c441c8e91a7c41c1598ef584b24eb074d64f6fda3dea0757451eea223fe54b9c
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: s105-reading-stills-repair1
          retention-days: 30
          path: experiments/course-pipeline/rebuild/s105-reading-stills-repair1/output/
