name: Fate of Pesticides Egyptian Gemini two-voice proof
on:
  push:
    branches: [work/fate-l01-audio-proof-v2-20261020]
    paths: [experiments/course-pipeline/rebuild/fate-l01-audio-proof-v2-20261020/request.json]
permissions:
  contents: read
concurrency:
  group: fate-l01-egyptian-voice-proof-v2-20261020
  cancel-in-progress: false
jobs:
  proof:
    if: github.ref == 'refs/heads/work/fate-l01-audio-proof-v2-20261020' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PACKAGE: experiments/course-pipeline/rebuild/fate-l01-audio-proof-v2-20261020
      EXPECTED_REQUEST_SHA256: 6b1cc59ca8f5331dd2809dd4094691d3de9853ee2006dca53e0e63d8a007bda0
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Generate only two separate Gemini samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python "$PACKAGE/voice-proof.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fate-l01-egyptian-two-voice-proof-v2
          retention-days: 30
          path: ${{ env.PACKAGE }}/output/
