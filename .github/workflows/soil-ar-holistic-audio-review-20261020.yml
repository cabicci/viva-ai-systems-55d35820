name: Soil holistic A B actual-audio diagnostic
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths: [experiments/course-pipeline/rebuild/ar-holistic-audio-review-20261020/request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: soil-holistic-audio-d0eb1b7601466a739e825d11da96789a059e2067fdb88bec714d2df494f49805
  cancel-in-progress: false
env:
  PACKAGE: experiments/course-pipeline/rebuild/ar-holistic-audio-review-20261020
  REQUEST_SHA: d0eb1b7601466a739e825d11da96789a059e2067fdb88bec714d2df494f49805
  SCRIPT_SHA: edee6fa65bc01b6decd6994301202aa28018eda3f069a9d373d878112d85a5e1
  PYTHONUNBUFFERED: '1'
jobs:
  audit:
    if: github.ref == 'refs/heads/work/soil-course-pipeline-20261013' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate exact request and download only existing A B audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$PACKAGE/audit.py" prepare
      - name: One actual-audio understanding call per clip, no speech generation or retries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: python "$PACKAGE/audit.py" audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soil-ar-holistic-audio-audit
          retention-days: 30
          path: experiments/course-pipeline/rebuild/ar-holistic-audio-review-20261020/output/
