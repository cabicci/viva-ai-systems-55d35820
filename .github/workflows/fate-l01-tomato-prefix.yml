name: Fate L01 one tomato pronunciation repair
on:
  push:
    branches: [work/fate-l01-full-pilot-20261020]
    paths: [experiments/course-pipeline/rebuild/fate-l01-full-pilot-20261020/tomato-prefix-v1/request.json]
permissions:
  contents: read
jobs:
  speech:
    if: github.ref == 'refs/heads/work/fate-l01-full-pilot-20261020' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      PACKAGE: experiments/course-pipeline/rebuild/fate-l01-full-pilot-20261020/tomato-prefix-v1
      EXPECTED_REQUEST_SHA256: 9fe49878b27e6d66e85b2ee0d3a093826a2933f3e739e91de1fa9c8ae0a8099b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate one corrected sentence for listening
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python "$PACKAGE/worker.py"
      - name: Deliver this completed sentence immediately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fate-l01-tomato-prefix-v1
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
