name: Fate L06 actual-audio adjudication and timing v1
on:
  push:
    branches: [work/masaarat/0c0df2131ade371ac908def0]
    paths: [experiments/course-pipeline/rebuild/fate-L02-L07-bilingual-v1/analysis-L06/request.json]
permissions:
  contents: read
  actions: read
env:
  PACKAGE: experiments/course-pipeline/rebuild/fate-L02-L07-bilingual-v1/analysis-L06
  EXPECTED_REQUEST_SHA256: cf8728a0f33cd337360cb3f5bcfe61c71ad7c2dde5a8913823e1782679b2f3e0
jobs:
  analyze:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: ["L06-S01-ar-v1", "L06-S02-ar-v1", "L06-S03-ar-v1", "L06-S04-ar-v1", "L06-S05-ar-v1", "L06-S06-ar-v1", "L06-S07-ar-v1", "L06-S01-en-v1", "L06-S02-en-v1", "L06-S03-en-v1", "L06-S04-en-v1", "L06-S05-en-v1", "L06-S06-en-v1", "L06-S07-en-v1"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve actual alerts and derive acoustic scene cues
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python "$PACKAGE/worker.py" request "${{ matrix.part }}"
      - name: Deliver each result immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-next-align-${{ matrix.part }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
