name: Fate L01 remaining Arabic audio v3
on:
  push:
    branches: [work/fate-l01-full-pilot-20261020]
    paths: [experiments/course-pipeline/rebuild/fate-l01-full-pilot-20261020/arabic-repair-v3/request.json]
permissions:
  contents: read
  actions: read
env:
  PACKAGE: experiments/course-pipeline/rebuild/fate-l01-full-pilot-20261020/arabic-repair-v3
  EXPECTED_REQUEST_SHA256: 5900165588da0656482bdb53d0228d49f9f9b4de4d5b61c0e1010a10d6b6318c
jobs:
  audio:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: ["L01-S03-P1", "L01-S03-P2", "L01-S03-P3", "L01-S03-P4", "L01-S05-P1", "L01-S05-P2", "L01-S05-P3", "L01-S07-P1", "L01-S07-P2", "L01-S07-P3", "L01-S08-P1", "L01-S08-P2", "L01-S08-P3", "L01-S08-P4", "L01-S09-P1", "L01-S09-P2", "L01-S09-P3", "L01-S09-P4", "L01-S01", "L01-S02", "L01-S04", "L01-S06", "L01-S10"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate changed sentence or receive unchanged recording
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python "$PACKAGE/prepare_audio.py" "${{ matrix.part }}"
      - name: Deliver completed audio immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-l01-ar-v3-${{ matrix.part }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
      - name: Screen actual audio for omissions numbers and uncertainties
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python "$PACKAGE/review.py" "${{ matrix.part }}"
      - name: Deliver review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-l01-ar-v3-review-${{ matrix.part }}
          path: |
            ${{ env.PACKAGE }}/output/review/
            ${{ env.PACKAGE }}/output/review-summary.json
          retention-days: 30
  assemble:
    needs: audio
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assemble Arabic listening candidate preserving accepted PCM
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$PACKAGE/assemble.py"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-l01-ar-v3-complete
          path: ${{ env.PACKAGE }}/assembled/
          retention-days: 30
