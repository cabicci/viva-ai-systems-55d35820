name: S103 one original Arabic six-second actual-audio context diagnostic
'on':
  push:
    branches:
    - work/soil-s103-ar-r01-context-20261023-r1
    paths:
    - s103-ar-context/request.json
permissions:
  contents: read
concurrency:
  group: s103-ar-context-d6fd96d2342648eccb9a76aac12a5e593ccc25c5527f7cfffcc438dbba15d48b
  cancel-in-progress: false
env:
  PACKAGE: s103-ar-context
  REQUEST_SHA: d6fd96d2342648eccb9a76aac12a5e593ccc25c5527f7cfffcc438dbba15d48b
  WORKER_SHA: 4c4d380d65e307aa959a9cd3409e971e34b7084c5195c89a9c53f97c9e768f56
  FREEZE_SHA: c64098232d37d9d65c61faf23206f5780e1a60c2ffed5e75fb4b77de5a9f043b
  BRANCH_CREATED: ${{ github.event.created }}
  REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
  PYTHONUNBUFFERED: '1'
jobs:
  review:
    if: github.run_attempt == 1 && github.repository_id == '1272666418' && github.repository == 'cabicci/viva-ai-systems-55d35820'
      && github.ref == 'refs/heads/work/soil-s103-ar-r01-context-20261023-r1' && github.event.created == true && github.event.before
      == '0000000000000000000000000000000000000000' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Verify exact original sixsecond PCM and finitebudget
      id: validate
      run: 'cd "$PACKAGE"

        python worker.py validate

        '
    - name: Preserve exact context before onlyreview
      id: audio
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s103-ar-context-r1-input
        path: ${{ env.PACKAGE }}/inputs/context.wav
        if-no-files-found: error
        retention-days: 30
    - name: Record immutable context upload
      id: receipt
      env:
        AID: ${{ steps.audio.outputs.artifact-id }}
        DIGEST: ${{ steps.audio.outputs.artifact-digest }}
      run: 'cd "$PACKAGE"

        python worker.py uploaded --artifact-id "$AID" --artifact-digest "$DIGEST"

        '
    - name: One unprompted actualaudio contextreview noTTS noASR noretry
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py review

        '
    - name: Preserve exact frozen payload and alloutcomes
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s103-ar-context-r1-evidence
        retention-days: 30
        include-hidden-files: true
        if-no-files-found: error
        path: '${{ env.PACKAGE }}/output/

          ${{ env.PACKAGE }}/README.en.txt

          ${{ env.PACKAGE }}/request.json

          ${{ env.PACKAGE }}/runtime.json

          ${{ env.PACKAGE }}/attempt-ledger.json

          ${{ env.PACKAGE }}/owner-authority.json

          ${{ env.PACKAGE }}/prompts/blind.txt

          ${{ env.PACKAGE }}/inputs/context.wav

          ${{ env.PACKAGE }}/provenance/model-availability.json

          ${{ env.PACKAGE }}/provenance/context-proof.json

          ${{ env.PACKAGE }}/worker.py

          ${{ env.PACKAGE }}/offline_check.py

          ${{ env.PACKAGE }}/freeze_package.py

          ${{ env.PACKAGE }}/freeze.json

          .github/workflows/s103-ar-context.yml'
