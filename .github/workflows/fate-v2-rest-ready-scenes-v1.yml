name: Fate v2 rest-ready-scenes-v1 exact qualified sources
on:
  push:
    branches: [work/masaarat/0c0df2131ade371ac908def0]
    paths: [experiments/course-pipeline/rebuild/fate-course-v2/rest-ready-scenes-v1/request.json]
permissions:
  contents: read
  actions: read
env:
  PACKAGE: experiments/course-pipeline/rebuild/fate-course-v2/rest-ready-scenes-v1
  EXPECTED_REQUEST_SHA256: f9caf0a3ef05c8ad59a74cf2d1fbb2016afa7bcda93148b57551e56d7c8ebb63
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
  EXPECTED_IMPLEMENTATION_SHA256: d7057f920af68512a8ae9e4a6003955d8b5754b613a1efc8515865e88a17f468
jobs:
  scene:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        part: ["S03-01-ar-EG", "S03-02-ar-EG", "S03-03-ar-EG", "S03-04-ar-EG", "S03-05-ar-EG", "S03-06-ar-EG", "S03-01-en", "S03-02-en", "S03-03-en", "S03-04-en", "S03-05-en", "S03-06-en", "S04-01-ar-EG", "S04-02-ar-EG", "S04-05-ar-EG", "S04-01-en", "S04-03-en", "S04-04-en", "S04-05-en", "S05-01-ar-EG", "S05-02-ar-EG", "S05-03-ar-EG", "S05-04-ar-EG", "S05-05-ar-EG", "S05-01-en", "S05-02-en", "S05-03-en", "S05-04-en", "S05-05-en", "S06-01-ar-EG", "S06-03-ar-EG", "S06-04-ar-EG", "S06-05-ar-EG", "S06-01-en", "S06-02-en", "S06-03-en", "S06-04-en", "S07-01-ar-EG", "S07-02-ar-EG", "S07-03-ar-EG", "S07-01-en", "S07-02-en", "S07-03-en", "S07-04-en", "S07-05-en", "S08-01-ar-EG", "S08-02-ar-EG", "S08-03-ar-EG", "S08-04-ar-EG", "S08-05-ar-EG", "S08-01-en", "S08-02-en", "S08-03-en", "S08-04-en", "S08-05-en", "S09-01-ar-EG", "S09-03-ar-EG", "S09-05-ar-EG", "S09-01-en", "S09-02-en", "S09-03-en", "S09-04-en", "S09-05-en", "S10-01-ar-EG", "S10-02-ar-EG", "S10-03-ar-EG", "S10-05-ar-EG", "S10-01-en", "S10-02-en", "S10-03-en", "S10-04-en", "S10-05-en", "S11-01-ar-EG", "S11-03-ar-EG", "S11-04-ar-EG", "S11-01-en", "S11-03-en", "S11-05-en"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact finite request and implementation pins
        run: |
          python - <<'PY'
          import os,json,hashlib,pathlib
          p=pathlib.Path(os.environ['PACKAGE']);s=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert s(p/'request.json')==os.environ['EXPECTED_REQUEST_SHA256']
          assert s(p/'implementation-pins.en.json')==os.environ['EXPECTED_IMPLEMENTATION_SHA256']
          for n,h in json.loads((p/'implementation-pins.en.json').read_text()).items():assert s(p/n)==h
          PY
      - name: Verify audio gate and actual clock, bind explanatory actions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python "$PACKAGE/prepare.py" "${{ matrix.part }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fate-v2-rest-ready-clock-v1-${{ matrix.part }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
      - name: Install pinned renderer
        working-directory: experiments/course-pipeline/rebuild/fate-course-v2/rest-ready-scenes-v1
        run: npm ci --no-audit --no-fund
      - name: Render meaningful action checkpoints
        run: node "$PACKAGE/render.cjs" stills
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-v2-rest-ready-stills-v1-${{ matrix.part }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
      - name: Render single scene and decode actual video checkpoints
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          node "$PACKAGE/render.cjs" video
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fate-v2-rest-ready-video-v1-${{ matrix.part }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
