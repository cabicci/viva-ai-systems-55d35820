name: S101 English full first-lesson assembly only
on:
  push:
    branches: [work/soil-s101-en-assembly-20261022-r1]
permissions:
  contents: read
concurrency:
  group: s101-en-assembly-20261022-r1
  cancel-in-progress: false
jobs:
  assemble:
    if: >-
      github.repository == 'cabicci/viva-ai-systems-55d35820' &&
      github.repository_id == '1272666418' &&
      github.ref == 'refs/heads/work/soil-s101-en-assembly-20261022-r1' &&
      github.event_name == 'push' && github.event.created == true &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MANIFEST_SHA: fe091d25018e28b1a831703cedce0e21358a977e69282d0b304e8954ac6db18a
      WORKER_SHA: cfea9004c1c88af8e8079771c1211269f36cfbe77c57a55292096fa2ba6cc415
      FREEZE_SHA: bb961a23af047a2439899e5e3c1b941900917cdbb732db28208862db31e4bb12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure complete video codecs before validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Verify all exact existing inputs and source PCM
        run: python -B media/s101-en-assembly/assemble.py validate
      - name: Assemble ten existing clips with exact original PCM
        run: python -B media/s101-en-assembly/assemble.py execute
      - name: Preserve output and finite command journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s101-it-full-first-lesson-r1
          path: media/s101-en-assembly/output
          if-no-files-found: error
          retention-days: 7
