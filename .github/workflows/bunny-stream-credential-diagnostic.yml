name: Bunny Stream Credential Diagnostic — Read Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run read-only credential diagnostic
        env:
          BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
        run: |
          python3 <<'PY'
          import json, os, re, urllib.request, urllib.error

          OUT = "/tmp/bunny-credential-diagnostic.json"
          GUID = "0722af62-6fff-43d7-8217-78acd7d1a79d"
          REGISTRY_ID = None

          # 3. Parse expected library ID from src/lib/bunny-videos.ts
          try:
              src = open("src/lib/bunny-videos.ts", encoding="utf-8").read()
              m = re.search(r'BUNNY_LIBRARY_ID\s*=\s*"(\d+)"', src)
              if m:
                  REGISTRY_ID = m.group(1)
          except Exception:
              REGISTRY_ID = None

          raw_lib = os.environ.get("BUNNY_STREAM_LIBRARY_ID", "")
          raw_key = os.environ.get("BUNNY_STREAM_API_KEY", "")

          lib_present = bool(raw_lib)
          lib_len = len(raw_lib) if raw_lib else 0
          lib_stripped = raw_lib.strip() if raw_lib else ""
          lib_is_ascii_digits = bool(lib_stripped) and lib_stripped.isascii() and lib_stripped.isdigit()
          lib_has_ws = bool(raw_lib) and (raw_lib != raw_lib.strip())
          lib_has_quotes = any(q in raw_lib for q in ('"', "'"))
          lib_equals_registry = (lib_stripped == REGISTRY_ID) if (REGISTRY_ID and lib_stripped) else False

          key_present = bool(raw_key)

          report = {
              "registry_library_id": REGISTRY_ID,
              "library_secret_present": lib_present,
              "library_secret_length": lib_len,
              "library_secret_is_ascii_digits": lib_is_ascii_digits,
              "library_secret_has_surrounding_whitespace": lib_has_ws,
              "library_secret_has_quotes": lib_has_quotes,
              "library_secret_equals_registry_id": lib_equals_registry,
              "api_key_present": key_present,
              "checks": {},
              "classification": None,
          }

          def do_get(library_id):
              url = f"https://video.bunnycdn.com/library/{library_id}/videos/{GUID}"
              req = urllib.request.Request(url, method="GET")
              req.add_header("AccessKey", raw_key)
              req.add_header("accept", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.getcode()
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception:
                  return -1

          # 6. GET with registry ID
          status_registry = None
          if REGISTRY_ID and key_present:
              status_registry = do_get(REGISTRY_ID)
              report["checks"]["registry_id_status"] = status_registry

          # 7. GET with runtime ID only if ASCII digits
          status_runtime = None
          if lib_is_ascii_digits and key_present:
              status_runtime = do_get(lib_stripped)
              report["checks"]["runtime_id_status"] = status_runtime

          # 8. Classify
          classification = "UNEXPECTED_BUNNY_RESPONSE"
          if not key_present:
              classification = "STREAM_API_KEY_INVALID_OR_WRONG_LIBRARY"
          elif status_registry == 200:
              classification = "CREDENTIAL_PAIR_READ_OK"
          elif status_registry in (401, 403) and status_runtime == 200:
              classification = "RUNTIME_LIBRARY_ID_MISMATCH"
          elif status_registry in (401, 403) and status_runtime in (401, 403, None):
              classification = "STREAM_API_KEY_INVALID_OR_WRONG_LIBRARY"
          elif status_registry == 400:
              classification = "BUNNY_REJECTED_VALID_LIBRARY_ID"
          elif status_registry == 404 and status_runtime == 200:
              classification = "RUNTIME_LIBRARY_ID_MISMATCH"

          report["classification"] = classification

          with open(OUT, "w") as f:
              json.dump(report, f, indent=2)
          print(json.dumps(report, indent=2))
          PY

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunny-credential-diagnostic
          path: /tmp/bunny-credential-diagnostic.json
