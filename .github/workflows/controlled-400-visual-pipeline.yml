# Default-branch registration stub for controlled-400-visual-pipeline.
# This file NEVER runs the visual pipeline. It exists only so GitHub can
# register workflow_dispatch for branch-ref invocation of the real candidate.
# Every invocation terminates intentionally without executing any pipeline mode.

name: controlled-400-visual-pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline mode
        required: true
        type: choice
        options:
          - preflight
          - pilot
          - failed-only
          - full-400
          - report-only
        default: preflight
      confirm_full_400:
        description: Required ONLY for mode=full-400 — must equal RUN_AUTHORIZED_400 exactly
        required: false
        type: string
        default: ""
      checkout_sha:
        description: Optional explicit commit SHA to check out (defaults to the ref that triggered dispatch)
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  registration-stub:
    name: fail-closed registration stub
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed — registration stub only
        run: |
          echo "This file is the default-branch registration stub for controlled-400-visual-pipeline."
          echo "It never runs the visual pipeline."
          echo "An explicitly authorized candidate ref is required for pipeline execution."
          echo "Execution is intentionally blocked."
          echo "Inputs preserved for dispatch compatibility only: mode='${{ inputs.mode }}' confirm_full_400='${{ inputs.confirm_full_400 }}' checkout_sha='${{ inputs.checkout_sha }}'"
          echo "No checkout, no secrets, no installs, no artifacts, no external actions, no preflight/pilot/failed-only/report-only/full-400."
          exit 1
