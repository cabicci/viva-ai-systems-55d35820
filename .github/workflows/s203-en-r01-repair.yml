name: S203 one English provisional explanation sentence repair
'on':
  push:
    branches:
    - work/soil-s203-en-r01-repair-20261023-r1
    paths:
    - s203-en-r01-repair/request.json
permissions:
  contents: read
concurrency:
  group: s203-en-r01-repair-966d10d707edbda8733533f9173406d145a178ba6f4bc4336b38dd69e7b71f6b
  cancel-in-progress: false
env:
  PACKAGE: s203-en-r01-repair
  REQUEST_SHA: 966d10d707edbda8733533f9173406d145a178ba6f4bc4336b38dd69e7b71f6b
  WORKER_SHA: 0d0dc835b71d30bf6093242476722a249933cab6d160e2e294eca32544da63c4
  FREEZE_SHA: e8007d751ce5210ed74c28975638cd06300da7ec34c8d220fb45221b02a4b04a
  BRANCH_CREATED: ${{ github.event.created }}
  REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
jobs:
  narrate_en:
    if: github.run_attempt == 1 && github.repository_id == '1272666418' && github.repository
      == 'cabicci/viva-ai-systems-55d35820' && github.ref == 'refs/heads/work/soil-s203-en-r01-repair-20261023-r1'
      && github.event.created == true && github.event.before == '0000000000000000000000000000000000000000'
      && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      LOCALE_LANE: en
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Validate exact fourlocale sourcebindings identity cache and budget
      id: validate
      run: 'cd "$PACKAGE"

        python worker.py validate

        '
    - name: Finite exactpreferred model availability2GET nofallback
      id: preflight
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py preflight

        '
    - name: Install hashverified multilingualWhisper before anyTTS
      id: runtime
      run: 'cd "$PACKAGE"

        python -m pip download --no-deps --dest wheels faster-whisper==1.2.1

        python worker.py verify-wheel

        python -m pip install --disable-pip-version-check --report output/pip-install-report.json
        wheels/faster_whisper-1.2.1-*.whl

        python worker.py prepare-asr-runtime

        '
    - name: One coherent TTS S2-03-en-R01-sentence-repair-r1
      id: tts1
      if: always() && steps.validate.outcome == 'success' && steps.preflight.outcome
        == 'success' && steps.runtime.outcome == 'success'
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: 'cd "$PACKAGE"

        python worker.py produce --unit S2-03-en-R01-sentence-repair-r1

        '
    - name: Upload full immutable audio once S2-03-en-R01-sentence-repair-r1
      id: upload1
      if: always() && steps.tts1.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s203-en-r01-repair-r1-S2-03-en-R01-sentence-repair-r1-audio
        path: ${{ env.PACKAGE }}/output/S2-03-en-R01-sentence-repair-r1/
        retention-days: 30
        if-no-files-found: error
    - name: Record immutable audio upload S2-03-en-R01-sentence-repair-r1
      id: receipt1
      if: always() && steps.upload1.outcome == 'success'
      continue-on-error: true
      env:
        AID: ${{ steps.upload1.outputs.artifact-id }}
        DIGEST: ${{ steps.upload1.outputs.artifact-digest }}
      run: 'cd "$PACKAGE"

        python worker.py uploaded --unit S2-03-en-R01-sentence-repair-r1 --artifact-id
        "$AID" --artifact-digest "$DIGEST"

        '
    - name: blind-review S2-03-en-R01-sentence-repair-r1
      if: always() && steps.tts1.outcome == 'success' && steps.upload1.outcome ==
        'success' && steps.receipt1.outcome == 'success'
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py blind-review --unit S2-03-en-R01-sentence-repair-r1

        '
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    - name: asr S2-03-en-R01-sentence-repair-r1
      if: always() && steps.tts1.outcome == 'success' && steps.upload1.outcome ==
        'success' && steps.receipt1.outcome == 'success'
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py asr --unit S2-03-en-R01-sentence-repair-r1

        '
    - name: compare S2-03-en-R01-sentence-repair-r1
      if: always() && steps.tts1.outcome == 'success' && steps.upload1.outcome ==
        'success' && steps.receipt1.outcome == 'success'
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py compare --unit S2-03-en-R01-sentence-repair-r1

        '
    - name: Stage thin diagnostics S2-03-en-R01-sentence-repair-r1
      id: stage1
      if: always()
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py stage-diagnostics --unit S2-03-en-R01-sentence-repair-r1

        '
    - name: Preserve thin diagnostics S2-03-en-R01-sentence-repair-r1
      if: always() && steps.stage1.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s203-en-r01-repair-r1-S2-03-en-R01-sentence-repair-r1-review
        path: ${{ env.PACKAGE }}/diagnostics-output/S2-03-en-R01-sentence-repair-r1/
        retention-days: 30
        if-no-files-found: error
    - name: Lane summary preserves partial failures
      if: always()
      run: 'cd "$PACKAGE"

        python worker.py summarize

        '
    - name: Stage thin complete evidence
      id: stagecomplete
      if: always()
      continue-on-error: true
      run: 'cd "$PACKAGE"

        python worker.py stage-complete

        '
    - name: Preserve exact lane evidence
      if: always() && steps.stagecomplete.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: s203-en-r01-repair-r1-ar-EG-complete-evidence
        retention-days: 30
        if-no-files-found: error
        include-hidden-files: true
        path: '${{ env.PACKAGE }}/complete-output/

          ${{ env.PACKAGE }}/.gitignore

          ${{ env.PACKAGE }}/README.en.txt

          ${{ env.PACKAGE }}/freeze_package.py

          ${{ env.PACKAGE }}/offline_check.py

          ${{ env.PACKAGE }}/owner-authority.json

          ${{ env.PACKAGE }}/cumulative-attempt-ledger.json

          ${{ env.PACKAGE }}/cache-live-audit.json

          ${{ env.PACKAGE }}/expected-criteria.NOT-FOR-MODEL.json

          ${{ env.PACKAGE }}/provenance/worker-derivation.json

          ${{ env.PACKAGE }}/request.json

          ${{ env.PACKAGE }}/runtime.json

          ${{ env.PACKAGE }}/vendor/course/manifest.json

          ${{ env.PACKAGE }}/vendor/pipeline-engine.py

          ${{ env.PACKAGE }}/worker.py

          ${{ env.PACKAGE }}/provenance/narration-de.json

          ${{ env.PACKAGE }}/thin_artifacts.py

          ${{ env.PACKAGE }}/freeze.json

          .github/workflows/s203-en-r01-repair.yml'
