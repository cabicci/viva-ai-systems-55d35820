name: Fate L02-L07 distinct scientific illustrations v1
on:
  push:
    branches: [work/masaarat/0c0df2131ade371ac908def0]
    paths: [experiments/course-pipeline/rebuild/fate-L02-L07-bilingual-v1/images/request.json]
permissions:
  contents: read
concurrency:
  group: fate-L02-L07-images-v1
  cancel-in-progress: false
env:
  PACKAGE: experiments/course-pipeline/rebuild/fate-L02-L07-bilingual-v1/images
  EXPECTED_REQUEST_SHA256: e08e300b2d2f02cc9e616562ddcbc9c71a069be9950581a94e5702da4161c16f
jobs:
  image:
    if: github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scene: ["L02-S01", "L02-S02", "L02-S03", "L02-S04", "L02-S05", "L02-S06", "L02-S07", "L02-S08", "L03-S01", "L03-S02", "L03-S03", "L03-S04", "L03-S05", "L03-S06", "L04-S01", "L04-S02", "L04-S03", "L04-S04", "L04-S05", "L04-S06", "L04-S07", "L05-S01", "L05-S02", "L05-S03", "L05-S04", "L05-S05", "L05-S06", "L06-S01", "L06-S02", "L06-S03", "L06-S04", "L06-S05", "L06-S06", "L06-S07", "L07-S01", "L07-S02", "L07-S03", "L07-S04", "L07-S05", "L07-S06", "L07-S07", "L07-S08", "L07-S09"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate distinct scene illustration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python "$PACKAGE/worker.py" "${{ matrix.scene }}" generate
      - name: Deliver original before review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-next-image-${{ matrix.scene }}
          path: ${{ env.PACKAGE }}/output/
          retention-days: 30
      - name: Inspect actual image against scientific contract
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python "$PACKAGE/worker.py" "${{ matrix.scene }}" review
      - name: Deliver review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fate-next-image-review-${{ matrix.scene }}
          path: ${{ env.PACKAGE }}/output/review*.json
          retention-days: 30
