name: Soil four-language walkthrough narration
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths: [experiments/course-pipeline/production/walkthrough-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: soil-walkthrough-${{ github.ref }}
  cancel-in-progress: false
jobs:
  narration:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        locale: [ar-EG, en, it, de]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify the completed course production gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          p=json.load(open('experiments/course-pipeline/production/walkthrough-request.json'))
          assert p['action']=='produce-four-language-walkthrough' and p['courseMediaVerified'] is True
          run=json.loads(subprocess.check_output(['gh','run','view',str(p['courseMediaRun']),'--json','name,status,conclusion']))
          assert run['name']=='Soil full-course four-language media'
          assert run['status']=='completed' and run['conclusion']=='success'
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install Pillow==11.3.0
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: experiments/course-pipeline/production/walkthrough-output/${{ matrix.locale }}
          key: soil-tour-${{ matrix.locale }}-${{ hashFiles('experiments/course-pipeline/production/walkthroughs.json') }}
          restore-keys: soil-tour-${{ matrix.locale }}-
      - name: Produce the localized narration and compare its actual audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          LOCALE: ${{ matrix.locale }}
        run: python3 experiments/course-pipeline/production/walkthrough_audio.py --locale "$LOCALE"
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always()
        with:
          path: experiments/course-pipeline/production/walkthrough-output/${{ matrix.locale }}
          key: soil-tour-${{ matrix.locale }}-${{ hashFiles('experiments/course-pipeline/production/walkthroughs.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soil-walkthrough-${{ matrix.locale }}
          path: experiments/course-pipeline/production/walkthrough-output/${{ matrix.locale }}
          retention-days: 30
