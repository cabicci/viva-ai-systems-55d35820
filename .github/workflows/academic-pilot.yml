name: Academic isolated pilot
on:
  push:
    branches: [work/masaarat-academic-20261005]
    paths: [experiments/academic/media/production-request.json]
permissions:
  contents: read
concurrency:
  group: academic-pilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pilot:
    if: github.ref == 'refs/heads/work/masaarat-academic-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        locale: [ar-EG, ar-MSA, ar-Gulf, en]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Prepare existing renderer and fonts
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          bun install --frozen-lockfile
          cd remotion && bun install --frozen-lockfile && cd ..
          mkdir -p remotion/public/academic-fonts remotion/public/brand
          cp src/lib/lesson-visuals/v1/fonts/Tajawal-*.woff2 remotion/public/academic-fonts/
          cp public/brand/masaarat-logo-lockup.png remotion/public/brand/
          python3 experiments/academic/validate.py
      - name: Render the authored pilot only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TTS_MAX_WORKERS: "1"
          TTS_REQUEST_GAP_SECONDS: "10"
          LOCALE: ${{ matrix.locale }}
        run: python3 experiments/academic/media/build.py --locale "$LOCALE"
      - name: Upload new pilot to Bunny only
        env:
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
          BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
          LOCALE: ${{ matrix.locale }}
        run: python3 experiments/academic/media/upload.py "$LOCALE"
      - name: Retain review media and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: academic-pilot-${{ matrix.locale }}
          retention-days: 14
          path: |
            tmp/academic-media/**/lesson.mp4
            tmp/academic-media/**/receipt.json
            tmp/academic-media/**/props.json
            tmp/academic-media/**/transcript.txt
            tmp/academic-media/**/audio/master.mp3
          if-no-files-found: warn
