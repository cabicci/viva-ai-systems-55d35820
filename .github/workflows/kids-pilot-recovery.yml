name: Masaarat Kids — resume English narration
on:
  push:
    branches: [feature/masaarat-kids-pilot]
    paths: [experiments/masaarat-kids/recovery-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: masaarat-kids-narrated-pilot
  cancel-in-progress: false
jobs:
  produce:
    if: github.repository == 'cabicci/viva-ai-systems-55d35820' && github.ref == 'refs/heads/feature/masaarat-kids-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PILOT_LOCALE: en
    defaults:
      run:
        working-directory: experiments/masaarat-kids
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate scope and source
        env:
          PILOT_LOCALE: en
        run: |
          python -c 'import json,os; p=json.load(open("recovery-request.json")); assert p["lessonId"]=="kids-l1-clear-prompt" and p["mode"]=="narrated" and p["publish"] is False and os.environ["PILOT_LOCALE"] in p["locales"]'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bun install --frozen-lockfile
          bun run assets
          bun run check
          bun test
          bun x tsc --noEmit
      - name: Restore the six completed English segments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35867880239 --repo cabicci/viva-ai-systems-55d35820 --name kids-pilot-en-35867880239-1 --dir "$RUNNER_TEMP/kids-resume"
          mkdir -p public/generated/audio/en
          cp -a "$RUNNER_TEMP/kids-resume/public/generated/audio/en/." public/generated/audio/en/
      - name: Generate narration with the existing repository secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PILOT_LOCALE: en
        run: python -u scripts/narrate.py --locale "$PILOT_LOCALE"
      - name: Install video inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render narrated video and scene stills
        env:
          PILOT_LOCALE: en
        run: |
          bun run render --locale="$PILOT_LOCALE" --stills
          python scripts/verify-narrated.py --locale "$PILOT_LOCALE"
      - name: Preserve pilot outputs and completed audio segments
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kids-pilot-en-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            experiments/masaarat-kids/public/generated/audio/en/
            experiments/masaarat-kids/public/generated/videos/en.mp4
            experiments/masaarat-kids/public/generated/videos/en.vtt
            experiments/masaarat-kids/public/generated/stills/en/
            experiments/masaarat-kids/content/media.json
            experiments/masaarat-kids/evidence/
