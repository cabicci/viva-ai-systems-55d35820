name: Soil one procedural sample motion proof
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths:
      - .github/workflows/soil-sample-procedure-motion-proof.yml
      - experiments/course-pipeline/rebuild/sample-procedure-motion-proof/request.json
  workflow_dispatch:
    inputs:
      request_sha256:
        description: Exact bounded one-sprite request SHA-256
        type: string
        required: true
permissions:
  actions: read
  contents: read
concurrency:
  group: soil-sample-procedure-motion-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.ref == 'refs/heads/work/soil-course-pipeline-20261013' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PACKAGE: experiments/course-pipeline/rebuild/sample-procedure-motion-proof
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Validate bounded request
        env:
          REQUEST_SHA: ${{ inputs.request_sha256 || 'ff8cd13f6d5b759515b8fa6d175bdef0ffe00abedee2ded5307fe4e521a23d80' }}
        run: python "$PACKAGE/produce.py" validate --request-sha "$REQUEST_SHA"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: experiments/course-pipeline/rebuild/sample-procedure-motion-proof/output
          key: sample-procedure-initial-ff8cd13f6d5b759515b8fa6d175bdef0ffe00abedee2ded5307fe4e521a23d80
      - name: Retrieve accepted image reference without committing artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38557018355 --repo cabicci/viva-ai-systems-55d35820 --name s101-working-images --dir _motion_reference
      - name: Generate one motion sprite and inspect explicit criteria
        env:
          REQUEST_SHA: ${{ inputs.request_sha256 || 'ff8cd13f6d5b759515b8fa6d175bdef0ffe00abedee2ded5307fe4e521a23d80' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: python "$PACKAGE/produce.py" produce --request-sha "$REQUEST_SHA" --reference-dir _motion_reference
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always()
        with:
          path: experiments/course-pipeline/rebuild/sample-procedure-motion-proof/output
          key: sample-procedure-initial-ff8cd13f6d5b759515b8fa6d175bdef0ffe00abedee2ded5307fe4e521a23d80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sample-procedure-motion-proof
          retention-days: 30
          path: experiments/course-pipeline/rebuild/sample-procedure-motion-proof/output/
