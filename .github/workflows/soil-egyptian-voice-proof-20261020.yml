# Prepared only. Not installed, pushed or executed.
# Before installation copy voice-proof.py and the exact request into PACKAGE.
name: Soil bounded Egyptian two-voice listening proof
on:
  push:
    branches: [work/soil-course-pipeline-20261013]
    paths: [experiments/course-pipeline/rebuild/ar-voice-proof-20261020/short-voice-proof-request.private.json]
permissions:
  contents: read
concurrency:
  group: soil-egyptian-voice-proof-6aff20882e9a1c97
  cancel-in-progress: false
jobs:
  voice-proof:
    if: github.ref == 'refs/heads/work/soil-course-pipeline-20261013' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PACKAGE: experiments/course-pipeline/rebuild/ar-voice-proof-20261020
      REQUEST_SHA: 6aff20882e9a1c974c25998fe898b74b40c0a598418509751d1e5e68aa2c1ae8
      ENGINE_SHA: 78698b25f1653c6f4fc70d54bb3f88fd3a3d716e846df41bea6548a080c7f595
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate only the exact two excerpts and reviewed existing engine
        run: python "$PACKAGE/voice-proof.py" validate --repo . --engine-sha "$ENGINE_SHA"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: experiments/course-pipeline/rebuild/ar-voice-proof-20261020/output
          key: egyptian-voice-proof-6aff20882e9a1c974c25998fe898b74b40c0a598418509751d1e5e68aa2c1ae8
      - name: Produce at most two short clips, no automatic repair or full-course job
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: python "$PACKAGE/voice-proof.py" produce --repo . --request-sha "$REQUEST_SHA" --engine-sha "$ENGINE_SHA"
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always()
        with:
          path: experiments/course-pipeline/rebuild/ar-voice-proof-20261020/output
          key: egyptian-voice-proof-6aff20882e9a1c974c25998fe898b74b40c0a598418509751d1e5e68aa2c1ae8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: soil-egyptian-two-voice-listening-proof
          retention-days: 30
          path: |
            experiments/course-pipeline/rebuild/ar-voice-proof-20261020/output/
            experiments/course-pipeline/rebuild/ar-voice-proof-20261020/offline-validation.private.json
