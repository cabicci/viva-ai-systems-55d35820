:root{--paper:oklch(.995 .003 230);--ink:oklch(.30 .04 260);--blue:oklch(.62 .08 235);--deep:oklch(.36 .075 235);--muted:oklch(.50 .03 250);--line:oklch(.30 .04 260/.14);--mist:oklch(.97 .012 230);--sky:oklch(.91 .025 230);--mint:oklch(.92 .03 165);--pink:oklch(.92 .025 20);--lemon:oklch(.95 .04 100);--lav:oklch(.90 .03 305);color:var(--ink);background:var(--paper);font:18px/1.55 Tajawal,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0}main,header,footer{max-width:1100px;margin:auto;padding:20px clamp(16px,4vw,48px)}header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}header img{width:115px;height:48px;object-fit:contain}a{color:var(--deep)}nav{display:flex;gap:12px;flex-wrap:wrap}h1{font-size:clamp(32px,5vw,54px);line-height:1.18;max-width:23ch;margin:24px 0 16px}h2{font-size:27px;line-height:1.28;margin:20px 0 8px}p{max-width:77ch}figure{margin:14px 0;padding:16px;background:var(--mist);border:1px solid var(--line);border-radius:15px}figure svg{max-height:300px;width:100%}section{padding:18px 0;border-top:1px solid var(--line)}button,.action{font:inherit;color:white;background:var(--deep);padding:7px 17px;border:0;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{color:var(--deep);background:var(--sky)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #825211;outline-offset:3px}label{display:block;font-weight:bold;margin:12px 0}textarea,input[type=number]{width:100%;display:block;background:white;color:var(--ink);border:1px solid var(--muted);border-radius:8px;padding:10px;font:inherit}textarea{min-height:75px}video{width:100%;max-width:800px;background:var(--ink);border-radius:12px}video::cue{color:white;background:rgba(24,42,57,.94);font-family:Tajawal,sans-serif}output{display:block;margin:10px 0;color:var(--deep)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}.grid a{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 15px;text-decoration:none}.grid a:hover{background:var(--mist)}.callout{padding:14px 20px;background:var(--mist);border-inline-start:4px solid var(--blue)}.actions{display:flex;gap:8px;flex-wrap:wrap}.numbers{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}fieldset{border:1px solid var(--line function diagram(n, state, arabic) {
  const tr=(en,ar)=>arabic?ar:en;
  const ink='#263951', blue='#386883', green='#447963', red='#a44e47', pale='#e2eff4', sand='#f1e3ce';
  const parts=[];
  const box=(x,y,w,h,color=pale,stroke=ink)=>parts.push('<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4" fill="'+color+'" stroke="'+stroke+'" stroke-width="3"/>');
  const line=(x,y,a,b,color=ink,dash=false)=>parts.push('<line x1="'+x+'" y1="'+y+'" x2="'+a+'" y2="'+b+'" stroke="'+color+'" stroke-width="4" '+(dash?'stroke-dasharray="9 6"':'')+'/>');
  const label=(x,y,s,color=ink,size=23)=>parts.push('<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="central" direction="'+(arabic&&/[\u0600-\u06ff]/.test(s)?'rtl':'ltr')+'" font-family="Tajawal,Arial,sans-serif" font-weight="700" font-size="'+size+'" fill="'+color+'">'+s+'</text>');
  const path=(d,color,fill='none')=>parts.push('<path d="'+d+'" fill="'+fill+'" stroke="'+color+'" stroke-width="4"/>');
  const dim=(x,y,a,b,s)=>{line(x,y,a,b,blue); if(y===b){line(x,y-6,x,y+6,blue);line(a,b-6,a,b+6,blue);label((x+a)/2,y-18,s,blue)}else{line(x-5,y,x+5,y,blue);line(a-5,b,a+5,b,blue);label(x+42,(y+b)/2,s,blue)}};
  const room=()=>box(45,42,430,215,'#f8fafb');
  const note=(en,ar)=>label(260,295,tr(en,ar),blue,20);
  const table=(x,y,w=120,h=62)=>{box(x,y,w,h,sand);line(x+10,y+h,x+10,y+h+12);line(x+w-10,y+h,x+w-10,y+h+12)};
  const pair=(left,right,symbol='→')=>{box(42,74,154,131,pale);box(324,74,154,131,state?'#dcefe3':'#f5f4ed');label(118,140,left,ink,28);label(259,143,symbol,blue,36);if(state)label(401,140,right,green,28)};
  switch(Number(n)){
  case 1:table(110,95,245,85);[0,1,2,3].forEach(i=>box(state?364+i*6:135+i*44,state?139:112,26,22,state?'#df9879':'#b5a8cf'));if(state)box(358,160,60,39,sand);note('6 min  →  2 min target','من 6 دقائق إلى هدف قدره دقيقتان');break;
  case 2:room();box(219,53,34,20,'white');box(state?300:180,70,105,80,sand);note('Socket and reading chair','المقبس وكرسي القراءة');break;
  case 3:room();label(55,26,'AB');label(260,28,'B');box(145,36,110,12,pale);if(state)dim(46,106,145,106,'50 cm');break;
  case 4:line(70,60,70,230);line(450,60,450,230);box(430,130,20,95,sand);dim(70,180,430,180,'362 cm');if(state)dim(70,90,450,90,'365 cm');break;
  case 5:dim(65,80,465,80,'400 cm');[[110,'110'],[90,'90'],[195,'195']].reduce((x,[w,s],i)=>{box(x,140,w,58,[pale,sand,'#dcefe3'][i]);label(x+w/2,169,s);return x+w},65);if(state)note('400 − 395 = 5 cm','400 − 395 = 5 cm');break;
  case 6:line(75,215,190,215);line(335,215,455,215);line(190,215,330,215,blue);path('M330 215 A140 140 0 0 0 190 75',blue);line(190,215,190,75,blue,true);box(state?367:285,state?147:116,44,42,sand);note('Hinge • swept area • basket','المفصلة ومسار الفتح والسلة');break;
  case 7:case 20:{let win=Number(n)===7;line(50,235,465,235);box(90,42,250,win?80:18,pale);if(win){line(280,93,280,142,red);label(390,119,'90 cm');label(390,149,'82 cm',red)}else label(398,49,'145 cm');if(state){box(120,win?136:43,110,win?99:192,sand);label(177,192,win?'85 cm':'150 cm')}break}
  case 8:line(90,60,90,228);line(430,60,430,228);box(90,180,14,48,sand);box(416,180,14,48,sand);dim(90,95,430,95,'122 cm');if(state)dim(104,174,416,174,'118 cm');break;
  case 9:box(90,70,280,210,pale);dim(90,58,370,58,state?'20 cm':'400 cm');label(423,167,state?'15 cm':'300 cm');label(220,160,'1 ∶ 20');break;
  case 10:line(70,235,460,235);line(70,235,70,35);label(65,254,'0');if(state){line(70,235,180,235,blue);line(180,235,180,73,blue,true);box(174,67,12,12,red);label(122,211,'40 cm');label(234,148,'70 cm')}break;

  case 12:room();if(state){box(213,65,75,150,sand);box(289,107,40,55,pale)}else{box(138,65,150,75,sand);box(187,141,55,40,pale)}note('120 × 60 cm   /   6 × 3 cm','120 × 60 cm   /   6 × 3 cm');break;

  case 14:table(58,75,102,125);line(435,55,435,230);box(160,111,state?148:89,60,pale);dim(state?308:249,210,435,210,state?'65 cm':'95 cm');break;
  case 15:box(50,65,118,148,sand);box(360,65,95,148,pale);if(state)box(168,103,92,68,'#e5cfb6');dim(state?260:168,225,360,225,state?'52 cm':'100 cm');break;

const units=JSON.parse(document.querySelector('#rows').textContent);

const live=[...document.querySelectorAll('#evidence textarea')];copy.querySelectorAll('#evidence textarea').forEach((x,i)=>x.textContent=live[i].value);

const a=document.createElement('a'),url=URL.createObjectURL(new Blob(['<!doctype html>'+copy.outerHTML],{type:'text/html;charset=utf-8'}));a.href=url;a.download='Masaarat-room-'+locale+'-'+unit.n+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);document.querySelector('#status').textContent=ar?'تم تجهيز النسخة القابلة للتعديل.':'Editable copy prepared.'};

// A rectangular room rehearsal. Measurements are stored per edition and shared across its lessons.
(function(){
const mount=document.querySelector('#plan-lab');if(!mount)return;
const ar=document.documentElement.dir==='rtl',t=(en,arText)=>ar?arText:en;
const defaultLayout=()=>[{x:30,y:20,w:120,d:60},{x:220,y:180,w:100,d:60}];
const defaults=()=>({w:400,d:300,variant:'A',layouts:{A:defaultLayout(),B:defaultLayout()}});
const key='masaarat-room-lab-v1-'+unit.l;
let p=defaults();try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s&&s.layouts?.A?.length===2&&s.layouts?.B?.length===2&&s.w>0&&s.d>0&&['A','B'].includes(s.variant))p=s}catch{}
const fields=(host,items,obj)=>items.forEach(([k,label])=>{const wrap=document.createElement('label'),inp=document.createElement('input');wrap.textContent=label;inp.type='number';inp.step='any';inp.min=k==='x'||k==='y'?'0':'0.1';inp.value=obj[k];inp.addEventListener('input',()=>{obj[k]=inp.value===''?null:inp.valueAsNumber;draw()});wrap.append(inp);host.append(wrap)});
const el=(tag,txt)=>{const a=document.createElement(tag);if(txt)a.textContent=txt;return a};
mount.append(el('h2',t('Test two rectangular layouts','جرّب توزيعين لغرفة مستطيلة')),el('p',t('Replace the example centimetres with your measurements. The origin is the top-left corner. X runs right, Y runs down. Test doors and people separately on your measured plan.','استبدل أبعاد المثال بقياساتك بالسنتيمتر. نقطة الأصل هي الزاوية العليا اليسرى. يتجه المحور الأول يمينًا والثاني إلى الأسفل. افحص حركة الأبواب والأشخاص على مخططك المقاس.')));
const room=el('div');room.className='numbers';mount.append(room);fields(room,[['w',t('Room width (cm)','عرض الغرفة (سم)')],['d',t('Room depth (cm)','عمق الغرفة (سم)')]],p);
const tabs=el('div');tabs.className='actions';mount.append(tabs);
const pieces=el('div'),drawing=el('figure'),result=el('output');result.setAttribute('aria-live','polite');mount.append(pieces,drawing,result);
for(const v of ['A','B']){const b=el('button',t('Layout ','توزيع ')+v);tabs.append(b);b.onclick=()=>{p.variant=v;edit();draw()}}
function edit(){pieces.replaceChildren();[...tabs.children].forEach((b,i)=>{const active=p.variant===['A','B'][i];b.className=active?'':'secondary';b.setAttribute('aria-pressed',String(active))});p.layouts[p.variant].forEach((obj,i)=>{const field=el('fieldset');field.append(el('legend',t('Piece ','قطعة ')+(i+1)));const inputs=el('div');inputs.className='numbers';fields(inputs,[['x',t('X from left','البعد من اليسار')],['y',t('Y from top','البعد من الأعلى')],['w',t('Width','العرض')],['d',t('Depth','العمق')]],obj);field.append(inputs);const rotate=el('button',t('Quarter turn','تدوير ربع دورة'));rotate.className='secondary';rotate.onclick=()=>{[obj.w,obj.d]=[obj.d,obj.w];edit();draw()};field.append(rotate);pieces.append(field)})}
function draw(){const [a,b]=p.layouts[p.variant],valid=[p.w,p.d,...[a,b].flatMap(k=>[k.w,k.d])].every(v=>Number.isFinite(v)&&v>0)&&[a.x,a.y,b.x,b.y].every(v=>Number.isFinite(v)&&v>=0);
if(!valid){drawing.replaceChildren();result.textContent=t('Enter a valid dimension in each field.','أدخل بُعدًا صالحًا في كل حقل.');return}
const overlap=a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.d&&b.y<a.y+a.d;
const outside=[a,b].some(k=>k.x+k.w>p.w||k.y+k.d>p.d);const scale=Math.min(450/p.w,250/p.d),rw=p.w*scale,rh=p.d*scale;
let svg='<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" direction="ltr" viewBox="-4 -4 460 260"><rect x="0" y="0" width="'+rw+'" height="'+rh+'" fill="#f9fbfd" stroke="#273d51" stroke-width="3"/>';
[a,b].forEach((k,i)=>{const x=k.x*scale,y=k.y*scale,w=k.w*scale,h=k.d*scale;svg+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+['#e4bc91','#a8cdb8'][i]+'" stroke="#273d51" stroke-width="2"/><text x="'+(x+w/2)+'" y="'+(y+h/2)+'" font-size="16" text-anchor="middle" dominant-baseline="middle">'+(i+1)+'</text>'});drawing.innerHTML=svg+'</svg>';
result.textContent=outside?t('A piece crosses the room boundary. Revise its position or size.','تتجاوز قطعة حدود الغرفة. راجع موضعها أو أبعادها.'):overlap?t('The two footprints overlap. Change a position and check again.','يتداخل مسقطا القطعتين. غيّر الموضع وأعد الفحص.'):t('Both footprints fit without overlap. Test the route and moving parts next.','يتّسع المخطط للقطعتين من دون تداخل. افحص المسار والأجزاء المتحركة بعد ذلك.');
try{localStorage.setItem(key,JSON.stringify(p))}catch{}}
edit();draw();
})();
