<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Business concept 3 — clasp line">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 150 Q60 90 100 90" stroke="#A8C4E6" stroke-width="18"/>
    <path d="M170 150 Q140 90 100 90" stroke="#A8C4E6" stroke-width="18"/>
    <path d="M55 120 Q75 75 100 75" stroke="#A8E6CF" stroke-width="16"/>
    <path d="M145 120 Q125 75 100 75" stroke="#C9B6E4" stroke-width="16"/>
    <rect x="92" y="55" width="16" height="80" rx="6" fill="#A8E6CF"/>
    <polygon points="92,135 108,135 100,148" fill="#A8E6CF"/>
  </g>
  <!-- clasp line slides across pillar -->
  <line x1="100" y1="98" x2="100" y2="98" stroke="#C9B6E4" stroke-width="5" stroke-linecap="round">
    <animate attributeName="x1" values="100;78" dur="1.2s" begin="0.3s" fill="freeze"/>
    <animate attributeName="x2" values="100;122" dur="1.2s" begin="0.3s" fill="freeze"/>
  </line>
  <circle cx="100" cy="98" r="3" fill="#C9B6E4" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.4s" fill="freeze"/>
  </circle>
</svg>
