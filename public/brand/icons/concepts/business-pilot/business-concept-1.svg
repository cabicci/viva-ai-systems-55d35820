<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Business concept 1 — briefcase block">
  <!-- Masaarat logo base: two converging arcs + central pillar -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer arcs (blue) -->
    <path d="M30 150 Q60 90 100 90" stroke="#A8C4E6" stroke-width="18"/>
    <path d="M170 150 Q140 90 100 90" stroke="#A8C4E6" stroke-width="18"/>
    <!-- inner arcs mint + lilac -->
    <path d="M55 120 Q75 75 100 75" stroke="#A8E6CF" stroke-width="16"/>
    <path d="M145 120 Q125 75 100 75" stroke="#C9B6E4" stroke-width="16"/>
    <!-- central pillar -->
    <rect x="92" y="55" width="16" height="80" rx="6" fill="#A8E6CF" stroke="none"/>
    <polygon points="92,135 108,135 100,148" fill="#A8E6CF"/>
  </g>
  <!-- subtle briefcase block fades + scales in -->
  <g transform-origin="100px 170px">
    <rect x="84" y="160" width="32" height="18" rx="4" fill="#C9B6E4" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.4;1" dur="1.2s" begin="0.4s" fill="freeze" additive="sum"/>
    </rect>
  </g>
</svg>
