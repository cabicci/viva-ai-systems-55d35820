    <text class="t" x="165" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#2B3A55">Save Rate</text>
    <text class="t" x="165" y="454" text-anchor="middle" font-size="13" fill="#6B7A93">معدّل الحفظ</text>
  </g>
  <g>
