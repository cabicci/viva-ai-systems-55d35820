    <text class="t" x="635" y="392" text-anchor="middle" font-size="22" fill="#2B3A55">+</text>
    <text class="t" x="635" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#2B3A55">Follow Rate</text>
    <text class="t" x="635" y="454" text-anchor="middle" font-size="13" fill="#6B7A93">معدّل المتابعة</text>
  </g>
